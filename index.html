    // MOCK google.script.run (API SHIM FOR GITHUB PAGES / PWA)

    if (typeof google === 'undefined') {
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzwo0OKU0N23hcOHsnsOwff9IjDkBrv3_iSGOqz_pWXwLZG_FQAhyPn6jutJ9JRv4S0mA/exec";
        window.google = { script: { run: {} } };

        const handler = {
            get: function (target, prop) {
                if (prop === 'withSuccessHandler') {
                    return function (callback) {
                        target._success = callback;
                        return new Proxy(target, handler);
                    };
                }
                if (prop === 'withFailureHandler') {
                    return function (callback) {
                        target._failure = callback;
                        return new Proxy(target, handler);
                    };
                }

                return function (...args) {
                    const successCb = target._success;
                    const failureCb = target._failure;

                    fetch(GAS_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            function: prop,
                            args: args
                        }),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    })
                        .then(res => res.json())
                        .then(data => {
                            if (data.status === 'success' && successCb) {
                                successCb(data.result);
                            } else if (data.status === 'error' && failureCb) {
                                failureCb(data.message);
                            }
                        })
                        .catch(err => {
                            if (failureCb) failureCb(err.toString());
                        });

                    target._success = null;
                    target._failure = null;
                };
            }
        };
        window.google.script.run = new Proxy({}, handler);
        console.log('GAS API Shim initialized.');
    }

    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        if (!container) {
            console.error('Toast container missing for:', message);
            return;
        }

        const toast = document.createElement('div');
        toast.className = 'toast-msg ' + type;

        let icon = 'info';
        if (type === 'error') icon = 'error_outline';
        if (type === 'success') icon = 'check_circle';
        if (type === 'warning') icon = 'warning';

        toast.innerHTML = `<span class="material-icons toast-icon ${type === 'error' ? 'text-red-500' : type === 'success' ? 'text-green-500' : 'text-yellow-500'}">${icon}</span><div class="toast-content">${message}</div>`;

            toast.classList.remove('show');
            setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 400);
        }, 4000);
    }

    // Helper: Parse Date (DD/MM/YYYY or YYYY-MM-DD)
    function parseIndoDate(str) {
        if (!str || str === '-' || typeof str !== 'string') return null;
        let d;
        // Normalize format: replace - with /
        let normalized = str.trim().replace(/-/g, '/');
        if (normalized.includes('/')) {
            const p = normalized.split('/');
            if (p.length === 3) {
                // DD/MM/YYYY or MM/DD/YYYY? 
                // We assume DD/MM/YYYY for Indo
                if (p[2].length === 4) {
                    d = new Date(p[2], parseInt(p[1]) - 1, parseInt(p[0]));
                } else if (p[0].length === 4) {
                    d = new Date(p[0], parseInt(p[1]) - 1, parseInt(p[2]));
                } else {
                    d = new Date(str);
                }
            }
        } else {
            d = new Date(str);
        }
        return (d && !isNaN(d.getTime())) ? d : null;
    }

    // Helper: Fix Google Drive URLs
    function fixDriveUrl(url) {
        if (!url || typeof url !== 'string') return '';
        let link = url.trim();
        // Jika format drive.google.com/file/d/ID/view atau drive.google.com/open?id=ID
        const driveRegex = /(?:drive\.google\.com\/(?:file\/d\/|open\?id=)|docs\.google\.com\/uc\?id=)([a-zA-Z0-9_-]{25,})/;
        const match = link.match(driveRegex);
        if (match && match[1]) {
            return 'https://lh3.googleusercontent.com/d/' + match[1];
        }
        return link;
    }

    function renderCalendar() {
        const y = calCurrentDate.getFullYear(), m = calCurrentDate.getMonth();
        const names = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        const title = document.getElementById('cal-modal-title');
        if (title) title.innerText = names[m] + ' ' + y;
        const firstDay = new Date(y, m, 1).getDay();
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        const today = new Date();
        const prefix = y + '-' + String(m + 1).padStart(2, '0');
        const hdSet = {};
        HOLIDAYS_2026.forEach(h => { if (h.date.startsWith(prefix)) hdSet[parseInt(h.date.split('-')[2])] = h.name; });
        let html = '';
        for (let i = 0; i < firstDay; i++) html += '<div></div>';
        for (let d = 1; d <= daysInMonth; d++) {
            const isToday = y === today.getFullYear() && m === today.getMonth() && d === today.getDate();
            const isHol = !!hdSet[d];
            const isPayDay = d === 1 || d === 10;
            const dateStr = prefix + '-' + String(d).padStart(2, '0');
            const note = localStorage.getItem('calNote_' + dateStr);
            let cls = 'w-9 h-9 rounded-full flex items-center justify-center text-xs font-bold mx-auto cursor-pointer relative transition-all ';
            if (isToday) cls += 'bg-blue-600 text-white shadow-lg scale-110';
            else if (isHol) cls += 'bg-red-50 text-red-600 border border-red-200';
            else if (isPayDay) cls += 'bg-emerald-50 text-emerald-600 border border-emerald-200';
            else cls += 'text-gray-600 hover:bg-gray-100';
            const dot = (isPayDay && !isToday) ? '<span class="absolute -top-0.5 right-0 w-1.5 h-1.5 bg-emerald-400 rounded-full"></span>' : '';
            const noteDot = note ? '<span class="absolute bottom-0 right-0 w-1.5 h-1.5 bg-blue-500 rounded-full"></span>' : '';
            let titleTooltip = '';
            if (hdSet[d]) titleTooltip += `<div class="font-bold text-red-400 mb-1">${hdSet[d]}</div>`;
            if (note) titleTooltip += `<div class="font-bold text-blue-300">Catatan:</div><div class="font-normal text-gray-200">${note}</div>`;
            const evtAttr = titleTooltip ? `onmouseenter="showCalTooltip(event, '${encodeURIComponent(titleTooltip)}')" onmouseleave="hideCalTooltip()"` : '';
            html += `<div class="text-center py-0.5"><div class="${cls}" ${evtAttr} onclick="addCalendarNote('${dateStr}')">${d}${dot}${noteDot}</div></div>`;
        }
        const cel = document.getElementById('calendar-days');
        if (cel) cel.innerHTML = html;
        const lEl = document.getElementById('holiday-list');
        if (lEl) {
            const mH = HOLIDAYS_2026.filter(h => h.date.startsWith(prefix));
            lEl.innerHTML = mH.length ? mH.map(h => `<div class="flex items-center gap-2 p-2 bg-red-50 rounded-lg border border-red-100 mb-1"><span class="w-6 h-6 flex items-center justify-center bg-red-500 text-white text-[10px] font-black rounded-full">${parseInt(h.date.split('-')[2])}</span><span class="text-xs font-bold text-red-700">${h.name}</span></div>`).join('')
                + '<div class="flex items-center gap-2 p-2 bg-emerald-50 rounded-lg border border-emerald-100 mt-2"><span class="material-icons text-emerald-600 text-sm">payments</span><span class="text-xs font-bold text-emerald-700">Tgl 1 & 10: Penggajian</span></div>'
                : '<p class="text-xs text-gray-400 italic text-center py-2">Tidak ada hari libur nasional bulan ini.</p>';

    // ============================================================

    let loaderProgressInterval = null;
    function showLoader(show, text = 'Memproses Data...') {
        const el = document.getElementById('loader');
        const txt = document.getElementById('loader-text');
        const bar = document.getElementById('loader-progress');
        const pct = document.getElementById('loader-percent');
        if (!el) return;

        if (show) {
            if (txt) txt.innerText = text;
            el.classList.remove('hidden');
            el.classList.add('flex');

            // Reset progress
            let currentPct = 0;
            if (bar) bar.style.width = '0%';
            if (pct) pct.innerText = '0% SELESAI';

            // Jalankan increment sekali di awal agar tidak ada delay visual 0%
            const updateProgress = () => {
                if (currentPct < 90) {
                    currentPct += Math.random() * 6;
                    if (currentPct > 90) currentPct = 90;
                    if (bar) bar.style.width = currentPct + '%';
                    if (pct) pct.innerText = Math.floor(currentPct) + '% SELESAI';
                }
            };
            updateProgress();

            // Simulasi progress yang jauh lebih cepat (120ms) agar terasa sangat responsif dan hidup
            clearInterval(loaderProgressInterval);
            loaderProgressInterval = setInterval(updateProgress, 120);
        } else {
            // Lompat langsung ke 100% lalu sembunyikan dengan cepat
            if (bar) bar.style.width = '100%';
            if (pct) pct.innerText = '100% SELESAI';

            setTimeout(() => {
                clearInterval(loaderProgressInterval);
                el.classList.add('hidden');
                el.classList.remove('flex');
            }, 150); // Mempercepat penutupan dari 300ms ke 150ms
        }
    }

    function showConfirm(title, message, onOk) {
        const modal = document.getElementById('custom-confirm-modal');
        const card = document.getElementById('custom-confirm-card');
        if (!modal || !card) return;

        document.getElementById('custom-confirm-title').innerText = title;
        document.getElementById('custom-confirm-message').innerText = message;

        // Clone button → hapus semua event listener lama
        const oldCancel = document.getElementById('custom-confirm-cancel');
        const oldOk = document.getElementById('custom-confirm-ok');
        const btnCancel = oldCancel.cloneNode(true);
        const btnOk = oldOk.cloneNode(true);
        oldCancel.parentNode.replaceChild(btnCancel, oldCancel);
        oldOk.parentNode.replaceChild(btnOk, oldOk);

        modal.classList.remove('hidden');
        modal.classList.add('flex');
        setTimeout(() => {
            card.style.opacity = '1';
            card.style.transform = 'scale(1)';
        }, 10);

        const close = () => {
            card.style.opacity = '0';
            card.style.transform = 'scale(0.95)';
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 150);
        };

        btnCancel.onclick = close;
        btnOk.onclick = () => { close(); onOk(); };
    }
    // ============================================================
    // LOGIN
    // ============================================================
    function handleLogin() {
        const u = (document.getElementById('login-user').value || '').toLowerCase().trim();
        const p = document.getElementById('login-pass').value || '';
        const errBox = document.getElementById('login-error');
        const errMsg = document.getElementById('login-error-msg');
        const showError = (msg) => {
            if (errBox && errMsg) {
                errMsg.innerText = msg;
                errBox.classList.remove('hidden');
            } else {
                showToast(msg, 'warning');
            }
        };

        if (errBox) errBox.classList.add('hidden');

        if (!u || !p) return showError('Username dan Password harus diisi!');

        const btn = document.getElementById('login-btn');
        if (btn) { btn.innerText = 'Memeriksa...'; btn.disabled = true; }

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(res => {
                    if (btn) { btn.innerText = 'Masuk ke Sistem'; btn.disabled = false; }
                    if (res && res.success) loginSuccess(res.data);
                    else showError('Akses ditolak: ' + (res ? res.error : 'Username/Password salah.'));
                })
                .withFailureHandler(err => {
                    if (btn) { btn.innerText = 'Masuk ke Sistem'; btn.disabled = false; }
                    showError('Gagal terhubung ke server: ' + err);
                })
                .verifyUserLogin(u, p);
        } else {
            if (btn) { btn.innerText = 'Masuk ke Sistem'; btn.disabled = false; }
            console.log('Local environment detected, bypassing login for testing.');
            loginSuccess({ nama: u, user: u, role: 'Admin', foto: '' });
        }
    }

    function toggleLoginPass() {
        const inp = document.getElementById('login-pass');
        const eye = document.getElementById('login-pass-eye');
        if (!inp || !eye) return;
        inp.type = inp.type === 'password' ? 'text' : 'password';
        eye.innerText = inp.type === 'password' ? 'visibility_off' : 'visibility';
    }

    function loginSuccess(userData) {
        document.getElementById('login-overlay').classList.add('hidden');
        const wrapper = document.getElementById('app-wrapper');
        if (wrapper) wrapper.classList.remove('hidden');
        const nameEl = document.getElementById('header-user-name');
        const roleEl = document.getElementById('header-user-role');
        if (nameEl) nameEl.innerText = userData.nama || userData.user;
        if (roleEl) roleEl.innerText = userData.role || 'User';
        // Load avatar
        if (userData.foto) {
            localStorage.setItem('LOSHRIS_AVATAR', userData.foto);
        }
        const av = localStorage.getItem('LOSHRIS_AVATAR');
        if (av) {
            const m = document.getElementById('user-avatar-main');
            if (m) m.innerHTML = `<img src="${av}" class="w-full h-full object-cover rounded-xl">`;
        }

        window.currentUserRole = userData.role || 'User';
        window.currentUserOutlet = '';
        (function () {
            var RESTRICTED = ['outlet leader', 'admin cabang'];
            var roleLC = window.currentUserRole.toLowerCase();
            var isRestricted = RESTRICTED.some(function (p) { return roleLC.startsWith(p); });
            if (isRestricted) {
                var parts = window.currentUserRole.split('-');
                if (parts.length > 1) {
                    window.currentUserOutlet = parts.slice(1).join('-').trim();
                }
            }
        })();
        if (typeof applyAccessControl === 'function') applyAccessControl();
        loadAllDataBackground();
        switchView('dashboard');
        setTimeout(initDashboard, 600);
    }

    function applyAccessControl() {
        // Tampilkan semua nav item dulu
        document.querySelectorAll('[onclick^="switchView"]').forEach(el => el.classList.remove('hidden'));
        var RESTRICTED = ['outlet leader', 'admin cabang'];
        var roleLC = (window.currentUserRole || '').toLowerCase();
        var isRestricted = RESTRICTED.some(function (p) { return roleLC.startsWith(p); });
        if (isRestricted) {
            // Outlet Leader mode view aja: sembunyikan tombol tambah, edit, dan hapus karyawan
            document.querySelectorAll('button[onclick="openAddModal()"], button[onclick="openEditModal()"], button[onclick="deleteCurrentEmployee()"]').forEach(el => el.classList.add('hidden'));

            // Outlet Leader hanya boleh: dashboard, employees (outlet-nya), training, performance, uniform, complaint/cuti
            var forbiddenViews = ['payroll', 'documents', 'sembako', 'recruitment', 'settings', 'hrtask', 'library', 'thr', 'company', 'hrissetting', 'laporanhr'];
            forbiddenViews.forEach(view => {
                document.querySelectorAll(`[onclick*="switchView('${view}')"]`).forEach(el => el.classList.add('hidden'));
                document.querySelectorAll(`[onclick*='switchView("${view}")']`).forEach(el => el.classList.add('hidden'));
            });
            var forbiddenNavIds = ['nav-payroll', 'nav-documents', 'nav-sembako', 'nav-recruitment', 'nav-settings', 'nav-hrtask', 'nav-library', 'nav-thr', 'nav-company', 'nav-hrissetting', 'nav-laporanhr'];
            forbiddenNavIds.forEach(function (id) {
                var el = document.getElementById(id);
                if (el) el.classList.add('hidden');
            });
        }
    }

        document.getElementById('login-overlay').classList.remove('hidden');

    function switchView(viewId) {
        try {
            const titleEl = document.getElementById('page-title');
            if (titleEl) titleEl.innerText = PAGE_TITLES[viewId] || 'KONEKTA';

            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            const viewEl = document.getElementById('view-' + viewId);
            if (viewEl) viewEl.classList.remove('hidden');

            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('bg-blue-50', 'text-primary', 'font-medium');
                el.classList.add('text-gray-600');
            });
            const activeNav = document.getElementById('nav-' + viewId);
            if (activeNav) {
                activeNav.classList.remove('text-gray-600');
                activeNav.classList.add('bg-blue-50', 'text-primary', 'font-medium');
            }

            if (viewId === 'dashboard') { updateDashboardStats(); }
            else if (viewId === 'employees') { if (!globalEmployees.length) loadMasterData(); else renderEmployees(); }
            else if (viewId === 'payroll') { if (!globalEmployees.length) loadMasterData(); else renderPayrollMass(); }
            else if (viewId === 'sembako') { if (!globalEmployees.length) loadMasterData(); else renderSembako(); }
            else if (viewId === 'documents') { if (!globalEmployees.length) loadMasterData(); }
            else if (viewId === 'uniform') {
                if (!uniformData.length) syncUniformModule();
                else { renderUniform(); renderVendorList(); }
            }
            else if (viewId === 'recruitment') {
                if (!candidatesLoaded) loadCandidatesFromSheet();
                else renderCandidates();
                updateScheduleBadge();
            }
            else if (viewId === 'thr') {
                if (!globalEmployees.length) loadMasterData();
                else renderTHR();
            }
            else if (viewId === 'hrtask') {
                if (!hrTasksLoaded) loadHRTaskData();
                else switchHRTaskTab('daily');
            }
            else if (viewId === 'performance') {
                if (!globalEmployees.length) loadMasterData();
                else renderPerformance();
            }
            else if (viewId === 'training') {
                if (!trainings.length) loadTrainingData();
                else renderTraining();
            }
            else if (viewId === 'library') {
                if (!libraryCache.length) syncLibrary();
                else { renderLibrary(); const ls = parseInt(localStorage.getItem('LOSHRIS_LIBRARY_LAST_SYNC') || '0'); if (Date.now() - ls > 5 * 60 * 1000) syncLibrary(true); }
            }
        } catch (e) { console.error('switchView error:', e); }
    }

    function loadMasterDataBackground() {

            google.script.run.withSuccessHandler(processMasterData).getMasterData(true);

    function loadAllDataBackground() {
        if (typeof google === 'undefined' || !google.script || !google.script.run) return;

        // 1. Master Data (Dashboard stats depend on this)
        google.script.run.withSuccessHandler(processMasterData).getMasterData(true);
        google.script.run.syncTransisiHrisToMaster();

        // 2. Uniform Data
        google.script.run.withSuccessHandler(data => {
            uniformData = data;
            localStorage.setItem('LOSHRIS_UNIFORM', JSON.stringify(uniformData));
            renderUniform();
        }).getUniformData();

        // 3. Vendor Data
        google.script.run.withSuccessHandler(data => {
            vendorData = data;
            localStorage.setItem('LOSHRIS_VENDORS', JSON.stringify(vendorData));

        }).getVendorData();

    function loadMasterData() {
        showLoader(true);
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(data => {
                    showLoader(false); // Paksa matikan animasi loading duluan
                    try {
                        processMasterData(data);
                    } catch (err) {
                        console.error(err);
                        showToast("Ada error saat merender tabel: " + err.message, 'error');
                    }
                })
                .withFailureHandler(err => {
                    showLoader(false);
                    showToast('Gagal mengambil data dari Google Sheets: ' + err, 'error');
                })
                .getMasterData(true);
            google.script.run.syncTransisiHrisToMaster();
        } else { showLoader(false); }
    }

    function processMasterData(data) {
        if (!data || !Array.isArray(data)) return;

        const RESTRICTED_ROLES = ['outlet leader', 'admin cabang'];
        const roleLC = (window.currentUserRole || '').toLowerCase();
        const isRestricted = RESTRICTED_ROLES.some(p => roleLC.startsWith(p));
        const OFFICE_KEYWORDS = ['kantor', 'office', 'hq', 'pusat', 'head office'];

        let filteredData = data;
        if (isRestricted) {
            if (window.currentUserOutlet) {
                const outlet = window.currentUserOutlet.toLowerCase();
                filteredData = data.filter(e => {
                    const p = String(e['Penempatan'] || '').toLowerCase().trim();
                    if (!p) return false;
                    if (OFFICE_KEYWORDS.some(kw => p.includes(kw))) return false;
                    return p.includes(outlet);
                });
            } else {
                filteredData = [];
            }
        }

        globalEmployees = filteredData;
        aktifList = filteredData.filter(e => e._isAktif !== false);
        tidakAktifList = filteredData.filter(e => e._isAktif === false);
        populateBranchSelect();
        renderEmployees();
        try { renderPayrollMass(); } catch (e) { }
        try { renderSembako(); } catch (e) { }
        try { renderTHR(); } catch (e) { }
        try { renderPerformance(); } catch (e) { }
        updateDashboardStats();
    }

    // ============================================================
    // MASTER DATA — RENDER
    // Tab: aktif | tidakaktif | warning | updated | sp
    // ============================================================
    function renderEmployees(data) {
        const tbody = document.getElementById('employee-table-body');
        if (!tbody) return;

        // Pilih sumber berdasarkan tab
        let source;
        if (currentEmployeeTab === 'tidakaktif') source = [...tidakAktifList];
        else source = [...aktifList];

        // Filter tambahan
        const q = (currentEmpFilter.search || '').toLowerCase();
        const branch = currentEmpFilter.branch || '';
        const status = currentEmpFilter.status || '';
        if (q) source = source.filter(r => String(r['Nama Lengkap'] || '').toLowerCase().includes(q) || String(r['NIK'] || '').toLowerCase().includes(q) || String(r['Penempatan'] || '').toLowerCase().includes(q));
        if (branch) source = source.filter(r => (r['Penempatan'] || '') === branch);
        if (status) source = source.filter(r => String(r['Status'] || '').toLowerCase().includes(String(status).toLowerCase()));

        const now = new Date();
        const in30 = new Date(); in30.setDate(in30.getDate() + 30);
        let warnCount = 0, spCount = 0;

        // Tab khusus: warning
        const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        if (currentEmployeeTab === 'warning') {
            source = aktifList.filter(r => {
                const kd = r['Perbarui Kontrak'];
                if (!kd || kd === '-') return false;
                const d = parseIndoDate(kd);
                if (!d) return false;
                // Strip time for clean day diff
                const dStart = new Date(d.getFullYear(), d.getMonth(), d.getDate());
                const diff = Math.ceil((dStart - todayStart) / 86400000);
                return diff <= 30 && !updatedContracts.includes(r['NIK']);
            });
        }
        if (currentEmployeeTab === 'updated') {
            source = aktifList.filter(r => updatedContracts.includes(r['NIK']));
        }
        if (currentEmployeeTab === 'sp') {
            source = aktifList.filter(r => {
                const sp = (r['Peringatan'] || '-').trim();
                return sp !== '-' && sp !== '' && sp.toLowerCase() !== 'tidak ada';
            });
        }

        // Hitung badge
        aktifList.forEach(r => {
            const kd = r['Perbarui Kontrak'];
            if (kd && kd !== '-') {
                const d = parseIndoDate(kd);
                if (d) {
                    const dStart = new Date(d.getFullYear(), d.getMonth(), d.getDate());
                    const diff = Math.ceil((dStart - todayStart) / 86400000);
                    if (diff <= 30 && !updatedContracts.includes(r['NIK'])) warnCount++;
                }
            }
            const sp = (r['Peringatan'] || '-').trim();
            if (sp !== '-' && sp !== '' && sp.toLowerCase() !== 'tidak ada') spCount++;
        });

        // Update badge counts
        const bW = document.getElementById('emp-badge-warning');
        if (bW) { bW.innerText = warnCount; bW.classList.toggle('hidden', warnCount === 0); }
        const bS = document.getElementById('emp-badge-sp');
        if (bS) { bS.innerText = spCount; bS.classList.toggle('hidden', spCount === 0); }
        const bTA = document.getElementById('emp-badge-tidakaktif');
        if (bTA) { bTA.innerText = tidakAktifList.length; bTA.classList.toggle('hidden', !tidakAktifList.length); }

        if (!source.length) {
            tbody.innerHTML = `<tr><td colspan="7" class="py-16 text-center">
      <div class="flex flex-col items-center gap-3 text-gray-400">
        <span class="material-icons text-5xl opacity-30">search_off</span>
        <p class="font-medium text-sm">Tidak ada data ditemukan</p>
      </div></td></tr>`;
            return;
        }

        tbody.innerHTML = source.map((row, i) => {
            const idKaryawan = row['ID Karyawan'] || '-';
            const name = row['Nama Lengkap'] || '-';
            const nik = row['NIK'] || '-';
            const branch2 = row['Penempatan'] || '-';
            const st = row['Status'] || '-';
            const isAktif = row._isAktif !== false;

            // Cek kontrak warning
            let contractBadge = '';
            const kd = row['Perbarui Kontrak'];
            if (kd && kd !== '-') {
                const d = parseIndoDate(kd);
                if (d) {
                    const diff = Math.ceil((d - now) / 86400000);
                    if (!updatedContracts.includes(nik)) {
                        if (diff < 0) contractBadge = `<span class="ml-1 text-[8px] bg-red-500 text-white px-1.5 py-0.5 rounded-full font-black">EXPIRED</span>`;
                        else if (diff <= 30) contractBadge = `<span class="ml-1 text-[8px] bg-amber-500 text-white px-1.5 py-0.5 rounded-full font-black">${diff}h</span>`;
                    }
                }
            }

            // Avatar
            const fotoUrl = fixDriveUrl(row['Foto']);
            const colorPool = ['#3B82F6', '#8B5CF6', '#EC4899', '#F59E0B', '#10B981', '#EF4444'];
            const avatarColor = colorPool[name.charCodeAt(0) % colorPool.length];
            const photoHtml = (fotoUrl.startsWith('http') || fotoUrl.startsWith('data:image'))
                ? `<div class="w-10 h-10 rounded-xl overflow-hidden border border-gray-100 shadow-sm cursor-zoom-in hover:opacity-80 transition" onclick="event.stopPropagation(); window.showImagePopup('${fotoUrl}', '${name}')"><img src="${fotoUrl}" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='<div class=\\'w-10 h-10 rounded-xl flex items-center justify-center text-white font-black text-xs\\' style=\\'background:${avatarColor};\\'>${name.charAt(0)}</div>'"></div>`
                : `<div class="w-10 h-10 rounded-xl flex items-center justify-center text-white font-black text-xs shadow-sm" style="background:${avatarColor};">${name.charAt(0)}</div>`;

            // Status badge
            const stLower = st.toLowerCase();
            let stBadgeClass = 'bg-emerald-100 text-emerald-700 border border-emerald-200';
            if (stLower.includes('probation')) stBadgeClass = 'bg-blue-100 text-blue-700 border border-blue-200';
            else if (stLower.includes('kontrak 1')) stBadgeClass = 'bg-indigo-100 text-indigo-700 border border-indigo-200';
            else if (stLower.includes('kontrak 2')) stBadgeClass = 'bg-purple-100 text-purple-700 border border-purple-200';
            else if (!isAktif) stBadgeClass = 'bg-red-100 text-red-600 border border-red-200';

            const globalIdx = globalEmployees.findIndex(e => e.rowIdx === row.rowIdx);
            const rowDelay = (i % 15) * 0.03; // Stagger effect for first 15 visible rows

            return `<tr class="hover:bg-slate-50 cursor-pointer transition-all border-b border-gray-100 group stagger-row ${!isAktif ? 'opacity-70' : ''}"
              style="animation-delay: ${rowDelay}s"
              onclick="openEmployeeDrawer(${globalIdx})">
      <td class="px-4 py-3">${photoHtml}</td>
      <td class="px-4 py-3 text-xs font-bold font-mono text-gray-700">${idKaryawan}</td>
      <td class="px-4 py-3">
        <p class="font-bold text-gray-700 font-mono text-xs tracking-wide">${nik}</p>
        ${contractBadge}
      </td>
      <td class="px-4 py-3">
        <p class="font-semibold text-gray-900 ${!isAktif ? 'line-through text-gray-400' : ''}">${name}</p>
        <p class="text-[10px] text-gray-400 mt-0.5">@${row['Nama Panggilan'] || '-'}</p>
      </td>
      <td class="px-4 py-3 text-gray-600 text-xs font-medium">${row['Posisi'] || '-'}</td>
      <td class="px-4 py-3">
        <span class="inline-flex items-center gap-1 text-xs text-gray-500">
          <span class="material-icons text-[14px] text-gray-400">storefront</span>${branch2}
        </span>
      </td>
      <td class="px-4 py-3">
        <div class="flex items-center gap-2">
          <span class="px-2.5 py-1 rounded-lg text-[10px] font-bold ${stBadgeClass}">${st}</span>
          ${(() => {
                    const dObj = parseIndoDate(kd);
                    if (!dObj) return '';
                    const diff = Math.ceil((new Date(dObj.getFullYear(), dObj.getMonth(), dObj.getDate()) - todayStart) / 86400000);
                    return (diff <= 30 && !updatedContracts.includes(nik))
                        ? `<button onclick="markContractUpdated('${nik}'); event.stopPropagation();" class="p-1 bg-emerald-50 text-emerald-600 rounded-lg hover:bg-emerald-100 border border-emerald-200" title="Tandai Sudah Diperbarui"><span class="material-icons text-[13px]">check_circle</span></button>` : '';
                })()}
        </div>
      </td>
    </tr>`;
        }).join('');
    }

    function filterEmployees() {
        currentEmpFilter = {
            search: document.getElementById('search-employee')?.value || '',
            branch: document.getElementById('filter-branch')?.value || '',
            status: document.getElementById('filter-status')?.value || ''
        };
        renderEmployees();
    }

    function switchEmployeeTab(tab) {
        currentEmployeeTab = tab;
        const tabs = ['aktif', 'tidakaktif', 'warning', 'updated', 'sp'];

        tabs.forEach(t => {
            const btn = document.getElementById('emp-tab-' + t);
            if (!btn) return;
            if (t === tab) {
                btn.classList.add('bg-primary', 'text-white', 'shadow');
                btn.classList.remove('text-gray-500', 'hover:bg-gray-50', 'bg-white');
            } else {
                btn.classList.remove('bg-primary', 'text-white', 'shadow');
                btn.classList.add('text-gray-500', 'hover:bg-gray-50', 'bg-white');
            }
        });

        // --- TAMBAHAN UNTUK MENAMPILKAN TOMBOL SP AKTIF ---
        const btnAddSp = document.getElementById('btn-add-sp');
        if (btnAddSp) {
            if (tab === 'sp') {
                btnAddSp.classList.remove('hidden'); // Muncul jika tab SP aktif diklik
            } else {
                btnAddSp.classList.add('hidden');    // Sembunyi jika tab lain diklik
            }
        }
        // --------------------------------------------------

        renderEmployees();
    }

    window.markContractUpdated = function (nik) {
        if (!updatedContracts.includes(nik)) {
            updatedContracts.push(nik);
            localStorage.setItem('LOSHRIS_UPDATED_CONTRACTS', JSON.stringify(updatedContracts));
            renderEmployees();
        }
    };

    function populateBranchSelect() {
        const sel = document.getElementById('filter-branch');
        if (!sel) return;
        const branches = [...new Set(globalEmployees.map(e => (e['Penempatan'] || '').trim()).filter(Boolean))].sort();
        const curr = sel.value;
        sel.innerHTML = '<option value="">Semua Cabang</option>' + branches.map(b => `<option value="${b}">${b}</option>`).join('');
        sel.value = curr;

        // Juga populate payroll settings
        const setsel = document.getElementById('set-branch-select');
        if (setsel) {
            const curS = setsel.value;
            setsel.innerHTML = '<option value="Global">Default / Global Rules</option>' + branches.map(b => `<option value="${b}">${b}</option>`).join('');
            setsel.value = curS || 'Global';
        }
        const bonusSel = document.getElementById('bonus-branch-sel');
        if (bonusSel) {
            bonusSel.innerHTML = '<option value="ALL">Semua Cabang</option>' + branches.map(b => `<option value="${b}">${b}</option>`).join('');
        }
    }

        try {

    // ============================================================
    // FILE UPLOAD — FOTO & KTP
    // Pastikan rowIdx ASLI dikirim ke server
    // ============================================================
    function handleFileUpload(event, fileType) {
        const file = event.target.files[0];
        if (!file) return;

        const emp = globalEmployees[currentDrawerIndex];
        if (!emp) return showToast('Pilih karyawan terlebih dahulu.', 'warning');

        const rowIdx = emp.rowIdx; // rowIdx ASLI dari spreadsheet
        if (!rowIdx) return showToast('rowIdx tidak valid. Muat ulang data dan coba lagi.', 'error');

        // Validasi tipe file
        if (!file.type.startsWith('image/')) return showToast('Hanya file gambar yang diizinkan.', 'warning');

        showLoader(true);
        const reader = new FileReader();
        reader.onload = function (e) {
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(res => {
                        showLoader(false);
                        if (res.success) {
                            // Update local state
                            if (fileType === 'FOTO') emp['Foto'] = res.url;
                            else emp['Foto KTP'] = res.url;
                            // Refresh preview di drawer
                            if (fileType === 'FOTO') {
                                const fImg = document.getElementById('img-preview-foto');
                                const nF = document.getElementById('no-foto-msg');
                                if (fImg) { fImg.src = res.url; fImg.classList.remove('hidden'); }
                                if (nF) nF.classList.add('hidden');
                                // Update avatar di drawer header
                                const av = document.getElementById('drawer-avatar');
                                if (av) av.innerHTML = `<img src="${res.url}" class="w-full h-full object-cover rounded-full">`;
                            } else {
                                const kImg = document.getElementById('img-preview-ktp');
                                const nK = document.getElementById('no-ktp-msg');
                                if (kImg) { kImg.src = res.url; kImg.classList.remove('hidden'); }
                                if (nK) nK.classList.add('hidden');
                            }
                            showToast('✅ ' + (fileType === 'FOTO' ? 'Foto profil' : 'Foto KTP') + ' berhasil diupload!', 'success');
                        } else {
                            showToast('❌ Gagal upload: ' + (res.error || 'Unknown error'), 'error');
                        }
                    })
                    .withFailureHandler(err => {
                        showLoader(false);
                        showToast('❌ Error: ' + err, 'error');
                    })
                    .uploadEmployeeFile(e.target.result, file.name, file.type, rowIdx, fileType);
            } else {
                showLoader(false);
                showToast('Google Script tidak tersedia.', 'warning');
            }
        };
        reader.readAsDataURL(file);
    }

        if (currentDrawerIndex === -1) return;
        const emp = globalEmployees[currentDrawerIndex];
        currentEditingIndex = currentDrawerIndex;
        document.getElementById('f-rowidx').value = emp.rowIdx || '';
        document.getElementById('modal-title').innerText = 'Edit Data Karyawan';
        const rowIdxEl = document.getElementById('f-rowidx');
        if (rowIdxEl) rowIdxEl.value = emp.rowIdx || '';
        const setVal = (id, val) => { const el = document.getElementById(id); if (el) el.value = val || ''; };
        setVal('f-idkaryawan', emp['ID Karyawan']);
        setVal('f-nama', emp['Nama Lengkap']);
        setVal('f-panggilan', emp['Nama Panggilan']);
        setVal('f-nik', emp['NIK']);
        setVal('f-email', emp['Email']);
        setVal('f-telp', emp['Telepon']);
        setVal('f-posisi', emp['Posisi']);
        setVal('f-cabang', emp['Penempatan']);
        setVal('f-domisili', emp['Domisili']);
        setVal('f-agama', emp['Agama']);
        setVal('f-anak', emp['Anak']);
        setVal('f-ttl', emp['TTL']);
        setVal('f-surat-keterangan', emp['Surat Keterangan']);
        setVal('f-bank', emp['Bank']);
        setVal('f-rekening', emp['Rekening']);
        setVal('f-atasnama', emp['Atas Nama']);
        setVal('f-daruratnama', emp['Darurat Nama']);
        setVal('f-darurathub', emp['Darurat Hubungan']);
        setVal('f-darurattelp', emp['Darurat Telp']);
        const fNikah = document.getElementById('f-nikah');
        if (fNikah) fNikah.value = emp['Pernikahan'] || 'Belum Menikah';
        const fSP = document.getElementById('f-sp');
        if (fSP) fSP.value = (emp['Peringatan'] && emp['Peringatan'] !== '-') ? emp['Peringatan'] : '-';
        // SESUDAH (mapping eksplisit):
        const fStatus = document.getElementById('f-status');
        if (fStatus) {
            const rawStatus = (emp['Status'] || '').toLowerCase();
            if (rawStatus.includes('kontrak i') && !rawStatus.includes('ii')) fStatus.value = 'Kontrak I';
            else if (rawStatus.includes('kontrak ii') || rawStatus.includes('kontrak 2')) fStatus.value = 'Kontrak II';
            else if (rawStatus.includes('kontrak 1')) fStatus.value = 'Kontrak I';
            else if (rawStatus.includes('resign') || rawStatus.includes('tidak aktif')) fStatus.value = 'Tidak Aktif/Resign';
            else fStatus.value = 'Probation';
        }
        const toInputDate = (str) => {
            if (!str || str === '-') return '';
            const s = str.trim();
            // Sudah format YYYY-MM-DD
            if (s.match(/^\d{4}-\d{2}-\d{2}/)) return s.substring(0, 10);
            // Format DD/MM/YYYY
            if (s.match(/^\d{2}\/\d{2}\/\d{4}/)) {
                const [d, m, y] = s.split('/');
                return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
            }
            // Format DD-MM-YYYY
            if (s.match(/^\d{2}-\d{2}-\d{4}/)) {
                const [d, m, y] = s.split('-');
                return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
            }
            return '';
        };

        setVal('f-tglmasuk', toInputDate(emp['Tgl Masuk']));
        setVal('f-tglkontrak', toInputDate(emp['Perbarui Kontrak']));
        document.getElementById('employee-modal').classList.remove('hidden');
    };

            renderEmployees();
            closeModal();
            showSyncBadge('Menyimpan karyawan baru...');

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(() => {
                        hideSyncBadge('✅ Karyawan berhasil disimpan!');
                    })
                    .withFailureHandler(err => {
                        hideSyncBadge('❌ Gagal simpan: ' + err, true);
                    })
                    .addEmployeeRecord(data);
            } else {
                hideSyncBadge('✅ Data tersimpan (offline mode)');
            }

        } else {
            // ── MODE EDIT ────────────────────────────────────────────
            const rowIdx = parseInt(storedRowIdx);
            data.rowIdx = rowIdx;
            data._isAktif = isStatusAktifClient(data['Status']);

            // Cari index berdasarkan rowIdx, bukan currentEditingIndex
            const localIdx = globalEmployees.findIndex(e => e.rowIdx === rowIdx);
            if (localIdx !== -1) {
                Object.assign(globalEmployees[localIdx], data);
                aktifList = globalEmployees.filter(e => e._isAktif !== false);
                tidakAktifList = globalEmployees.filter(e => e._isAktif === false);
                renderEmployees();
                if (currentDrawerIndex === localIdx) openEmployeeDrawer(localIdx);
            }

            closeModal();
            showSyncBadge('Menyinkronkan perubahan...');

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(() => {
                        hideSyncBadge('Perubahan tersimpan!');
                    })
                    .withFailureHandler(err => {
                        hideSyncBadge('❌ Gagal sinkronisasi: ' + err, true);
                    })
                    .updateEmployee(rowIdx, data);
            } else {
                hideSyncBadge('Tersimpan (offline mode)');
            }
        }
    }

    // ── Helper: Badge sinkronisasi kecil di pojok ────────────────
    function showSyncBadge(msg) {
        let badge = document.getElementById('sync-toast');
        if (!badge) {
            badge = document.createElement('div');
            badge.id = 'sync-toast';
            badge.style.cssText = `
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1e293b;
      color: white;
      padding: 10px 20px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      transition: all 0.3s ease;
      white-space: nowrap;
    `;
            document.body.appendChild(badge);
        }
        badge.innerHTML = `
    <div style="width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);
                border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite"></div>
    ${msg}
  `;
        badge.style.opacity = '1';
        badge.style.pointerEvents = 'auto';

        // Pastikan animasi spin ada
        if (!document.getElementById('sync-spin-style')) {
            const style = document.createElement('style');
            style.id = 'sync-spin-style';
            style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
            document.head.appendChild(style);
        }
    }

    function hideSyncBadge(msg, isError = false) {
        const badge = document.getElementById('sync-toast');
        if (!badge) return;
        badge.innerHTML = `
    <span style="font-size:16px">${isError ? '❌' : '✅'}</span> ${msg}
  `;
        badge.style.background = isError ? '#dc2626' : '#16a34a';
        setTimeout(() => {
            badge.style.opacity = '0';
            badge.style.pointerEvents = 'none';
            setTimeout(() => badge.remove(), 400);
        }, 2500);
    }
    function isStatusAktifClient(status) {
        if (!status) return true;
        const s = status.toLowerCase();
        return !(
            s.includes('resign') ||
            s.includes('tidak aktif') ||
            s.includes('nonaktif') ||
            s.includes('keluar') ||
            s.includes('phk')
        );
    }

    function deleteCurrentEmployee() {
        if (currentDrawerIndex === -1) return;
        const emp = globalEmployees[currentDrawerIndex];
        if (!emp) return;

        const rowIdx = emp.rowIdx;
        const namaEmp = emp['Nama Lengkap'] || 'Karyawan ini';
        const cabangEmp = emp['Penempatan'] || '-';

        showConfirm(
            'Hapus Data Karyawan?',
            `"${namaEmp}" dari cabang ${cabangEmp} akan dihapus permanen dari database Google Sheets.`,
            () => {
                // Snapshot untuk rollback
                const snapshot = [...globalEmployees];
                const deletedIdx = currentDrawerIndex;

                // Optimistic UI
                globalEmployees.splice(deletedIdx, 1);
                aktifList = globalEmployees.filter(e => e._isAktif !== false);
                tidakAktifList = globalEmployees.filter(e => e._isAktif === false);
                currentDrawerIndex = -1;

                closeEmployeeDrawer();
                renderEmployees();
                showSyncBadge('Menghapus data...');

                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler(res => {
                            if (res && res.success) {
                                hideSyncBadge('✅ Data berhasil dihapus!');
                            } else {
                                // Rollback jika GAS laporkan gagal
                                globalEmployees = snapshot;
                                aktifList = globalEmployees.filter(e => e._isAktif !== false);
                                tidakAktifList = globalEmployees.filter(e => e._isAktif === false);
                                renderEmployees();
                                hideSyncBadge('❌ Gagal hapus: ' + (res ? res.error : 'Server error'), true);
                            }
                        })
                        .withFailureHandler(err => {
                            // Rollback jika koneksi putus
                            globalEmployees = snapshot;
                            aktifList = globalEmployees.filter(e => e._isAktif !== false);
                            tidakAktifList = globalEmployees.filter(e => e._isAktif === false);
                            renderEmployees();
                            hideSyncBadge('❌ Koneksi gagal: ' + err, true);
                        })
                        .deleteEmployee(rowIdx);
                } else {
                    hideSyncBadge('✅ Data dihapus (offline mode)');
                }
            }
        );
    }

    // ============================================================
    function updateDashboardStats() {
        const sdmEl = document.getElementById('dash-sdm-aktif');
        if (!sdmEl) return;

        let active = 0, resign = 0, probation = 0, kontrak = 0;
        const branches = new Set();
        const jobLevels = {};
        const ageGroups = { '< 20': 0, '20-25': 0, '26-30': 0, '> 30': 0 };
        const monthlyTrend = {};
        const now = new Date();
        const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const in30 = new Date(); in30.setDate(in30.getDate() + 30);
        let notifs = [];

        globalEmployees.forEach(emp => {
            const status = (emp['Status'] || '').toLowerCase();
            if (!emp._isAktif) { resign++; return; }

            active++;
            if (status.includes('probation')) probation++;
            else if (status.includes('kontrak')) kontrak++;
            if (emp['Penempatan'] && emp['Penempatan'] !== '-') branches.add(emp['Penempatan']);

            const pos = emp['Posisi'] || 'Lainnya';
            jobLevels[pos] = (jobLevels[pos] || 0) + 1;

            const yearMatch = (emp['TTL'] || '').match(/\d{4}/);
            if (yearMatch) {
                const age = now.getFullYear() - parseInt(yearMatch[0]);
                if (age < 20) ageGroups['< 20']++;
                else if (age <= 25) ageGroups['20-25']++;
                else if (age <= 30) ageGroups['26-30']++;
                else ageGroups['> 30']++;
            }

            const tm = String(emp['Tgl Masuk'] || '').trim();
            const parsedDate = parseIndoDate(tm);
            if (parsedDate) {
                const ym = parsedDate.getFullYear() + '-' + String(parsedDate.getMonth() + 1).padStart(2, '0');
                monthlyTrend[ym] = (monthlyTrend[ym] || 0) + 1;
            }

            const kd = emp['Perbarui Kontrak'];
            if (kd && kd !== '-') {
                const kDate = parseIndoDate(kd);
                if (kDate) {
                    const kDateStart = new Date(kDate.getFullYear(), kDate.getMonth(), kDate.getDate());
                    const diff = Math.ceil((kDateStart - todayStart) / 86400000);
                    if (diff <= 30 && !updatedContracts.includes(emp['NIK'])) {
                        notifs.push({ emp, kd, diff });
                    }
                }
            }
        });

        // BAGIAN INI SUDAH MASUK KEMBALI KE DALAM FUNGSI
        sdmEl.innerText = active;
        const cabEl = document.getElementById('dash-cabang');
        if (cabEl) cabEl.innerText = branches.size;
        const toEl = document.getElementById('dash-turnover');
        if (toEl) toEl.innerText = ((active + resign) ? Math.round(resign / (active + resign) * 100) : 0) + '%';

        if (typeof manualTotalGaji !== 'undefined' && manualTotalGaji > 0) {
            const gEl = document.getElementById('dash-est-gaji');
            if (gEl) gEl.innerText = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(manualTotalGaji);
        }

        // Notification bell
        const bellBadge = document.getElementById('notif-badge');
        const notifList = document.getElementById('notif-list');
        if (notifs.length > 0) {
            if (bellBadge) { bellBadge.innerText = notifs.length; bellBadge.classList.remove('hidden'); }
            if (notifList) notifList.innerHTML = notifs.map(n => {
                const cls = n.diff < 0 ? 'bg-red-50' : 'bg-amber-50';
                return `<div class="p-3 border-b ${cls} flex items-center gap-2">
        <span class="material-icons text-orange-500 text-[16px]">warning</span>
        <div><p class="text-xs font-bold text-gray-800">${n.emp['Nama Lengkap']}</p>
        <p class="text-[10px] text-gray-500">Exp: ${n.kd} ${n.diff < 0 ? '⚠️' : ''}</p></div>
      </div>`;
            }).join('');
        } else {
            if (bellBadge) bellBadge.classList.add('hidden');
            if (notifList) notifList.innerHTML = '<div class="p-4 text-center text-xs text-gray-400">Tidak ada notifikasi kontrak.</div>';
        }

        try { if (typeof renderMiniCalendar === 'function') renderMiniCalendar(); } catch (e) { }

        // Panggil fungsi Widget SP
        if (typeof renderDashboardSP === 'function') renderDashboardSP();

        // Charts (Grafik)
        if (typeof Chart !== 'undefined') {
            const renderChart = (id, type, data, opts) => {
                const ctx = document.getElementById(id);
                if (!ctx) return;
                if (typeof myCharts !== 'undefined') {
                    if (myCharts[id]) myCharts[id].destroy();
                    myCharts[id] = new Chart(ctx, { type, data, options: opts });
                }
            };
            renderChart('sdmChart', 'doughnut', {
                labels: ['Probation', 'Kontrak/Tetap', 'Tidak Aktif'],
                datasets: [{ data: [probation, kontrak, resign], backgroundColor: ['#60A5FA', '#34D399', '#F87171'], borderWidth: 0 }]
            }, { responsive: true, maintainAspectRatio: false, cutout: '68%', plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } } });

            const sJobs = Object.keys(jobLevels).sort((a, b) => jobLevels[b] - jobLevels[a]).slice(0, 6);
            renderChart('jobChart', 'bar', {
                labels: sJobs,
                datasets: [{ label: 'Karyawan', data: sJobs.map(j => jobLevels[j]), backgroundColor: '#818CF8', borderRadius: 6 }]
            }, { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { grid: { color: '#f1f5f9' } } } });

            renderChart('ageChart', 'pie', {
                labels: Object.keys(ageGroups),
                datasets: [{ data: Object.values(ageGroups), backgroundColor: ['#FCA5A5', '#FCD34D', '#6EE7B7', '#93C5FD'], borderWidth: 0 }]
            }, { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } } });

            const sM = Object.keys(monthlyTrend).sort().slice(-12);
            renderChart('trendChart', 'line', {
                labels: sM,
                datasets: [{ label: 'Staff Masuk', data: sM.map(m => monthlyTrend[m]), borderColor: '#3B82F6', backgroundColor: '#DBEAFE', fill: true, tension: 0.35, pointRadius: 4 }]
            }, { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { grid: { color: '#f1f5f9' } } } });
        }
    }

    // SP MANAGEMENT
    function renderSP() {
        const el = document.getElementById('dash-sp-list');
        if (!el) return;
        if (!globalEmployees || !globalEmployees.length) {
            el.innerHTML = '<p class="text-xs text-gray-400 italic py-4 text-center">Data master belum dimuat.</p>';
            return;
        }

        const spEmps = globalEmployees.filter(e => {
            const sp = String(e['Peringatan'] || '');
            return sp !== '-' && sp !== '' && sp.toLowerCase() !== 'tidak ada' && !String(e['Status']).toLowerCase().includes('resign') && !String(e['Status']).toLowerCase().includes('tidak aktif');
        });

        if (!spEmps.length) {
            el.innerHTML = '<p class="text-xs text-gray-400 italic py-4 text-center">Tidak ada SP aktif.</p>';
            return;
        }

        const dynamicSpRecords = spEmps.map(e => {
            const peringatan = String(e['Peringatan'] || '').toLowerCase();
            let tindakan = 'SP 1';
            if (peringatan.includes('3') || peringatan.includes('iii')) tindakan = 'SP 3';
            else if (peringatan.includes('2') || peringatan.includes('ii')) tindakan = 'SP 2';
            else if (peringatan.includes('phk')) tindakan = 'PHK';

            return {
                nama: e['Nama Lengkap'],
                nik: e['NIK'],
                tindakan: tindakan,
                tingkat: tindakan === 'SP 3' || tindakan === 'PHK' ? 'Berat' : tindakan === 'SP 2' ? 'Sedang' : 'Ringan',
                cabang: e['Penempatan'],
                posisi: e['Posisi'],
                tanggal: e['Perbarui Kontrak'] || '-',
                detail: e['Peringatan'],
                punishment: '-'
            };
        });

        const badge = document.getElementById('emp-badge-sp');
        if (badge) {
            if (dynamicSpRecords.length > 0) { badge.innerText = dynamicSpRecords.length; badge.classList.remove('hidden'); }
            else { badge.classList.add('hidden'); }
        }

        const colorPool = ['#3B82F6', '#8B5CF6', '#EC4899', '#F59E0B', '#10B981', '#EF4444'];
        const tindakanColor = {
            'SP 1': 'bg-yellow-100 text-yellow-700 border-yellow-200',
            'SP 2': 'bg-orange-100 text-orange-700 border-orange-200',
            'SP 3': 'bg-red-100 text-red-700 border-red-200',
            'PHK': 'bg-gray-800 text-white border-gray-700'
        };
        const tingkatIcon = { 'Ringan': '🟡', 'Sedang': '🟠', 'Berat': '🔴' };

        el.innerHTML = dynamicSpRecords.map((sp, idx) => {
            const c = colorPool[(sp.nama || 'A').charCodeAt(0) % colorPool.length];
            const cls = tindakanColor[sp.tindakan] || 'bg-red-100 text-red-700 border-red-200';
            const icon = tingkatIcon[sp.tingkat] || '🟡';
            const today = new Date();
            const exp = sp.masaBerlaku ? new Date(sp.masaBerlaku) : null;
            const sisa = exp ? Math.ceil((exp - today) / 86400000) : null;
            const expired = sisa !== null && sisa < 0;

            return `
      <div class="p-3 ${expired ? 'bg-gray-50 opacity-60' : 'bg-red-50'} border ${expired ? 'border-gray-200' : 'border-red-100'} rounded-xl group hover:shadow-sm transition-all">
        <div class="flex items-start gap-3">
          <div class="w-9 h-9 rounded-xl flex items-center justify-center text-white font-bold text-sm shrink-0"
               style="background:${c}">${(sp.nama || '?').charAt(0)}</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between gap-2">
              <p class="text-xs font-bold text-gray-800 truncate">${sp.nama}</p>
              <span class="px-2 py-0.5 rounded-lg text-[9px] font-black border ${cls} shrink-0">${sp.tindakan}</span>
            </div>
            <p class="text-[10px] text-gray-500 mt-0.5">${sp.cabang || '-'} · ${sp.posisi || '-'}</p>
            <div class="flex items-center gap-2 mt-1.5 flex-wrap">
              <span class="text-[10px] font-bold">${icon} ${sp.tingkat}</span>
              <span class="text-gray-300">·</span>
              <span class="text-[10px] text-gray-500">${sp.tanggal || '-'}</span>
              ${sisa !== null ? `<span class="text-gray-300">·</span>
              <span class="text-[10px] font-bold ${expired ? 'text-gray-400' : sisa <= 7 ? 'text-red-600' : 'text-orange-500'}">
                ${expired ? 'Kedaluwarsa' : sisa + 'h tersisa'}
              </span>` : ''}
            </div>
            ${sp.detail ? `<p class="text-[10px] text-gray-500 mt-1.5 bg-white rounded-lg px-2 py-1 border border-gray-100 line-clamp-2">${sp.detail}</p>` : ''}
            ${sp.punishment ? `<p class="text-[10px] font-bold text-purple-600 mt-1">⚡ ${sp.punishment}</p>` : ''}
          </div>
        </div>
        <div class="flex justify-end mt-2 gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
          <button onclick="hapusSPAktif('${sp.nik}', '${sp.namaSafe}')"
                  class="text-[10px] text-red-400 hover:bg-red-100 border border-red-200 px-2 py-1 rounded-lg font-bold transition flex items-center gap-1">
            <span class="material-icons text-[12px]">delete</span>Hapus

        }).join('');

    function updateSPTindakan() {
        const tingkat = document.getElementById('sp-tingkat')?.value;
        const tindakan = document.getElementById('sp-tindakan');
        if (!tindakan) return;
        // Auto-saran tindakan berdasar tingkat
        if (tingkat === 'Ringan') tindakan.value = 'SP 1';
        else if (tingkat === 'Sedang') tindakan.value = 'SP 2';
        else if (tingkat === 'Berat') tindakan.value = 'SP 3';
        autoSetMasaBerlaku();
    }

    function autoSetMasaBerlaku() {
        const tindakan = document.getElementById('sp-tindakan')?.value;
        const tglEl = document.getElementById('sp-tanggal');
        const masaEl = document.getElementById('sp-masa-berlaku');
        if (!masaEl) return;

        const base = tglEl?.value ? new Date(tglEl.value) : new Date();
        // Masa berlaku: SP1=3 bln, SP2=6 bln, SP3=12 bln, PHK=sekarang
        const bulan = { 'SP 1': 3, 'SP 2': 6, 'SP 3': 12, 'PHK': 0 }[tindakan] || 3;
        base.setMonth(base.getMonth() + bulan);
        masaEl.value = base.toISOString().slice(0, 10);

        updateSPPreview();
    }

    function updateSPPreview() {
        const badge = document.getElementById('sp-preview-badge');
        const text = document.getElementById('sp-preview-text');
        const masa = document.getElementById('sp-preview-masa');
        const nikEl = document.getElementById('sp-emp-nik');
        if (!badge || !nikEl || !nikEl.value) return;

        const tindakan = document.getElementById('sp-tindakan')?.value || 'SP 1';
        const tingkat = document.getElementById('sp-tingkat')?.value || 'Ringan';
        const masaVal = document.getElementById('sp-masa-berlaku')?.value || '-';

        badge.classList.remove('hidden');
        if (text) text.innerText = tindakan + ' - ' + tingkat;
        if (masa) masa.innerText = 'Berlaku hingga: ' + masaVal;
    }

    function saveSPRecord() {
        const nik = document.getElementById('sp-emp-nik')?.value;
        if (!nik) return showToast('Pilih karyawan terlebih dahulu!', 'warning');

        const tanggal = document.getElementById('sp-tanggal')?.value;
        const tingkat = document.getElementById('sp-tingkat')?.value;
        const detail = document.getElementById('sp-detail')?.value?.trim();
        const tindakan = document.getElementById('sp-tindakan')?.value;
        const masaBerlaku = document.getElementById('sp-masa-berlaku')?.value;
        const punishment = document.getElementById('sp-punishment')?.value?.trim();

        const emp = aktifList.find(function (e) { return e['NIK'] === nik; });
        if (!emp) return showToast('Data karyawan tidak valid.', 'error');

        const record = {
            id: Date.now(),
            nik: nik,
            nama: emp['Nama Lengkap'] || '-',
            cabang: emp['Penempatan'] || '-',
            posisi: emp['Posisi'] || '-',
            tanggal: tanggal,
            tingkat: tingkat,
            detail: detail,
            tindakan: tindakan,
            masaBerlaku: masaBerlaku,
            punishment: punishment,
            createdAt: new Date().toISOString()
        };

        spRecords.push(record);
        localStorage.setItem('LOSHRIS_SP_RECORDS', JSON.stringify(spRecords));

        const gIdx = globalEmployees.findIndex(function (e) { return String(e['NIK']) === String(nik); });
        if (gIdx !== -1) {
            globalEmployees[gIdx]['Peringatan'] = tindakan;
            aktifList = globalEmployees.filter(function (e) { return e._isAktif !== false; });
            tidakAktifList = globalEmployees.filter(function (e) { return e._isAktif === false; });
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run.updateEmployee(globalEmployees[gIdx].rowIdx, globalEmployees[gIdx]);
            }
        }

        closeSPModal();
        renderSP();
        showToast('SP berhasil disimpan untuk ' + emp['Nama Lengkap'] + '!', 'success');
    }

    function deleteSPRecord(idx) {
        if (!confirm('Hapus catatan SP ini?')) return;
        spRecords.splice(idx, 1);
        localStorage.setItem('LOSHRIS_SP_RECORDS', JSON.stringify(spRecords));
        renderSP();
    }

    window.syncLibrary = function (isBackground) {
        const icon = document.getElementById('sync-lib-icon');
        const status = document.getElementById('lib-sync-status');
        if (icon) icon.classList.add('animate-spin');
        if (status) status.classList.remove('hidden');
        if (!isBackground) showLoader(true);

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(res => {
                    if (icon) icon.classList.remove('animate-spin');
                    if (status) status.classList.add('hidden');
                    if (!isBackground) showLoader(false);
                    if (res.success) {
                        libraryCache = res.files;
                        localStorage.setItem('LOSHRIS_LIBRARY_CACHE', JSON.stringify(libraryCache));
                        localStorage.setItem('LOSHRIS_LIBRARY_LAST_SYNC', Date.now().toString());
                        updateLastSyncText();
                        renderLibrary();
                    } else if (!isBackground) showToast('Gagal sync: ' + res.error, 'error');
                })
                .withFailureHandler(err => {
                    if (icon) icon.classList.remove('animate-spin');
                    if (status) status.classList.add('hidden');
                    if (!isBackground) { showLoader(false); showToast('Error: ' + err, 'error'); }

            if (status) status.classList.add('hidden');
            if (!isBackground) showLoader(false);

    window.saveLibraryFile = function () {
        const fileInput = document.getElementById('lib-file');
        const file = fileInput?.files[0];
        const name = document.getElementById('lib-name')?.value?.trim();
        if (!file) return showToast('Pilih file terlebih dahulu!', 'warning');

        const btn = document.getElementById('lib-save-btn');
        if (btn) { btn.disabled = true; btn.innerHTML = '<span class="animate-spin material-icons text-[18px]">sync</span> Mengunggah...'; }

        const reader = new FileReader();
        reader.onload = e => {
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(res => {
                        if (btn) { btn.disabled = false; btn.innerHTML = '<span class="material-icons text-[18px]">cloud_done</span> Upload & Simpan'; }
                        if (res.success) { window.closeLibraryForm(); window.syncLibrary(); }

                    })
                    .withFailureHandler(err => {
                        if (btn) { btn.disabled = false; btn.innerHTML = '<span class="material-icons text-[18px]">cloud_done</span> Upload & Simpan'; }
                        showToast('Error: ' + err, 'error');
                    })
                    .uploadFileToLibrary(
                        e.target.result, file.name, file.type, name,
                        document.getElementById('lib-cat')?.value || 'LAINNYA',
                        document.getElementById('lib-no')?.value || '-',
                        document.getElementById('lib-date')?.value || '-',

        const branch = document.getElementById('set-branch-select')?.value || 'Global';
        if (!PRules[branch]) PRules[branch] = {};
        const r = PRules[branch];
        const gV = id => parseFloat(document.getElementById(id)?.value) || 0;
        r.hari = gV('set-pembagi-hari') || 26;
        r.jam = gV('set-pembagi-jam') || 8;
        r.shift = gV('set-bonus-shift') || 50000;
        r.holiday = gV('set-holiday-pay') || 50000;
        r.telat = gV('set-denda-telat') || 1000;
        r.sakit = gV('set-pot-sakit') || 30;
        r.probBpjs = document.getElementById('set-prob-bpjs')?.checked || false;
        r.probKpi = document.getElementById('set-prob-kpi')?.checked || false;
        if (r.kpis) r.kpis.forEach(kpi => { const el = document.getElementById(`set_kpi_${kpi.id}`); if (el) kpi.max = parseFloat(el.value) || 0; });

            sal.status = document.getElementById(`set_sal_stat_${idx}`)?.value || sal.status;
            sal.gp = parseFloat(document.getElementById(`set_sal_gp_${idx}`)?.value) || 0;
            sal.tj = parseFloat(document.getElementById(`set_sal_tj_${idx}`)?.value) || 0;
        });
        localStorage.setItem('LOSHRIS_RULES_V3', JSON.stringify(PRules));
        showToast('✅ Aturan cabang ' + branch + ' tersimpan lokal!', 'success');

    // ============================================================
    // KONEKTA PAYROLL ENGINE v4.0
    // Format & Formula: persis seperti Excel [Oren] Payroll
    // 5 Seksi: Base Calc | Additional | Substraction | Final | Transfer
    // Rumus:
    //   Per Day         = GP / 26
    //   Total BU        = BU_count × PerDay
    //   Total LS        = LS_count × PerDay
    //   Total Lembur    = Lembur_jam × (GP / 173)   [opsional, ganti jika mau]
    //   Base Calc       = GP + BPJS_Kes + BPJS_Ket + Total_BU + Total_LS + Total_Lembur + TJ
    //   Ketidakhadiran  = TH × PerDay
    //   Pot Terlambat   = Menit × 1000
    //   Pot Sakit       = Sakit × PerDay × 0.30
    //   Substraction    = Ketidakhadiran + Pot Telat + Pot Sakit + Lain_Sub
    //   Total Calc      = Base Calc - Substraction
    //   Bonus BU        = BU_count × 50.000
    //   Bonus LS        = LS_count × 50.000
    //   Total Holiday   = Holiday_nominal (di-input manual per karyawan)
    //   KPI Kehadiran   = TH=0 → max, TH=1 → 75%, TH=2 → 50%, TH≥3 → 0
    //   Additional      = Omzet + Bonus_BU + Bonus_LS + Total_Holiday + KPI_Keb + KPI_Komp + KPI_Had + Lain_Add
    //   THP             = Total_Calc + Additional
    //   Tgl 1           = Total_Calc
    //   Tgl 10          = Additional
    // ============================================================

    // ---- Payroll state per NIK -----
    // payrollDataState[nik] = { gp, tj, bpjsKes, bpjsKet,
    //   hk, hadir, th, ketTH, cuti, ketCuti, cutiKhusus, ketCutiKhusus,
    //   sakit, ketSakit, bu, ls, lemburJam, omzet, ketOmzet,
    //   holidayNom, ketHoliday, kpiKeb, ketKpiKeb, kpiKomp, ketKpiKomp,
    //   telatMenit, lainSub, ketLainSub, lainAdd, ketLainAdd,
    //   namaBank, noRek, atasNama }
    // semua hasil AUTO-COMPUTE di recalcRowV4()

    // ---- CSS yang perlu ditambahkan ke <style> di Index.html ----
    // (paste blok ini ke bagian <style> di head)
    const PAYROLL_CSS = `
.pr-table { border-collapse: separate; border-spacing: 0; }
.pr-sticky { position: sticky; left: 0; z-index: 4; background:#fff; }
.pr-sticky2 { position: sticky; left: 40px; z-index: 4; background:#fff; }
.pr-sticky3 { position: sticky; left: 80px; z-index: 4; background:#fff; }
.pr-sticky4 { position: sticky; left: 200px; z-index: 4; background:#fff; }
.pr-sticky-h { position: sticky; top: 0; z-index: 3; }
.pr-s1 { background: #dbeafe; }   /* base calc - biru */

    function renderPayrollMass() {
        if (!globalEmployees.length) {
            document.getElementById('payroll-mass-container').innerHTML = `
      <div class="text-center py-14 text-gray-400 bg-gray-50 rounded-2xl border-2 border-dashed border-gray-200">

        <p class="font-medium">Muat data karyawan terlebih dahulu.</p>
        <button onclick="loadMasterData()" class="mt-3 text-sm text-blue-600 font-bold underline">Muat Data</button>
      </div>`;
            return;
        }

        // Inject CSS jika belum ada
        if (!document.getElementById('pr-css')) {
            const s = document.createElement('style');
            s.id = 'pr-css';
            s.textContent = PAYROLL_CSS;
            document.head.appendChild(s);
        }

        // Group by branch
        const groups = {};
        aktifList.forEach(emp => {
            const b = (emp['Penempatan'] && emp['Penempatan'] !== '-') ? emp['Penempatan'] : 'Tanpa Cabang';
            if (!groups[b]) groups[b] = [];
            groups[b].push(emp);
        });

        let html = '';
        for (const branch in groups) {
            const r = getRules(branch);
            html += buildBranchTableV4(branch, groups[branch], r);
        }

        document.getElementById('payroll-mass-container').innerHTML = html;

        // Init semua rows & recalc
        aktifList.forEach(emp => {
            initPayrollStateV4(emp);
            recalcRowV4(emp['NIK']);
        });
    }

    function initPayrollStateV4(emp) {
        const nik = emp['NIK'];
        if (payrollDataState[nik]) return; // jangan overwrite jika sudah ada

        const r = getRules(emp['Penempatan']);
        const status = (emp['Status'] || '').toLowerCase();

        // Cek gaji default dari salary rules
        let defaultGP = 2000000;
        let defaultTJ = 0;
        if (r.salaries) {
            const stKey = status.includes('kontrak ii') || status.includes('kontrak 2') ? 'kontrak 2'
                : status.includes('kontrak i') || status.includes('kontrak 1') ? 'kontrak 1'
                    : 'probation';
            const match = r.salaries.find(s =>
                (s.posisi === 'Semua Posisi' || s.posisi.toLowerCase() === (emp['Posisi'] || '').toLowerCase()) &&
                s.status.toLowerCase() === stKey
            );
            if (match) { defaultGP = match.gp; defaultTJ = match.tj; }
        }

        // BPJS default berdasar status
        const isProbation = status.includes('probation');
        const isKontrak2 = status.includes('kontrak ii') || status.includes('kontrak 2');
        const bpjsKes = isProbation ? 0 : isKontrak2 ? 100000 : 50000;
        const bpjsKet = isProbation ? 0 : isKontrak2 ? 100000 : 50000;
        const ruleForEmp = getRules(emp['Penempatan']);
        const hariDefault = (ruleForEmp && ruleForEmp.hari) ? ruleForEmp.hari : 26;

        payrollDataState[nik] = {
            // Base
            gp: defaultGP, tj: defaultTJ, ketTJ: '',
            bpjsKes, bpjsKet,
            hk: hariDefault, hadir: hariDefault, th: 0, ketTH: '',
            cuti: 0, ketCuti: '', cutiKhusus: 0, ketCutiKhusus: '',
            sakit: 0, ketSakit: '',
            bu: 0, ls: 0, lemburJam: 0,
            // Additional
            omzet: 0, ketOmzet: '',
            holidayNom: 0, ketHoliday: '',
            kpiKeb: 0, ketKpiKeb: '',        // nilai bonus kebersihan
            kpiKomp: 0, ketKpiKomp: '',      // nilai bonus komplain
            // (KPI Kehadiran dihitung otomatis dari TH)
            ketKpiHad: '',
            lainAdd: 0, ketLainAdd: '',
            // Substraction
            telatMenit: 0,
            lainSub: 0, ketLainSub: '',
            // Transfer
            namaBank: emp['Bank'] || '',
            noRek: emp['Rekening'] || '',
            atasNama: emp['Atas Nama'] || emp['Nama Lengkap'] || '',
            // Computed (will be set by recalc)
            perDay: 0, totalBU: 0, totalLS: 0, totalLembur: 0,
            baseCalc: 0, ketidakhadiran: 0, potTelat: 0, potSakit: 0,
            substraction: 0, totalCalc: 0,
            bonusBU: 0, bonusLS: 0, kpiHad: 0,
            additional: 0, thp: 0, tgl1: 0, tgl2: 0
        };
    }

    function recalcRowV4(nik) {
        const state = payrollDataState[nik];
        if (!state) return;

        const rGlobal = getRules('Global');
        const pembagiHari = (rGlobal && rGlobal.hari) ? rGlobal.hari : 26;
        const pembagiJam = (rGlobal && rGlobal.jam) ? rGlobal.jam : 8;
        const jamPerBulan = pembagiHari * pembagiJam;

        const G = state.gp / pembagiHari;  // Per Day

        // Base Calculation components
        state.perDay = G;
        state.totalBU = state.bu * G;
        state.totalLS = state.ls * G;
        state.totalLembur = state.lemburJam * (state.gp / jamPerBulan); // lembur per jam
        state.baseCalc = state.gp + state.bpjsKes + state.bpjsKet
            + state.totalBU + state.totalLS + state.totalLembur + state.tj;

        // Substraction components
        state.ketidakhadiran = state.th * G;
        state.potTelat = state.telatMenit * (rGlobal.telat || 1000);
        state.potSakit = state.sakit * G * ((rGlobal.sakit || 30) / 100);
        state.substraction = state.ketidakhadiran + state.potTelat + state.potSakit + state.lainSub;

        state.totalCalc = state.baseCalc - state.substraction;

        // Additional components
        state.bonusBU = state.bu * (rGlobal.shift || 50000);
        state.bonusLS = state.ls * (rGlobal.shift || 50000);

        // KPI Kehadiran otomatis (max ambil dari rules kalau ada, else default Rp100.000)
        const r = getRules('Global');
        const kpiHadMax = (r.kpis && r.kpis.find(k => k.name.toLowerCase().includes('hadir')))
            ? (r.kpis.find(k => k.name.toLowerCase().includes('hadir')).max || 100000)
            : 100000;
        state.kpiHad = state.th === 0 ? kpiHadMax
            : state.th === 1 ? kpiHadMax * 0.75
                : state.th === 2 ? kpiHadMax * 0.50
                    : 0;

        state.additional = state.omzet + state.bonusBU + state.bonusLS
            + state.holidayNom + state.kpiKeb + state.kpiKomp + state.kpiHad + state.lainAdd;

        state.thp = state.totalCalc + state.additional;
        state.tgl1 = state.totalCalc;
        state.tgl2 = state.additional;

        // Update DOM
        const fmt = n => n === 0 ? '—' : 'Rp' + new Intl.NumberFormat('id-ID').format(Math.round(n));
        const setTxt = (id, val, cls = '') => {
            const el = document.getElementById(id);
            if (el) { el.textContent = val; el.className = 'pr-auto ' + cls; }
        };

        setTxt(`pr_${nik}_perday`, fmt(G));
        setTxt(`pr_${nik}_totalbu`, fmt(state.totalBU), state.totalBU ? 'pos' : '');
        setTxt(`pr_${nik}_totalLs`, fmt(state.totalLS), state.totalLS ? 'pos' : '');
        setTxt(`pr_${nik}_totalLmb`, fmt(state.totalLembur), state.totalLembur ? 'pos' : '');
        setTxt(`pr_${nik}_baseCalc`, fmt(state.baseCalc), 'pos');
        setTxt(`pr_${nik}_bonusBU`, fmt(state.bonusBU), state.bonusBU ? 'pos' : '');
        setTxt(`pr_${nik}_bonusLS`, fmt(state.bonusLS), state.bonusLS ? 'pos' : '');
        setTxt(`pr_${nik}_kpiHad`, fmt(state.kpiHad), state.kpiHad ? 'pos' : '');
        setTxt(`pr_${nik}_additional`, fmt(state.additional), 'pos');
        setTxt(`pr_${nik}_ketTH`, fmt(state.ketidakhadiran), state.ketidakhadiran ? 'neg' : '');
        setTxt(`pr_${nik}_potTelat`, fmt(state.potTelat), state.potTelat ? 'neg' : '');
        setTxt(`pr_${nik}_potSakit`, fmt(state.potSakit), state.potSakit ? 'neg' : '');
        setTxt(`pr_${nik}_subTotal`, fmt(state.substraction), 'neg');
        setTxt(`pr_${nik}_totalCalc`, fmt(state.totalCalc), state.totalCalc >= 0 ? 'pos' : 'neg');
        setTxt(`pr_${nik}_thp`, fmt(state.thp), 'thp');
        setTxt(`pr_${nik}_tgl1`, fmt(state.tgl1), state.tgl1 >= 0 ? 'pos' : 'neg');
        setTxt(`pr_${nik}_tgl2`, fmt(state.tgl2), state.tgl2 >= 0 ? 'pos' : 'neg');

        savePayrollStateToLocal();
        updateBranchTotals();
    }
