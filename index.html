    // ─── Export Excel ─────────────────────────────────────────────
    function absenExportExcel() {
        if (!_ab.summary.length) return showToast('Belum ada data untuk diekspor.', 'warning');
        if (typeof XLSX === 'undefined') return showToast('Library XLSX belum termuat.', 'warning');

        // Sheet 1: Rekap per karyawan
        var s1 = [['Nama', 'Departemen', 'Hadir', 'Toleransi', 'Telat', 'Alpha', 'OFF', 'Total Potongan (Rp)', 'Detail Bukti']];
        _ab.summary.forEach(function (s) {
            s1.push([s.nama, s.dept, s.hadir, s.toleransi, s.telat, s.alpha, s.off, s.totalDenda, s.bukti.join('; ') || '-']);
        });

        // Sheet 2: Detail per hari
        var s2 = [['Nama', 'Departemen', 'Tanggal', 'Masuk', 'Keluar', 'Terlambat (mnt)', 'Status', 'Potongan (Rp)', 'Jam Shift']];
        _ab.processed.forEach(function (r) {
            var kv = _abToMins(r.kI) !== null ? _abToMins(r.kI) : (_abToMins(r.kII) !== null ? _abToMins(r.kII) : null);
            var ks = kv !== null
                ? Math.floor(kv / 60).toString().padStart(2, '0') + ':' + (kv % 60).toString().padStart(2, '0')
                : '-';
            s2.push([r.nama, r.dept, r.tgl, r.masukStr, ks,
            (r.late !== null && r.late > 0 ? r.late : '-'), r.status, r.denda, r.shift]);
        });

        // Sheet 3: Ringkasan denda
        var s3 = [['Aturan Potongan', 'Denda (Rp)']];
        AB_TIERS.forEach(function (t) { s3.push([t.label, t.denda]); });

        var wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s1), 'Rekap Potongan');
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s2), 'Detail Harian');
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s3), 'Aturan Denda');
        XLSX.writeFile(wb, 'Rekap_Keterlambatan_' + new Date().toISOString().slice(0, 10) + '.xlsx');
    }

    var ABSEN_SHIFT_PATTERNS = {

        MIDDLE: { label: 'Middle', masuk: '11:00', keluar: '19:00' },
        SORE: { label: 'Sore', masuk: null, keluar: null }
    };

    var absenSettings = safeParse('LOSHRIS_ABSEN_SETTINGS', {

        toleransi: 10,

    });

    function _abParseDateObject(s) {
        s = String(s || '').trim();
        if (!s) return null;

        if (s.includes('/')) {
            var p = s.split('/').map(Number);
            if (p.length === 3) {
                // Existing absen formatter kamu cenderung baca MM/DD/YYYY.
                var mm = p[0], dd = p[1], yy = p[2];
                if (p[0] > 12) { dd = p[0]; mm = p[1]; }
                var d = new Date(yy, mm - 1, dd);
                return isNaN(d.getTime()) ? null : d;
            }
        }

        if (s.includes('-')) {
            var q = s.split('-').map(Number);
            if (q.length >= 3) {
                var d2 = q[0] > 1900 ? new Date(q[0], q[1] - 1, q[2]) : new Date(q[2], q[1] - 1, q[0]);
                return isNaN(d2.getTime()) ? null : d2;
            }
        }

        var d3 = new Date(s);
        return isNaN(d3.getTime()) ? null : d3;
    }

    function getSoreShiftByDate(tgl) {
        var d = _abParseDateObject(tgl);
        var day = d ? d.getDay() : new Date().getDay();

        // 0 Minggu, 1 Senin, 2 Selasa, 3 Rabu, 4 Kamis, 5 Jumat, 6 Sabtu
        if (day >= 1 && day <= 3) {
            return { label: 'Sore', masuk: '17:00', keluar: '22:00' };
        }

        return { label: 'Sore', masuk: '18:00', keluar: '22:00' };
    }

    function getShiftPattern(code, tgl) {
        code = String(code || 'AUTO').toUpperCase();
        if (code === 'SORE') return getSoreShiftByDate(tgl);
        return ABSEN_SHIFT_PATTERNS[code] || null;
    }

    function detectShiftFromMasuk(masukMins, tgl) {
        if (masukMins === null) return getShiftPattern(absenSettings.defaultShift, tgl) || getShiftPattern('PAGI', tgl);

        var candidates = [
            getShiftPattern('PAGI', tgl),
            getShiftPattern('MIDDLE', tgl),
            getShiftPattern('SORE', tgl)
        ];

        candidates.sort(function (a, b) {
            return Math.abs(masukMins - _abToMins(a.masuk)) - Math.abs(masukMins - _abToMins(b.masuk));
        });

        return candidates[0];
    }

    function getAbsenShiftForRow(r) {
        var nama = String(r.nama || '').trim().toLowerCase();
        var assigned = absenShiftAssignments[nama] || absenSettings.defaultShift || 'AUTO';

        var masuk = _abToMins(r.mI) !== null ? _abToMins(r.mI) :
            (_abToMins(r.mII) !== null ? _abToMins(r.mII) : null);

        if (assigned === 'AUTO') return detectShiftFromMasuk(masuk, r.tgl);
        return getShiftPattern(assigned, r.tgl) || detectShiftFromMasuk(masuk, r.tgl);
    }

    function calcDocTenure() {
        const tglMasukStr = selectedDocEmp ? selectedDocEmp['Tgl Masuk'] : null;
        const keluarEl = document.getElementById('df-keluar');
        const masaKerjaEl = document.getElementById('df-masa-kerja');

        if (!keluarEl || !masaKerjaEl || !tglMasukStr || !keluarEl.value) return;

        const d1 = parseIndoDate(tglMasukStr);
        const d2 = new Date(keluarEl.value);
        if (!d1 || isNaN(d2)) return;

        let years = d2.getFullYear() - d1.getFullYear();
        let months = d2.getMonth() - d1.getMonth();
        if (months < 0) { years--; months += 12; }

        let res = '';
        if (years > 0) res += years + ' Tahun ';
        if (months > 0) res += months + ' Bulan';
        if (years === 0 && months === 0) res = 'Kurang dari 1 Bulan';

        masaKerjaEl.value = res.trim();
    }

    // Performance state per NIK
    let performanceDataState = {};

    window.updatePerformanceField = function (nik, field, el) {
        if (!performanceDataState[nik]) return;
        performanceDataState[nik][field] = parseInt(el.value) || 0;
        recalcPerformance(nik);

        // Auto-save to cloud with debounce (1 detik setelah user berhenti mengetik)

    function initPerformanceState(emp) {
        const nik = emp['NIK'];
        if (performanceDataState[nik]) return;

        // Safe access to payrollDataState
        const pd = (typeof payrollDataState !== 'undefined' && payrollDataState[nik]) ? payrollDataState[nik] : null;

        // Defaults
        performanceDataState[nik] = {
            hadir: pd ? pd.hadir : (parseInt(emp['Hadir']) || 26),
            absen: pd ? pd.th : (parseInt(emp['TH']) || 0),
            telat: pd ? pd.telatMenit : (parseInt(emp['Telat Menit']) || 0),
            training: 0,
            kebersihan: 100,
            komplain: pd ? (parseInt(pd.ketKpiKomp) || 0) : 0,
            poin: 0, // Poin Pelanggaran Default
            skor: 0,
            grade: 'C'
        };
    }

    function recalcPerformance(nik) {
        const state = performanceDataState[nik];
        if (!state) return;

        // Base max 100
        let baseScore = 100;

        // Deductions
        let dedAbsen = state.absen * 5; // -5 per absen
        let dedTelat = Math.floor(state.telat / 15) * 1; // -1 per 15 menit
        let dedKomplain = state.komplain * 10; // -10 per komplain

        // Skor Absensi = max 100
        let skorAbsen = Math.max(0, 100 - dedAbsen - dedTelat);

        // Skor Komplain = max 100
        let skorKomp = Math.max(0, 100 - dedKomplain);

        // Kebersihan is manually inputted 0-100
        let skorBersih = parseInt(state.kebersihan) || 0;

        // Weighted Average
        // Absen: 40%, Bersih: 30%, Komplain: 20%, Training: 10% (max 100)
        let finalScore = (skorAbsen * 0.40) + (skorBersih * 0.30) + (skorKomp * 0.20) + (state.training > 0 ? 10 : 0);

        // Poin Pelanggaran (-2 skor akhir per 1 poin)
        let penaltiPoin = (state.poin || 0) * 2;
        finalScore -= penaltiPoin;

        state.skor = Math.max(0, Math.min(100, Math.round(finalScore)));

        // Grade
        if (state.skor >= 90) state.grade = 'A';
        else if (state.skor >= 75) state.grade = 'B';
        else if (state.skor >= 60) state.grade = 'C';
        else state.grade = 'D';

        // Update DOM if exists
        const fmt = val => Math.round(val);
        const setTxt = (id, val) => { const el = document.getElementById(id); if (el) el.innerText = val; };

        setTxt(`perf_${nik}_skor`, fmt(state.skor));
        setTxt(`perf_${nik}_grade`, state.grade);

        const gradeEl = document.getElementById(`perf_${nik}_grade`);
        if (gradeEl) {
            gradeEl.className = 'font-black text-lg text-center ' +
                (state.grade === 'A' ? 'text-emerald-600' :
                    state.grade === 'B' ? 'text-blue-600' :
                        state.grade === 'C' ? 'text-orange-500' : 'text-red-600');
        }
    }

    window.exportPerformanceToDriveClient = function () {
        if (!aktifList || !aktifList.length) return showToast('Tidak ada data untuk diexport.', 'warning');

    function renderPerformanceRanking() {
        // Kumpulkan semua data performa yang sudah dihitung
        const allData = aktifList.map(emp => {
            const nik = emp['NIK'];
            const s = performanceDataState[nik];
            if (!s) return null;
            return {
                nama: emp['Nama Lengkap'] || '-',
                posisi: emp['Posisi'] || '-',
                cabang: emp['Penempatan'] || 'Tanpa Cabang',
                skor: s.skor || 0,
                grade: s.grade || 'D'
            };
        }).filter(Boolean);

        // Sort berdasarkan skor
        const sorted = [...allData].sort((a, b) => b.skor - a.skor);

        // 1. Grade Distribution
        const gradeCount = { A: 0, B: 0, C: 0, D: 0 };
        allData.forEach(d => { gradeCount[d.grade] = (gradeCount[d.grade] || 0) + 1; });
        const total = allData.length || 1;
        const gradeColors = { A: '#10b981', B: '#3b82f6', C: '#f59e0b', D: '#ef4444' };
        const gradeBars = document.getElementById('perf-grade-bars');
        if (gradeBars) {
            gradeBars.innerHTML = Object.entries(gradeCount).map(([grade, count]) => {
                const pct = Math.round((count / total) * 100);
                return `<div>
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-white text-xs font-bold">Grade ${grade}</span>
                        <span class="text-white text-xs opacity-80">${count} orang (${pct}%)</span>
                    </div>
                    <div class="w-full bg-white/20 rounded-full h-2">
                        <div class="h-2 rounded-full transition-all duration-700" style="width:${pct}%;background:${gradeColors[grade]}"></div>
                    </div>
                </div>`;
            }).join('');
        }

        // 2. Top 5 Terbaik
        const bestList = document.getElementById('perf-top5-best');
        if (bestList) {
            const medals = ['🥇', '🥈', '🥉', '4️⃣', '5️⃣'];
            bestList.innerHTML = sorted.slice(0, 5).map((d, i) => `
                <li class="flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2 min-w-0">
                        <span class="text-lg leading-none">${medals[i]}</span>
                        <div class="min-w-0">
                            <p class="text-xs font-bold text-gray-800 truncate">${d.nama}</p>
                            <p class="text-[10px] text-gray-400 truncate">${d.cabang}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                        <span class="text-sm font-black text-emerald-600">${d.skor}</span>
                        <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${d.grade === 'A' ? 'bg-emerald-100 text-emerald-700' : d.grade === 'B' ? 'bg-blue-100 text-blue-700' : 'bg-orange-100 text-orange-700'}">${d.grade}</span>
                    </div>
                </li>`).join('');
        }

        // 3. Top 5 Perlu Perhatian (skor terendah)
        const worstList = document.getElementById('perf-top5-worst');
        if (worstList) {
            const bottom = sorted.slice(-5).reverse();
            worstList.innerHTML = bottom.map((d, i) => `
                <li class="flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2 min-w-0">
                        <span class="w-5 h-5 rounded-full bg-red-100 text-red-600 text-[10px] font-black flex items-center justify-center shrink-0">${i + 1}</span>
                        <div class="min-w-0">
                            <p class="text-xs font-bold text-gray-800 truncate">${d.nama}</p>
                            <p class="text-[10px] text-gray-400 truncate">${d.cabang}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                        <span class="text-sm font-black text-red-500">${d.skor}</span>
                        <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-red-100 text-red-700">${d.grade}</span>
                    </div>
                </li>`).join('');
        }

        // 4. Rata-rata per Cabang
        const branchMap = {};
        allData.forEach(d => {
            if (!branchMap[d.cabang]) branchMap[d.cabang] = [];
            branchMap[d.cabang].push(d.skor);
        });
        const branchAvg = Object.entries(branchMap).map(([name, scores]) => ({
            name,
            avg: Math.round(scores.reduce((a, b) => a + b, 0) / scores.length),
            count: scores.length
        })).sort((a, b) => b.avg - a.avg);

        const maxAvg = branchAvg.length ? branchAvg[0].avg : 100;
        const branchBars = document.getElementById('perf-branch-bars');
        if (branchBars) {
            branchBars.innerHTML = branchAvg.map(b => {
                const pct = Math.round((b.avg / Math.max(maxAvg, 1)) * 100);
                const color = b.avg >= 80 ? '#10b981' : b.avg >= 65 ? '#3b82f6' : b.avg >= 50 ? '#f59e0b' : '#ef4444';
                return `<div class="flex items-center gap-3">
                    <span class="text-xs font-bold text-gray-700 w-36 shrink-0 truncate" title="${b.name}">${b.name}</span>
                    <div class="flex-1 bg-gray-100 rounded-full h-3 overflow-hidden">
                        <div class="h-3 rounded-full transition-all duration-700" style="width:${pct}%;background:${color}"></div>
                    </div>
                    <span class="text-xs font-black text-gray-800 w-12 text-right">${b.avg} <span class="text-[10px] text-gray-400 font-normal">(${b.count})</span></span>
                </div>`;
            }).join('');
        }
    }

    function updateContractRule(idx, key, value) {
        const branch = document.getElementById('set-branch-select')?.value || 'Global';
        const r = LOSHRIS_ORG_CONFIG.payrollRules[branch] || LOSHRIS_ORG_CONFIG.payrollRules['Global'];
        if (!r.contractRules) r.contractRules = getDefaultContractRules();
        r.contractRules[idx][key] = value;
        saveOrgConfig();
    }

    function addContractRule() {
        const branch = document.getElementById('set-branch-select')?.value || 'Global';
        if (!LOSHRIS_ORG_CONFIG.payrollRules[branch]) {
            LOSHRIS_ORG_CONFIG.payrollRules[branch] = JSON.parse(JSON.stringify(LOSHRIS_ORG_CONFIG.payrollRules['Global']));

        const r = LOSHRIS_ORG_CONFIG.payrollRules[branch];
        if (!r.contractRules) r.contractRules = getDefaultContractRules();
        r.contractRules.push({ status: 'Kontrak Baru', kpi: false, omset: false, bpjs: false });
        saveOrgConfig();
        renderContractRules();

        if (!r.contractRules) r.contractRules = getDefaultContractRules();
        r.contractRules.splice(idx, 1);

    function checkContractEligibility(empStatus, type) {
        const branch = document.getElementById('set-branch-select')?.value || 'Global';
        const rules = (LOSHRIS_ORG_CONFIG.payrollRules[branch] || LOSHRIS_ORG_CONFIG.payrollRules['Global']).contractRules;
        if (!rules) return false;
        const st = (empStatus || '').toLowerCase();
        const rule = rules.find(r => st.includes(r.status.toLowerCase()));
        if (!rule) return false;
        return rule[type] === true;
    }

        const btn = document.getElementById('ltab-' + tabId);
        if (pane) pane.classList.remove('hidden');
        if (btn) { btn.style.borderColor = '#1a5c37'; btn.style.color = '#1a5c37'; }
    };

    window.showLanyard = function (nik) {
        const overlay = document.getElementById('lanyard-overlay');
        if (!overlay) return;
        const ci = getCompanyInfo();
        const logoEl = document.getElementById('lanyard-company-logo');
        const compNameEl = document.getElementById('lanyard-company-name');
        if (logoEl && ci.logo) logoEl.src = ci.logo;
        if (compNameEl) compNameEl.textContent = ci.nama || 'LOS CIKEN';

        const allEmp = (typeof globalEmployees !== 'undefined' ? globalEmployees : []);
        const emp = allEmp.find(e => String(e['NIK'] || '').trim() === String(nik).trim());

        if (!emp) {
            document.getElementById('lanyard-nama').textContent = 'Karyawan Tidak Ditemukan';
            document.getElementById('lanyard-jabatan').textContent = 'NIK: ' + nik;
            document.getElementById('lanyard-id').textContent = 'ID: -';
            const av = document.getElementById('lanyard-avatar');
            if (av) { av.innerHTML = ''; av.textContent = '?'; }
            overlay.classList.remove('hidden'); overlay.scrollTop = 0;
            switchLanyardTab('info'); return;
        }

        _lanyardCurrentNik = nik;
        const S = v => String(v || '').trim();

        document.getElementById('lanyard-nama').textContent = S(emp['Nama Lengkap']) || '-';
        document.getElementById('lanyard-jabatan').textContent = S(emp['Posisi']) || '-';
        document.getElementById('lanyard-id').textContent = 'ID Karyawan: ' + (S(emp['NIK']) || '-');

        const av = document.getElementById('lanyard-avatar');
        if (av) {
            const foto = S(emp['Foto']);
            if (foto.startsWith('http')) {
                av.innerHTML = `<img src="${foto}" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='';this.parentElement.textContent='${S(emp['Nama Lengkap']).charAt(0)}'">`;
            } else { av.innerHTML = ''; av.textContent = S(emp['Nama Lengkap']).charAt(0); }
        }

        const isAktif = emp._isAktif !== false;
        const bSt = document.getElementById('lanyard-badge-status');
        if (bSt) { bSt.innerHTML = `<span class="material-icons text-[12px]">${isAktif ? 'check_circle' : 'cancel'}</span>${S(emp['Status']) || 'Aktif'}`; bSt.className = `px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1 ${isAktif ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}`; }
        const bCb = document.getElementById('lanyard-badge-cabang');
        if (bCb) bCb.innerHTML = `<span class="material-icons text-[12px]">storefront</span>${S(emp['Penempatan']) || '-'}`;
        const bDv = document.getElementById('lanyard-badge-divisi');
        if (bDv) bDv.innerHTML = `<span class="material-icons text-[12px]">work</span>${S(emp['Posisi']) || '-'}`;

        const setLi = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v || '-'; };
        setLi('li-nama', emp['Nama Lengkap']); setLi('li-tglmasuk', emp['Tgl Masuk']);
        setLi('li-divisi', emp['Penempatan']); setLi('li-email', emp['Email']);
        setLi('li-jabatan', emp['Posisi']); setLi('li-nik', emp['NIK']);
        setLi('li-cabang', emp['Penempatan']);
        const liSt = document.getElementById('li-status');
        if (liSt) { liSt.textContent = S(emp['Status']) || '-'; liSt.className = `inline-block px-2.5 py-1 rounded-lg text-xs font-bold ${isAktif ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}`; }

        // Kontak Darurat
        const kl = document.getElementById('lanyard-kontak-list');
        if (kl) {
            const contacts = [];
            if (S(emp['Darurat Nama'])) contacts.push({ nama: S(emp['Darurat Nama']), hub: S(emp['Darurat Hubungan']), telp: S(emp['Darurat Telp']) });
            if (S(emp['Darurat Nama 2'])) contacts.push({ nama: S(emp['Darurat Nama 2']), hub: S(emp['Darurat Hubungan 2']), telp: S(emp['Darurat Telp 2']) });
            kl.innerHTML = contacts.length ? contacts.map(c => `
            <div class="flex items-center justify-between bg-gray-50 rounded-xl p-4 border border-gray-100 flex-wrap gap-3">
                <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center shrink-0"><span class="material-icons text-gray-500 text-[18px]">person</span></div>
                    <div><p class="font-bold text-gray-800 text-sm">${c.nama}${c.hub ? ' <span class="font-normal text-gray-500">(' + c.hub + ')</span>' : ''}</p><p class="text-gray-500 text-xs">${c.telp || '-'}</p></div></div>
                <div class="flex gap-2">
                    ${c.telp ? `<a href="tel:${c.telp}" class="flex items-center gap-1 px-3 py-2 border border-gray-200 rounded-xl text-xs font-bold text-gray-600 hover:bg-gray-100 transition"><span class="material-icons text-[14px]">call</span>Call</a>` : ''}
                    ${c.telp ? `<a href="https://wa.me/${c.telp.replace(/[^0-9]/g, '')}" target="_blank" class="flex items-center gap-1 px-3 py-2 text-white rounded-xl text-xs font-bold hover:opacity-90 transition" style="background:#25d366"><span class="material-icons text-[14px]">chat</span>WhatsApp</a>` : ''}
                </div></div>`).join('')
                : '<p class="text-gray-400 text-sm italic text-center py-4">Tidak ada data kontak darurat.</p>';
        }

        // Org Tree
        (function renderTree() {
            const tree = document.getElementById('lanyard-org-tree');
            if (!tree) return;
            let orgData = {};
            try { orgData = JSON.parse(localStorage.getItem('LOSHRIS_LANYARD_ORG') || '{}'); } catch (e) { }
            const eo = orgData[String(nik)] || {};
            const mkN = (n, j, hl) => `<div style="display:inline-flex;flex-direction:column;align-items:center;padding:10px 16px;background:${hl ? '#1a5c37' : 'white'};color:${hl ? 'white' : '#374151'};border-radius:12px;border:2px solid ${hl ? '#1a5c37' : '#e5e7eb'};min-width:140px;box-shadow:0 2px 8px rgba(0,0,0,.08);text-align:center"><span class="material-icons" style="font-size:18px;margin-bottom:4px;color:${hl ? '#86efac' : '#9ca3af'}">person</span><p style="font-size:11px;color:${hl ? '#86efac' : '#6b7280'}">${j}</p><p style="font-size:13px;font-weight:800">${n}</p></div>`;
            const ln = () => `<div style="width:2px;height:24px;background:#d1d5db;margin:0 auto"></div>`;
            let h = '';
            if (eo.atasan?.nama) { h += mkN(eo.atasan.nama, eo.atasan.jabatan || 'Atasan', false); h += ln(); }
            h += mkN(S(emp['Nama Lengkap']), S(emp['Posisi']), true);
            if (eo.bawahan?.length) {
                h += ln();
                h += `<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">`;
                eo.bawahan.forEach(b => { h += mkN(b.nama, b.jabatan || 'Staf', false); });
                h += `</div>`;
            }
            if (!eo.atasan && !eo.bawahan?.length) h += `<p style="color:#9ca3af;font-size:13px;margin-top:12px;font-style:italic;text-align:center">Struktur organisasi belum dikonfigurasi.<br>Atur di HRIS Setting → Tab Lanyard.</p>`;
            tree.innerHTML = h;
        })();

        // Company Links
        (function renderLinks() {
            const el = document.getElementById('lanyard-company-links');
            if (!el) return;
            const lk = [{ l: 'Portal Karyawan', i: 'link', u: ci.linkPortal }, { l: 'Kebijakan Perusahaan', i: 'policy', u: ci.linkKebijakan }, { l: 'Buku Panduan', i: 'menu_book', u: ci.linkPanduan }, { l: 'Website ' + ci.nama, i: 'language', u: ci.website }, { l: 'Media Sosial', i: 'photo_camera', u: ci.linkSosmed }].filter(x => x.u);
            el.innerHTML = lk.length ? lk.map(x => `<a href="${x.u}" target="_blank" class="flex items-center gap-3 p-3 border border-gray-200 rounded-xl hover:shadow-md transition hover:border-emerald-300"><div class="w-9 h-9 rounded-lg flex items-center justify-center" style="background:#1a5c37"><span class="material-icons text-white text-[18px]">${x.i}</span></div><div class="flex-1 min-w-0"><p class="text-xs font-bold text-gray-700 truncate">${x.l}</p><p class="text-[10px] text-gray-400 flex items-center gap-0.5"><span class="material-icons text-[10px]">open_in_new</span>Buka Link</p></div></a>`).join('')
                : '<p class="col-span-2 text-gray-400 text-sm italic text-center py-4">Belum ada link. Atur di HRIS Setting → Info Perusahaan.</p>';
        })();

        overlay.classList.remove('hidden'); overlay.scrollTop = 0;
        switchLanyardTab('info');
    };

    window.closeLanyard = function () {
        const o = document.getElementById('lanyard-overlay'); if (o) o.classList.add('hidden');
    };

    window.openLanyardFromDrawer = function () {
        console.log("Memanggil openLanyardFromDrawer, currentDrawerIndex:", currentDrawerIndex);
        if (currentDrawerIndex < 0) {
            alert("Data karyawan tidak valid.");
            return;
        }
        const emp = globalEmployees[currentDrawerIndex];
        if (!emp) {
            alert("Data karyawan tidak ditemukan.");
            return;
        }
        const nik = String(emp['NIK'] || '').trim();
        if (!nik) {
            alert("Karyawan ini tidak memiliki NIK.");
            return;
        }
        closeEmployeeDrawer();
        setTimeout(() => {
            showLanyard(nik);
        }, 350);
    };

    window.previewLanyardDemo = function () {
        const all = (typeof globalEmployees !== 'undefined' ? globalEmployees : []);
        if (all.length) showLanyard(String(all[0]['NIK'] || '').trim());
        else if (typeof showToast === 'function') showToast('⚠️ Data karyawan belum termuat.', 'warning');
        else alert('Data karyawan belum termuat.');
    };

    function checkLanyardURL() { /* disabled */ }

    window.loadLanyardOrgEditor = function () {
        const ni = document.getElementById('lanyard-nik-input');
        if (!ni) return;
        const nik = ni.value.trim();
        if (!nik) return alert('Masukkan NIK!');
        const emp = (typeof globalEmployees !== 'undefined' ? globalEmployees : []).find(e => String(e['NIK'] || '').trim() === nik);
        if (!emp) return alert('NIK tidak ditemukan.');
        let orgData = {};
        try { orgData = JSON.parse(localStorage.getItem('LOSHRIS_LANYARD_ORG') || '{}'); } catch (e) { }
        const eo = orgData[nik] || {};
        const ie = document.getElementById('lanyard-emp-info');
        if (ie) ie.textContent = `✏️ ${emp['Nama Lengkap']} — ${emp['Posisi']} @ ${emp['Penempatan']}`;
        const an = document.getElementById('lanyard-atasan-nama');
        const aj = document.getElementById('lanyard-atasan-jabatan');
        if (an) an.value = eo.atasan?.nama || '';
        if (aj) aj.value = eo.atasan?.jabatan || '';
        _lanyardBawahanTemp = (eo.bawahan || []).map(b => ({ ...b }));
        renderLanyardBawahanEditor();
        const ed = document.getElementById('lanyard-org-editor');
        if (ed) { ed.classList.remove('hidden'); ed.dataset.nik = nik; }
    };

    window.addLanyardBawahan = function () { _lanyardBawahanTemp.push({ nama: '', jabatan: '' }); renderLanyardBawahanEditor(); };

    function renderLanyardBawahanEditor() {
        const list = document.getElementById('lanyard-bawahan-list');
        if (!list) return;
        list.innerHTML = _lanyardBawahanTemp.map((b, i) => `
        <div class="flex gap-2 items-center">
            <input type="text" value="${b.nama}" placeholder="Nama" oninput="_lanyardBawahanTemp[${i}].nama=this.value" class="flex-1 border border-gray-200 rounded-lg px-2 py-1.5 text-xs outline-none focus:border-emerald-400">
            <input type="text" value="${b.jabatan}" placeholder="Jabatan" oninput="_lanyardBawahanTemp[${i}].jabatan=this.value" class="flex-1 border border-gray-200 rounded-lg px-2 py-1.5 text-xs outline-none focus:border-emerald-400">
            <button onclick="_lanyardBawahanTemp.splice(${i},1);renderLanyardBawahanEditor()" class="text-red-400 hover:text-red-600 p-0.5"><span class="material-icons text-[16px]">close</span></button>
        </div>`).join('');
    }

    window.saveLanyardOrg = function () {
        const ed = document.getElementById('lanyard-org-editor');
        const nik = ed?.dataset.nik; if (!nik) return;
        const an = document.getElementById('lanyard-atasan-nama')?.value.trim();
        const aj = document.getElementById('lanyard-atasan-jabatan')?.value.trim();
        let orgData = {};
        try { orgData = JSON.parse(localStorage.getItem('LOSHRIS_LANYARD_ORG') || '{}'); } catch (e) { }
        orgData[nik] = { atasan: an ? { nama: an, jabatan: aj } : null, bawahan: _lanyardBawahanTemp.filter(b => b.nama.trim()) };
        localStorage.setItem('LOSHRIS_LANYARD_ORG', JSON.stringify(orgData));
        if (typeof showToast === 'function') showToast('✅ Struktur Lanyard disimpan!', 'success');
        else alert('✅ Disimpan!');
    };

    // Auto-check URL param on load
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', checkLanyardURL);
    } else {
        setTimeout(checkLanyardURL, 100);
    }

</script>
