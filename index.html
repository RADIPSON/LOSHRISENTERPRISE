<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LOSHRIS Enterprise</title>

    <meta name="theme-color" content="#0b0b0c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="icon.png">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0b0c;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #loading-text {
            color: #999;
            font-family: sans-serif;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <!--
      Sengaja TIDAK memakai <iframe> lagi: nge-iframe URL Apps Script menambah satu
      lapis nesting iframe DI ATAS sandbox iframe internal milik Apps Script sendiri.
      Nested iframe 2+ level itu yang bikin browser mobile mengabaikan meta viewport
      Index.html, sehingga kontennya dirender di lebar desktop lalu ke-squeeze/kepotong
      ke kotak iframe (gejala: card login sempit, nempel ke satu sisi). Redirect
      langsung = tidak ada iframe tambahan = viewport mobile dihormati normal, sama
      seperti buka /exec langsung di tab baru.
    -->
    <p id="loading-text">Membuka LOSHRIS Enterprise...</p>
    <script>
        window.location.replace(
            "https://script.google.com/macros/s/AKfycbz8f6E2WkdFZMTLEGrPwbG86q5Doq1myEH7YbZtvlLZyG9JF1xvsh39iTcidgWOFclwVA/exec"
        );
    </script>

</body>

</html>
