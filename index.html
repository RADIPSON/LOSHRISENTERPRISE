    function updateBranchTotals() {
        // Update grand total row jika ada
        const totals = { thp: 0, tgl1: 0, tgl2: 0, baseCalc: 0, substraction: 0, additional: 0 };
        Object.values(payrollDataState).forEach(s => {
            totals.thp += s.thp || 0;
            totals.tgl1 += s.tgl1 || 0;
            totals.tgl2 += s.tgl2 || 0;
            totals.baseCalc += s.baseCalc || 0;
            totals.substraction += s.substraction || 0;
            totals.additional += s.additional || 0;
        });
        const fmt = n => 'Rp' + new Intl.NumberFormat('id-ID').format(Math.round(n));
        ['thp', 'tgl1', 'tgl2', 'baseCalc', 'substraction', 'additional'].forEach(k => {
            const el = document.getElementById('pr_grand_' + k);
            if (el) el.textContent = fmt(totals[k]);
        });
    }

    // ---- Export BI-FAST per branch ----
    function exportBranchBIFast(branch, tanggal, format) {
        const emps = aktifList.filter(e => (e['Penempatan'] || 'Tanpa Cabang') === branch);
        const rows = [];
        emps.forEach(e => {
            const s = payrollDataState[e['NIK']];
            if (!s) return;
            const amt = tanggal === 1 ? s.tgl1 : tanggal === 10 ? s.tgl2 : s.thp;
            if (amt > 0) rows.push({
                nama: e['Nama Lengkap'], bank: s.namaBank || e['Bank'] || '',
                noRek: s.noRek || e['Rekening'] || '', atasNama: s.atasNama || e['Atas Nama'] || e['Nama Lengkap'],
                nominal: Math.round(amt), ket: tanggal === 0 ? 'Full THP' : 'Gaji Tgl ' + tanggal
            });
        });
        if (!rows.length) return showToast('Tidak ada data dengan nominal > 0', 'warning');

        if (format === 'xlsx') {
            const data = [['Nama', 'Bank', 'No. Rekening', 'Atas Nama', 'Nominal', 'Keterangan']];
            rows.forEach(r => data.push([r.nama, r.bank, r.noRek, r.atasNama, r.nominal, r.ket]));
            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, branch.slice(0, 30));
            XLSX.writeFile(wb, `Payroll_${branch}_${new Date().toISOString().slice(0, 10)}.xlsx`);
        } else {
            let csv = 'Nama,Bank,No Rekening,Atas Nama,Nominal,Keterangan\n';
            rows.forEach(r => csv += `${r.nama},${r.bank},${r.noRek},${r.atasNama},${r.nominal},${r.ket}\n`);
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
            a.download = `BIFast_${branch}_Tgl${tanggal}_${new Date().toISOString().slice(0, 10)}.csv`;
            a.click(); URL.revokeObjectURL(a.href);
        }
    }

        text += `NIK    : ${nik}\n`;

        text += `Posisi : ${emp['Posisi'] || '-'}\n`;
        text += `Status : ${emp['Status'] || '-'}\n`;
        text += `==================================\n\n`;

        text += `[ PENDAPATAN ]\n`;

        text += `Tunjangan          : ${fmt(state.tj)}\n`;
        text += `Tunjangan BPJS     : ${fmt(state.bpjs)}\n`;
        if (state.lembur > 0) text += `Uang Lembur        : ${fmt((state.lembur / 8) * (state.gp / 26))}\n`;
        if (state.bu > 0 || state.ls > 0) text += `Upah Shift/Backup  : ${fmt((state.bu + state.ls) * (state.gp / 26))}\n`;
        text += `\n[ POTONGAN ]\n`;
        if (state.th > 0) text += `Alpha (${state.th}x)         : -${fmt(state.th * (state.gp / 26))}\n`;
        if (state.s > 0) text += `Sakit (${state.s}x)         : -${fmt(state.s * (state.gp / 26) * 0.3)}\n`;
        if (state.telat > 0) text += `Telat (${state.telat}m)         : -${fmt(state.telat * 1000)}\n`;

        text += `\n==================================\n`;
        text += `TOTAL TGL 1        : ${fmt(state.tgl1)}\n`;
        text += `==================================\n\n`;

        text += `[ BONUS & KPI (TGL 10) ]\n`;
        if (state.omzet > 0) text += `Bonus Omzet        : ${fmt(state.omzet)}\n`;
        if (state.hol > 0) text += `Holiday Pay        : ${fmt(state.hol * 50000)}\n`;

    function loadHRTaskData(skipSync = false) {
        showLoader(true, 'Sinkronisasi HR Task...');

            showLoader(false);
            renderHRTask();
            return;
        }

        const fetchTasks = () => {
            google.script.run
                .withSuccessHandler(res => {
                    showLoader(false);

                    if (!res || !res.success) {
                        showToast('Gagal memuat HR TASK: ' + (res ? res.error : 'Server tidak merespons'), 'error');
                        return;
                    }

                    hrTasks = res.tasks || [];
                    hrTaskTransitions = {
                        resignedEmployees: res.resignedEmployees || [],
                        newEmployees: res.newEmployees || []
                    };

                    hrTasksLoaded = true;
                    localStorage.setItem('LOSHRIS_TASKS_HR', JSON.stringify(hrTasks));
                    localStorage.setItem('LOSHRIS_HRTASK_TRANSITIONS', JSON.stringify(hrTaskTransitions));

                    switchHRTaskTab(currentHRTaskTab || 'daily');
                })
                .withFailureHandler(err => {
                    showLoader(false);
                    showToast('Gagal mengambil data HR TASK: ' + err, 'error');
                })
                .getHRTaskData();
        };

        if (skipSync) {
            fetchTasks();
        } else {
            google.script.run
                .withSuccessHandler(syncRes => {
                    fetchTasks();
                })
                .withFailureHandler(err => {
                    showLoader(false);
                    showToast('Gagal sinkron data transisi HRIS: ' + err, 'error');
                })
                .syncHRTaskResignAndNewEmployees();
        }
    }

        document.getElementById('ht-kategori').value = 'Harian';

    function saveHRTask() {
        const data = {
            kategori: document.getElementById('ht-kategori')?.value || 'Harian',
            deskripsi: document.getElementById('ht-deskripsi')?.value.trim() || '',
            status: document.getElementById('ht-status')?.value || 'Proses',
            foto: '',
            keterangan: document.getElementById('ht-keterangan')?.value.trim() || ''
        };

        if (!data.deskripsi) return showToast('Deskripsi tugas wajib diisi.', 'error');

        showLoader(true, 'Menyimpan tugas HR...');

        const submitRecord = (finalData) => {
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(res => {
                        showLoader(false);

                        if (!res || !res.success) {
                            showToast('Gagal menyimpan: ' + (res ? res.error : 'Server tidak merespons'), 'error');
                            return;
                        }

                        closeHRTaskModal();
                        clearHRTaskPhoto();
                        loadHRTaskData(true); // Bypass slow transition status sync
                    })
                    .withFailureHandler(err => {
                        showLoader(false);
                        showToast('Gagal menyimpan tugas: ' + err, 'error');
                    })
                    .addHRTaskRecord(finalData);
            } else {
                // Fallback offline
                showLoader(false);
                finalData.rowIdx = hrTasks.length > 0 ? Math.max(...hrTasks.map(t => t.rowIdx)) + 1 : 2;
                hrTasks.push(finalData);
                localStorage.setItem('LOSHRIS_TASKS_HR', JSON.stringify(hrTasks));
                closeHRTaskModal();
                clearHRTaskPhoto();
                renderHRTask();
            }
        };

        if (selectedHRTaskPhoto) {
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                showLoader(true, 'Mengupload foto pendukung...');
                google.script.run
                    .withSuccessHandler(uploadRes => {
                        if (uploadRes && uploadRes.success) {
                            data.foto = uploadRes.url;
                            submitRecord(data);
                        } else {
                            showLoader(false);
                            showToast('Gagal mengupload foto: ' + (uploadRes ? uploadRes.error : 'Error tidak diketahui'), 'error');
                        }
                    })
                    .withFailureHandler(err => {
                        showLoader(false);
                        showToast('Gagal mengupload foto: ' + err, 'error');
                    })
                    .uploadHRTaskFile(selectedHRTaskPhoto.base64Data, selectedHRTaskPhoto.filename, selectedHRTaskPhoto.mimeType);
            } else {
                // Mock offline base64
                data.foto = selectedHRTaskPhoto.base64Data;
                submitRecord(data);
            }
        } else {
            submitRecord(data);
        }
    }

    function toggleHRTaskStatus(rowIdx, status) {
        // Optimistic UI Update: Ubah status lencana secara instan di layar
        const rowEl = document.getElementById('hrtask-row-' + rowIdx);
        if (rowEl) {
            const span = rowEl.querySelector('span');
            if (span) {
                const isSelesai = status === 'Selesai';
                span.className = `px-2 py-1 rounded-lg text-[10px] font-bold ${isSelesai ? 'text-emerald-700 bg-emerald-50' : 'text-orange-600 bg-orange-50'}`;
                span.innerText = status;
            }
        }

        showLoader(true, 'Mengupdate status...');

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(res => {
                    showLoader(false);
                    if (res && res.success) loadHRTaskData(true); // Bypass sync
                    else showToast('Gagal update status: ' + (res ? res.error : 'Unknown error'), 'error');
                })
                .withFailureHandler(err => {
                    showLoader(false);
                    showToast('Gagal update status: ' + err, 'error');
                })
                .updateHRTaskStatusRecord(rowIdx, status);
        } else {
            // offline fallback
            showLoader(false);
            const t = hrTasks.find(x => x.rowIdx === rowIdx);
            if (t) {
                t.status = status;
                localStorage.setItem('LOSHRIS_TASKS_HR', JSON.stringify(hrTasks));
            }
            renderHRTask();
        }
    }

    function deleteHRTask(rowIdx) {
        // Gunakan Custom Premium Confirm Modal yang sangat estetik
        showConfirm(
            'Hapus Tugas?',
            'Apakah Anda yakin ingin menghapus tugas ini dari sheet HR TASK? Tindakan ini tidak dapat dibatalkan.',
            () => {
                // Optimistic UI Update: Hilangkan baris secara instan dengan efek fade-out & scale-down
                const rowEl = document.getElementById('hrtask-row-' + rowIdx);
                if (rowEl) {
                    rowEl.style.transition = 'all 0.25s cubic-bezier(0.4, 0, 0.2, 1)';
                    rowEl.style.opacity = '0';
                    rowEl.style.transform = 'scale(0.95) translateY(4px)';
                    setTimeout(() => {
                        rowEl.style.display = 'none';
                    }, 250);
                }

                showLoader(true, 'Menghapus tugas...');

                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler(res => {
                            showLoader(false);
                            if (res && res.success) loadHRTaskData(true); // Bypass sync
                            else showToast('Gagal hapus: ' + (res ? res.error : 'Unknown error'), 'error');
                        })
                        .withFailureHandler(err => {
                            showLoader(false);
                            showToast('Gagal hapus tugas: ' + err, 'error');
                        })
                        .deleteHRTaskRecord(rowIdx);
                } else {
                    // offline fallback
                    showLoader(false);
                    hrTasks = hrTasks.filter(x => x.rowIdx !== rowIdx);
                    localStorage.setItem('LOSHRIS_TASKS_HR', JSON.stringify(hrTasks));
                    renderHRTask();
                }
            }
        );
    }

        ws['!cols'] = [

            { wch: 30 }, // Foto
            { wch: 40 }, // Keterangan

        // Buat workbook baru dan lampirkan worksheet
        const wb = XLSX.utils.book_new();

    }

    function renderSembako() {
        const tbody = document.getElementById('sembako-table-body');
        if (!tbody) return;
        if (!globalEmployees.length) {
            tbody.innerHTML = '<tr><td colspan="8" class="px-6 py-8 text-center text-gray-400">Data master belum dimuat.</td></tr>';
            return;
        }

        const isEligible = emp => {
            const m = (emp['Pernikahan'] || '').toLowerCase();
            const s = (emp['Status'] || '').toLowerCase();
            return m.includes('menikah') && !m.includes('belum') &&
                (s.includes('kontrak') || s.includes('tetap'));
        };

        const saved = safeParse('LOSHRIS_SEMBAKO_STATUS', {});
        const sorted = [...globalEmployees].sort((a, b) => (isEligible(b) ? 1 : 0) - (isEligible(a) ? 1 : 0));

        tbody.innerHTML = sorted.map(emp => {
            const nik = emp['NIK'];
            const el = isEligible(emp);
            const status = saved[nik] || (el ? 'Diberikan' : 'Tidak Diberikan');
            const telp = String(emp['Telepon'] || '').trim();
            const waNum = telp.replace(/\D/g, '').replace(/^0/, '62');
            const hasWA = waNum.length >= 10;

            const stLower = (emp['Status'] || '').toLowerCase();
            let stBadge = 'bg-gray-100 text-gray-600';
            if (stLower.includes('probation')) stBadge = 'bg-blue-100 text-blue-700';
            else if (stLower.includes('kontrak i') && !stLower.includes('ii')) stBadge = 'bg-indigo-100 text-indigo-700';
            else if (stLower.includes('kontrak ii')) stBadge = 'bg-purple-100 text-purple-700';
            else if (!emp._isAktif) stBadge = 'bg-red-100 text-red-600';
            else if (el) stBadge = 'bg-emerald-100 text-emerald-700';

            const namaSafe = (emp['Nama Panggilan'] || emp['Nama Lengkap']).replace(/'/g, "\\'");

            return `<tr class="hover:bg-emerald-50/30 border-b border-gray-100 transition">
      <td class="px-4 py-3">
        <p class="font-semibold text-gray-800">${emp['Nama Lengkap']}</p>
        <p class="text-[10px] text-gray-400 font-mono mt-0.5">${nik}</p>
      </td>
      <td class="px-4 py-3 text-sm text-gray-600">${emp['Penempatan'] || '-'}</td>
      <td class="px-4 py-3 text-center">
        <span class="px-2 py-1 rounded-lg text-[10px] font-bold ${stBadge}">${emp['Status'] || '-'}</span>
      </td>
      <td class="px-4 py-3 text-center text-sm font-medium text-gray-700">${emp['Pernikahan'] || '-'}</td>
      <td class="px-4 py-3">
        ${hasWA
                    ? `<span class="font-mono text-xs text-gray-700">${telp}</span>`
                    : `<span class="flex items-center gap-1 text-[11px] text-red-400 italic font-medium">
               <span class="material-icons text-[13px]">warning</span>Kosong
             </span>`
                }
      </td>
      <td class="px-4 py-3 text-center">
        <select class="w-full border border-gray-300 rounded-lg px-2 py-1.5 text-xs outline-none
                       focus:border-emerald-400 bg-white"
                id="smb_status_${nik}"
                onchange="saveSembakoStatus('${nik}')">
          <option value="Diberikan"       ${status === 'Diberikan' ? 'selected' : ''}>✅ Diberikan</option>
          <option value="Tidak Diberikan" ${status === 'Tidak Diberikan' ? 'selected' : ''}>❌ Tidak Diberikan</option>
        </select>
      </td>
      <td class="px-4 py-3">
        <input type="text" id="smb_note_${nik}" placeholder="Catatan..."
               class="w-full border-b border-gray-200 bg-transparent px-1 py-1 text-xs
                      outline-none focus:border-emerald-400 transition"
               value="">
      </td>
      <td class="px-4 py-3 text-center">
        <div class="flex items-center justify-center gap-1.5">
          ${hasWA
                    ? `<button onclick="kirimWASembako('${waNum}','${namaSafe}')"
                       title="Kirim WA" class="p-1.5 bg-emerald-50 text-emerald-700 border border-emerald-200
                              rounded-lg hover:bg-emerald-100 transition">
                 <span class="material-icons text-[16px]">whatsapp</span>
               </button>`
                    : `<span class="text-[10px] text-gray-300">—</span>`
                }
          <button onclick="openSembakoEditModal('${nik}')"
                  title="Edit data karyawan"
                  class="p-1.5 bg-blue-50 text-blue-600 border border-blue-200
                         rounded-lg hover:bg-blue-100 transition">
            <span class="material-icons text-[16px]">edit</span>
          </button>
        </div>
      </td>
    </tr>`;
        }).join('');
    }

    function exportSembakoPDF() {
        if (typeof window.jspdf === 'undefined') {
            return showToast('Library PDF sedang dimuat, pastikan koneksi internet stabil lalu coba lagi.', 'warning');
        }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'pt', 'a4');

        const data = [];
        const saved = safeParse('LOSHRIS_SEMBAKO_STATUS', {});
        let idx = 1;

        globalEmployees.forEach(emp => {
            const stEl = document.getElementById('smb_status_' + emp['NIK']);
            const status = stEl ? stEl.value : (saved[emp['NIK']] || '-');
            if (status !== 'Diberikan') return;

            data.push([
                idx++,
                emp['Nama Lengkap'],
                emp['Penempatan'],
                '' // Area Tanda Tangan
            ]);
        });

        if (data.length === 0) return showToast('Tidak ada data penerima sembako.', 'warning');

        doc.setFontSize(16);
        doc.text('Laporan Tanda Terima Benefit Sembako', 40, 40);

        doc.setFontSize(10);
        doc.text(`Tanggal Cetak: ${new Date().toLocaleDateString('id-ID')}`, 40, 60);

        doc.autoTable({
            startY: 80,
            head: [['No', 'Nama Karyawan', 'Cabang', 'Tanda Tangan']],
            body: data,
            theme: 'grid',
            headStyles: { fillColor: [11, 92, 255] },
            columnStyles: {
                0: { cellWidth: 30, halign: 'center' },
                1: { cellWidth: 150 },
                2: { cellWidth: 100 },

    function getSapaanWaktu() {
        const jam = new Date().getHours();
        if (jam >= 4 && jam < 11) return 'pagi';
        if (jam >= 11 && jam < 15) return 'siang';
        if (jam >= 15 && jam < 18) return 'sore';
        return 'malam';
    }

    function kirimSemuaWASembako() {
        if (!globalEmployees.length) return showToast('Data karyawan belum dimuat.', 'error');

        const isEligible = emp => {
            const m = (emp['Pernikahan'] || '').toLowerCase();
            const s = (emp['Status'] || '').toLowerCase();
            return m.includes('menikah') && !m.includes('belum') &&
                (s.includes('kontrak') || s.includes('tetap'));
        };

        const targets = globalEmployees.filter(emp => {
            if (!isEligible(emp)) return false;
            const stEl = document.getElementById('smb_status_' + emp['NIK']);
            const status = stEl ? stEl.value : 'Diberikan';
            const wa = (emp['Telepon'] || '').replace(/\D/g, '').replace(/^0/, '62');
            return status === 'Diberikan' && wa.length >= 10;
        });

        if (!targets.length) return showToast('Tidak ada penerima dengan nomor WA valid.', 'warning');
        if (!confirm(`Buka ${targets.length} chat WhatsApp?\n\nPastikan pop-up browser sudah diizinkan.`)) return;

        const sapaan = getSapaanWaktu();
        targets.forEach((emp, i) => {
            const wa = (emp['Telepon'] || '').replace(/\D/g, '').replace(/^0/, '62');
            const panggilan = emp['Nama Panggilan'] || emp['Nama Lengkap'];
            const pesan =
                `Selamat siang Sdr. ${panggilan} \n\n` +
                `Kami informasikan bahwa benefit *sembako* bulan ini sudah bisa diambil ` +
                `pada jam kerja kantor *08:00–16:00*.\n\n` +
                `Harap segera diambil ya, terima kasih!`;
            setTimeout(() => window.open(`https://wa.me/${wa}?text=${encodeURIComponent(pesan)}`, '_blank'), i * 700);
        });

        showToast(`✅ Membuka ${targets.length} chat WhatsApp...`, 'success');
    }

                base64Data: e.target.result,
                filename: file.name,
                mimeType: file.type || (file.name.endsWith('.pdf') ? 'application/pdf' : 'image/png')

    function previewCV(url) {
        if (!url) return;
        let previewUrl = url;
        // Convert google drive view urls to preview mode to embed in iframe
        if (url.includes('drive.google.com') && url.includes('/view')) {
            previewUrl = url.replace('/view', '/preview');
        } else if (url.includes('drive.google.com') && url.includes('/open?id=')) {
            try {
                const id = url.split('id=')[1].split('&')[0];
                previewUrl = `https://drive.google.com/file/d/${id}/preview`;
            } catch (e) { }
        }

        const titleEl = document.getElementById('preview-modal-title');
        if (titleEl) {
            titleEl.innerHTML = `<span class="material-icons text-indigo-500">picture_as_pdf</span>Preview CV`;
        }
        document.getElementById('preview-iframe').src = previewUrl;
        document.getElementById('preview-modal').classList.remove('hidden');
    }

    function moveToATS(idx) {
        const c = window.formCandidates[idx];
        if (!c) return;

        if (!confirm(`Pindahkan kandidat ${c.nama} ke ATS (Tab Kandidat & ATS)?`)) return;

        showLoader(true, 'Memindahkan ke ATS...');

        const finalCandidate = {
            nama: c.nama,
            panggilan: c.panggilan || '',
            posisi: c.posisi || '',
            wa: (c.wa || '').replace(/^0+/, '').replace(/\D/g, ''),
            status: c.status || 'Sourcing',
            tanggal: c.tanggal || new Date().toISOString().slice(0, 10),
            catatan: c.catatan || '',
            cv: c.cv || '',
            email: c.email || '',
            domisili: c.domisili || ''
        };

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(res => {
                    showLoader(false);
                    if (res.success) {
                        // Refresh ATS tab
                        candidatesLoaded = false;
                        loadCandidatesFromSheet();
                        switchRecTab('kandidat');
                    } else {
                        showToast('Gagal memindahkan: ' + (res.error || ''), 'error');
                    }
                })
                .withFailureHandler(err => {
                    showLoader(false);
                    showToast('Koneksi error: ' + err, 'error');
                })
                .addCandidateRecord(finalCandidate);
        } else {
            // fallback offline
            showLoader(false);
            showToast('Offline mode: simulasi pindah berhasil.', 'success');
            switchRecTab('kandidat');
        }
    }

        if (filter === 'pipeline') source = source.filter(c => ['Sourcing', 'Interview', 'Inkubasi'].includes(c.status));

        else if (filter === 'Tidak Merespons') source = source.filter(c => c.status === 'Tidak Merespons');

        if (q) source = source.filter(c =>
            (c.nama || '').toLowerCase().includes(q) ||
            (c.posisi || '').toLowerCase().includes(q) ||
            (c.panggilan || '').toLowerCase().includes(q)

        if (!source.length) {
            const msgs = {
                semua: 'Belum ada kandidat. Tambahkan lewat tombol di atas.',
                pipeline: 'Tidak ada kandidat di pipeline aktif.',

            const isDitolak = c.status === 'Ditolak';
            const isTidakRespons = c.status === 'Tidak Merespons';

            const cvHtml = c.cv
                ? `<button onclick="previewCV('${c.cv}')" type="button" class="text-indigo-600 hover:text-indigo-800 hover:underline inline-flex items-center gap-0.5 font-bold">
             <span class="material-icons text-[14px]">picture_as_pdf</span>Lihat CV

            return `<tr class="border-b border-gray-50 hover:bg-gray-50 transition ${isDitolak || isTidakRespons ? 'opacity-60' : ''}">
        <td class="px-4 py-3">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl flex items-center justify-center text-white font-bold text-xs shrink-0"
                 style="background:${color}">${(c.nama || '?').charAt(0)}</div>
            <p class="font-semibold text-sm text-gray-800">${c.nama}</p>
          </div>
        </td>
        <td class="px-4 py-3 text-xs text-gray-500">${c.panggilan || '-'}</td>
        <td class="px-4 py-3 text-xs font-medium text-gray-600">${c.posisi}</td>
        <td class="px-4 py-3 font-mono text-xs text-gray-500">+62${c.wa}</td>
        <td class="px-4 py-3 text-xs">
          ${cvHtml}
        </td>
        <td class="px-4 py-3">
          <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-[10px] font-bold border ${sc.cls}">
            <span class="material-icons text-[11px]">${sc.icon}</span>${c.status}
          </span>
        </td>
        <td class="px-4 py-3 text-center">
          <div class="flex gap-1 justify-center flex-wrap">
            <button onclick="editCandidate(${idx})" class="p-1.5 text-blue-500 hover:bg-blue-50 rounded-lg" title="Edit">

            </button>

            </button>
            ${inPipeline ? `
              <button onclick="openWAModal(${idx},'interview')"

              </button>
              <button onclick="openWAModal(${idx},'inkubasi')"

    function promoteCandidate(idx) {
        const c = candidates[idx];
        if (!c) return;
        if (!confirm(`Promosikan "${c.nama}" ke Master Karyawan?\n\nForm tambah karyawan akan terbuka otomatis.`)) return;

        openAddModal();
        setTimeout(() => {
            const setV = (id, val) => { const el = document.getElementById(id); if (el && val) el.value = val; };
            setV('f-nama', c.nama);
            setV('f-panggilan', c.panggilan || c.nama.split(' ')[0]);
            setV('f-posisi', c.posisi);
            setV('f-telp', c.wa.startsWith('0') ? c.wa : '0' + c.wa);
            const fStatus = document.getElementById('f-status');
            if (fStatus) fStatus.value = 'Probation';
            const fTgl = document.getElementById('f-tglmasuk');
            if (fTgl) fTgl.value = new Date().toISOString().slice(0, 10);
        }, 150);

        // Update status di GAS
        const rowIdx = c.rowIdx;
        if (typeof google !== 'undefined' && google.script && google.script.run && rowIdx) {
            google.script.run
                .updateCandidateRecord(rowIdx, { ...c, status: 'Dipromosikan', catatan: 'Dipromosikan ke Master Karyawan ' + new Date().toISOString().slice(0, 10) });
        }
        candidates[idx].status = 'Dipromosikan';
        candidates[idx].promotedAt = new Date().toISOString().slice(0, 10);
        localStorage.setItem('LOSHRIS_CANDIDATES', JSON.stringify(candidates));
        renderCandidates();
    }

    function promoteAllAccepted() {
        const first = candidates.findIndex(c => c.status === 'Diterima');
        if (first === -1) return showToast('Tidak ada kandidat berstatus "Diterima".', 'warning');
        promoteCandidate(first);
    }

    function archiveCandidate(idx) {
        if (!confirm('Arsipkan kandidat ini? Status akan diubah jadi "Diarsipkan".')) return;
        const c = candidates[idx];
        if (!c) return;

        const rowIdx = c.rowIdx;
        showLoader(true);

        if (typeof google !== 'undefined' && google.script && google.script.run && rowIdx) {
            google.script.run
                .withSuccessHandler(res => {
                    showLoader(false);
                    if (res.success) {
                        candidatesLoaded = false;
                        loadCandidatesFromSheet();
                    } else {
                        showToast('Gagal: ' + (res.error || ''), 'error');
                    }
                })
                .withFailureHandler(err => { showLoader(false); showToast('Error: ' + err, 'error'); })
                .updateCandidateRecord(rowIdx, { ...c, status: 'Diarsipkan' });
        } else {
            showLoader(false);
            candidates.splice(idx, 1);
            localStorage.setItem('LOSHRIS_CANDIDATES', JSON.stringify(candidates));
            renderCandidates();
        }
    }

    function reactivateCandidate(idx) {
        const c = candidates[idx];
        if (!c) return;
        showConfirm('Aktifkan Kembali', `Ubah status "${c.nama}" dari "Tidak Merespons" kembali ke "Sourcing"?`, () => {
            const rowIdx = c.rowIdx;
            candidates[idx].status = 'Sourcing';
            localStorage.setItem('LOSHRIS_CANDIDATES', JSON.stringify(candidates));
            renderCandidates();
            if (typeof google !== 'undefined' && google.script && google.script.run && rowIdx) {
                google.script.run.updateCandidateRecord(rowIdx, { ...candidates[idx] });
            }
        });
    }

    // ============================================================
    // JADWAL (SCHEDULE MANAGEMENT)
    // ============================================================
    let schedules = safeParse('LOSHRIS_SCHEDULES', []);
    let currentScheduleFilter = 'semua';

    function updateScheduleBadge() {
        const badge = document.getElementById('rec-badge-jadwal');
        if (!badge) return;
        const today = new Date().toDateString();
        const todayCount = schedules.filter(s => {
            if (!s.mulai) return false;
            return new Date(s.mulai).toDateString() === today && s.status !== 'Selesai' && s.status !== 'Dibatalkan';
        }).length;
        if (todayCount > 0) {
            badge.innerText = todayCount;
            badge.classList.remove('hidden');
        } else {
            badge.classList.add('hidden');
        }
    }

    function filterSchedules(f) {
        currentScheduleFilter = f;
        document.querySelectorAll('.sch-filter-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        const activeBtn = document.getElementById('sch-filter-' + f);
        if (activeBtn) activeBtn.classList.add('active');
        renderSchedules();
    }

    function renderSchedules() {
        const el = document.getElementById('schedule-list');
        if (!el) return;

        updateScheduleBadge();

        const q = (document.getElementById('search-schedule')?.value || '').toLowerCase();
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const todayStr = today.toDateString();

        let src = schedules.map((s, i) => ({ ...s, _idx: i }));

        if (currentScheduleFilter === 'upcoming') {
            src = src.filter(s => {
                const d = s.mulai ? new Date(s.mulai) : null;
                return d && d > new Date() && s.status !== 'Selesai' && s.status !== 'Dibatalkan';
            });
        } else if (currentScheduleFilter === 'today') {
            src = src.filter(s => {
                const d = s.mulai ? new Date(s.mulai) : null;
                return d && d.toDateString() === todayStr;
            });
        } else if (currentScheduleFilter === 'selesai') {
            src = src.filter(s => s.status === 'Selesai' || s.status === 'Dibatalkan');
        }

        if (q) {
            src = src.filter(s =>
                (s.kandidat || '').toLowerCase().includes(q) ||
                (s.posisi || '').toLowerCase().includes(q) ||
                (s.lokasi || '').toLowerCase().includes(q)
            );
        }

        // Sort by date (nearest first)
        src.sort((a, b) => {
            const da = a.mulai ? new Date(a.mulai) : new Date(0);
            const db = b.mulai ? new Date(b.mulai) : new Date(0);
            return da - db;
        });

        // Today banner
        const todayItems = schedules.filter(s => {
            if (!s.mulai) return false;
            return new Date(s.mulai).toDateString() === todayStr && s.status !== 'Selesai' && s.status !== 'Dibatalkan';
        });
        const bannerEl = document.getElementById('schedule-today-banner');
        const bannerTxt = document.getElementById('schedule-today-text');
        if (bannerEl && bannerTxt) {
            if (todayItems.length > 0) {
                bannerTxt.innerText = `⚡ Ada ${todayItems.length} jadwal hari ini: ${todayItems.map(s => `${s.kandidat} (${s.tipe})`).join(', ')}`;
                bannerEl.classList.remove('hidden');
                bannerEl.classList.add('flex');
            } else {
                bannerEl.classList.add('hidden');
                bannerEl.classList.remove('flex');
            }
        }

        if (!src.length) {
            el.innerHTML = `<div class="text-center py-14 text-gray-400">
                <span class="material-icons text-5xl block mb-2 opacity-30">event_busy</span>

            'Interview': 'bg-blue-100 text-blue-700 border-blue-200',
            'Inkubasi': 'bg-purple-100 text-purple-700 border-purple-200',
            'Orientasi': 'bg-emerald-100 text-emerald-700 border-emerald-200',
            'Lainnya': 'bg-gray-100 text-gray-600 border-gray-200'

        const statusColor = {
            'Mendatang': 'bg-orange-50 border-orange-200',
            'Hari Ini': 'bg-blue-50 border-blue-300',
            'Selesai': 'bg-gray-50 border-gray-200 opacity-70',
            'Dibatalkan': 'bg-red-50 border-red-200 opacity-60'
        };

        const mos = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agt', 'Sep', 'Okt', 'Nov', 'Des'];

        const colorPool = ['#3B82F6', '#8B5CF6', '#EC4899', '#F59E0B', '#10B981', '#EF4444'];

        el.innerHTML = src.map(s => {
            const idx = s._idx;
            const mulaiDt = s.mulai ? new Date(s.mulai) : null;
            const selesaiDt = s.selesai ? new Date(s.selesai) : null;

            let dateLabel = '-';
            let timeLabel = '';

                const isToday = mulaiDt.toDateString() === todayStr;
                const isTomorrow = mulaiDt.toDateString() === new Date(today.getTime() + 86400000).toDateString();
                const prefix = isToday ? '🔴 HARI INI · ' : isTomorrow ? '🟡 BESOK · ' : '';
                dateLabel = `${prefix}${days[mulaiDt.getDay()]}, ${mulaiDt.getDate()} ${mos[mulaiDt.getMonth()]} ${mulaiDt.getFullYear()}`;
                timeLabel = `${String(mulaiDt.getHours()).padStart(2, '0')}:${String(mulaiDt.getMinutes()).padStart(2, '0')}`;
                if (selesaiDt && !isNaN(selesaiDt)) {
                    timeLabel += ` – ${String(selesaiDt.getHours()).padStart(2, '0')}:${String(selesaiDt.getMinutes()).padStart(2, '0')}`;
                }
            }

            const tipeCls = tipeColor[s.tipe] || tipeColor['Lainnya'];
            const cardCls = statusColor[s.status] || 'bg-white border-gray-200';

            return `<div class="flex gap-4 p-4 rounded-xl border ${cardCls} hover:shadow-sm transition group">

                <div class="shrink-0 w-14 text-center">
                    ${mulaiDt && !isNaN(mulaiDt) ? `

                    <p class="text-2xl font-black text-gray-800 leading-tight">${mulaiDt.getDate()}</p>
                    <p class="text-[9px] text-gray-400 font-bold">${days[mulaiDt.getDay()].slice(0, 3).toUpperCase()}</p>
                    ` : '<p class="text-xs text-gray-300 pt-2">–</p>'}
                </div>
                <!-- Vertical Divider -->
                <div class="w-px bg-gray-200 shrink-0 mx-1"></div>
                <!-- Content -->
                <div class="flex-1 min-w-0">
                    <div class="flex items-start justify-between gap-2">
                        <div class="flex items-center gap-2 flex-wrap">
                            <div class="w-7 h-7 rounded-lg flex items-center justify-center text-white font-black text-xs shrink-0" style="background:${color}">${(s.kandidat || '?').charAt(0)}</div>

                            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-lg border text-[10px] font-bold ${tipeCls}">
                                <span class="material-icons text-[10px]">${s.tipe === 'Interview' ? 'record_voice_over' : s.tipe === 'Inkubasi' ? 'school' : 'event'}</span>${s.tipe}
                            </span>
                        </div>

                                <span class="material-icons text-[15px]">edit</span>
                            </button>
                            <a href="${gcalUrl}" target="_blank" class="p-1.5 text-emerald-600 hover:bg-emerald-50 rounded-lg" title="Buka Google Calendar">
                                <img src="https://www.gstatic.com/images/branding/product/1x/calendar_2020q4_48dp.png" class="w-4 h-4 object-contain" alt="GCal">

                </div>
            </div>`;

    function buildGCalUrl(s) {
        if (!s.mulai) return 'https://calendar.google.com/calendar/r';
        const fmt = (dt) => {
            const d = new Date(dt);
            return d.getFullYear().toString() +
                String(d.getMonth() + 1).padStart(2, '0') +
                String(d.getDate()).padStart(2, '0') + 'T' +
                String(d.getHours()).padStart(2, '0') +
                String(d.getMinutes()).padStart(2, '0') + '00';
        };
        const start = fmt(s.mulai);
        const end = s.selesai ? fmt(s.selesai) : fmt(new Date(new Date(s.mulai).getTime() + 60 * 60 * 1000));
        const title = encodeURIComponent(`[${s.tipe}] ${s.kandidat} – ${s.posisi || ''}`);
        const loc = encodeURIComponent(s.lokasi || '');
        const details = encodeURIComponent(`Kandidat: ${s.kandidat}\nPosisi: ${s.posisi || '-'}\nPIC: ${s.pic || '-'}\nWA: +62${s.wa || '-'}\nCatatan: ${s.catatan || '-'}`);
        return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${end}&location=${loc}&details=${details}`;
    }

    function openAddScheduleModal() {
        document.getElementById('sch-edit-idx').value = '-1';
        ['sch-kandidat', 'sch-posisi', 'sch-lokasi', 'sch-pic', 'sch-wa', 'sch-catatan'].forEach(id => {
            const el = document.getElementById(id); if (el) el.value = '';
        });
        document.getElementById('sch-tipe').value = 'Interview';
        document.getElementById('sch-status').value = 'Mendatang';

        // Pre-fill datetime to tomorrow 9:00
        const tmr = new Date();
        tmr.setDate(tmr.getDate() + 1);
        tmr.setHours(9, 0, 0, 0);
        const endTmr = new Date(tmr.getTime() + 60 * 60 * 1000);
        const fmtDt = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}T${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}`;
        document.getElementById('sch-mulai').value = fmtDt(tmr);
        document.getElementById('sch-selesai').value = fmtDt(endTmr);

        // Populate kandidat datalist from candidates array
        const dl = document.getElementById('sch-kandidat-list');
        if (dl) {
            dl.innerHTML = candidates.filter(c => c.nama).map(c =>
                `<option value="${c.nama}" data-posisi="${c.posisi || ''}" data-wa="${c.wa || ''}"></option>`
            ).join('');
        }

        document.getElementById('schedule-modal').classList.remove('hidden');
        document.getElementById('schedule-modal').classList.add('flex');
    }

    function saveSchedule() {
        const idx = parseInt(document.getElementById('sch-edit-idx').value);
        const kandidat = (document.getElementById('sch-kandidat')?.value || '').trim();
        if (!kandidat) return showToast('Nama kandidat wajib diisi!', 'error');

        const record = {
            kandidat,

    function saveCandidate() {
        const idx = parseInt(document.getElementById('cd-index')?.value ?? '-1');
        const c = {
            nama: (document.getElementById('cd-nama')?.value || '').trim(),
            panggilan: (document.getElementById('cd-panggilan')?.value || '').trim(),
            email: (document.getElementById('cd-email')?.value || '').trim(),
            domisili: (document.getElementById('cd-domisili')?.value || '').trim(),
            posisi: (document.getElementById('cd-posisi')?.value || '').trim(),
            wa: (document.getElementById('cd-wa')?.value || '').replace(/^0+/, '').replace(/\D/g, ''),
            status: document.getElementById('cd-status')?.value || 'Sourcing',
            tanggal: new Date().toISOString().slice(0, 10),
            catatan: idx !== -1 ? (candidates[idx]?.catatan || '') : '',
            cv: ''
        };
        if (!c.nama) return showToast('Nama kandidat wajib diisi!', 'error');
        if (!c.posisi) return showToast('Posisi wajib diisi!', 'error');
        if (!c.wa) return showToast('Nomor WA wajib diisi!', 'error');

        showLoader(true, 'Menyimpan data kandidat...');

        const submitCandidate = (finalCandidate) => {
            if (idx === -1) {
                // ── TAMBAH BARU ──────────────────────────────────────────
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler(res => {
                            showLoader(false);
                            if (res.success) {
                                candidatesLoaded = false;          // paksa reload dari GAS
                                loadCandidatesFromSheet();
                                closeCandidateModal();
                                clearCandidateCV();
                            } else {
                                showToast('Gagal menyimpan: ' + (res.error || ''), 'error');
                            }
                        })
                        .withFailureHandler(err => {
                            showLoader(false);
                            showToast('Koneksi error: ' + err, 'error');
                        })
                        .addCandidateRecord(finalCandidate);
                } else {
                    // fallback offline
                    showLoader(false);
                    finalCandidate.rowIdx = candidates.length > 0 ? Math.max(...candidates.map(x => x.rowIdx || 2)) + 1 : 2;
                    candidates.push(finalCandidate);
                    localStorage.setItem('LOSHRIS_CANDIDATES', JSON.stringify(candidates));
                    closeCandidateModal();
                    clearCandidateCV();
                    renderCandidates();
                }
            } else {
                // ── UPDATE EXISTING ──────────────────────────────────────
                const rowIdx = candidates[idx]?.rowIdx;
                if (typeof google !== 'undefined' && google.script && google.script.run && rowIdx) {
                    google.script.run
                        .withSuccessHandler(res => {
                            showLoader(false);
                            if (res.success) {
                                candidatesLoaded = false;
                                loadCandidatesFromSheet();
                                closeCandidateModal();
                                clearCandidateCV();
                            } else {
                                showToast('Gagal update: ' + (res.error || ''), 'error');
                            }
                        })
                        .withFailureHandler(err => {
                            showLoader(false);
                            showToast('Koneksi error: ' + err, 'error');
                        })
                        .updateCandidateRecord(rowIdx, finalCandidate);
                } else {
                    showLoader(false);
                    candidates[idx] = { ...candidates[idx], ...finalCandidate };
                    localStorage.setItem('LOSHRIS_CANDIDATES', JSON.stringify(candidates));
                    closeCandidateModal();
                    clearCandidateCV();
                    renderCandidates();
                }
            }
        };

        if (selectedCandidateCV) {
            if (selectedCandidateCV.existingUrl) {
                c.cv = selectedCandidateCV.existingUrl;
                submitCandidate(c);
            } else {
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    showLoader(true, 'Mengunggah file CV...');
                    google.script.run
                        .withSuccessHandler(uploadRes => {
                            if (uploadRes && uploadRes.success) {
                                c.cv = uploadRes.url;
                                submitCandidate(c);
                            } else {
                                showLoader(false);
                                showToast('Gagal mengunggah CV: ' + (uploadRes ? uploadRes.error : 'Unknown error'), 'error');
                            }
                        })
                        .withFailureHandler(err => {
                            showLoader(false);
                            showToast('Gagal mengunggah CV: ' + err, 'error');
                        })
                        .uploadCandidateCV(selectedCandidateCV.base64Data, selectedCandidateCV.filename, selectedCandidateCV.mimeType);
                } else {
                    // Offline mock
                    c.cv = selectedCandidateCV.base64Data;
                    submitCandidate(c);
                }
            }
        } else {
            submitCandidate(c);
        }
    }

    function loadWATemplates() {
        const tplList = safeParse('LOSHRIS_WA_LOCATIONS', []);

        const renderList = (list) => {
            const dl = document.getElementById('wa-branch-list');
            if (dl) {
                dl.innerHTML = list.map(v => `<option value="${String(v.branch).replace(/"/g, '&quot;')}"></option>`).join('');
            }
        };
        renderList(tplList);

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run.withSuccessHandler(res => {
                if (res && res.success && res.data && res.data.length > 0) {
                    let merged = safeParse('LOSHRIS_WA_LOCATIONS', []);
                    res.data.forEach(srv => {
                        const idx = merged.findIndex(m => m.branch === srv.branch);
                        if (idx >= 0) {
                            merged[idx].maps = srv.maps || merged[idx].maps;
                            merged[idx].outfit = srv.outfit || merged[idx].outfit;
                        } else {
                            merged.push(srv);
                        }
                    });
                    localStorage.setItem('LOSHRIS_WA_LOCATIONS', JSON.stringify(merged));
                    renderList(merged);
                }
            }).getWATemplatesFromSheet();
        }

        const branchInput = document.getElementById('wa-branch');
        if (branchInput && !branchInput.hasAttribute('data-listener')) {
            branchInput.setAttribute('data-listener', 'true');
            branchInput.addEventListener('input', function () {
                const selectedBranch = this.value;
                const currentList = safeParse('LOSHRIS_WA_LOCATIONS', []);
                const found = currentList.find(t => t.branch === selectedBranch);
                if (found) {
                    document.getElementById('wa-outfit').value = found.outfit || '';
                    document.getElementById('wa-maps').value = found.maps || '';
                }
            });
        }
    }

    function saveWATemplate(branch, outfit, maps) {
        if (!branch || branch === '-') return;
        const tplList = safeParse('LOSHRIS_WA_LOCATIONS', []);
        const existingIdx = tplList.findIndex(t => t.branch === branch);

        if (existingIdx >= 0) {
            tplList[existingIdx].outfit = outfit;
            tplList[existingIdx].maps = maps;
        } else {
            tplList.push({ branch, outfit, maps });
        }
        localStorage.setItem('LOSHRIS_WA_LOCATIONS', JSON.stringify(tplList));
    }

    function getWAGreeting() {

    function confirmSendWA() {
        const idx = document.getElementById('wa-candidate-idx')?.value;
        const type = document.getElementById('wa-type')?.value;
        const c = candidates[idx];
        if (!c) return;

        const rawDate = document.getElementById('wa-date')?.value;
        let hariTanggalStr = '-';
        let pukulStr = '-';
        if (rawDate) {
            const dt = new Date(rawDate);
            const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const mos = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            hariTanggalStr = `${days[dt.getDay()]}, ${dt.getDate()} ${mos[dt.getMonth()]} ${dt.getFullYear()}`;
            pukulStr = `${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}`;
        }

        const branch = document.getElementById('wa-branch')?.value || '-';
        const outfit = document.getElementById('wa-outfit')?.value || '-';
        const maps = document.getElementById('wa-maps')?.value || '-';
        const leader = document.getElementById('wa-leader')?.value || '';
        const leaderWa = document.getElementById('wa-leader-wa')?.value || '';
        const leaderTag = document.getElementById('wa-leader-tag')?.value || '';
        const jarak = document.getElementById('wa-jarak')?.value || '-';
        const cv = document.getElementById('wa-cv')?.value || '-';
        const makan = document.getElementById('wa-makan')?.checked;

        saveWATemplate(branch, outfit, maps);

        const sapaan = getWAGreeting();

        // Format nomor WA kandidat: 62xxxxxxxxx → +62 xxx-xxxx-xxxx (approx)
        const fmtWa = (wa) => {
            const num = String(wa || '').replace(/\D/g, '');
            if (!num) return '';
            // misal 6287838860568 → +62 878-3886-0568
            if (num.startsWith('62') && num.length >= 10) {
                const local = num.slice(2); // 87838860568
                return `+62 ${local.slice(0, 3)}-${local.slice(3, 7)}-${local.slice(7)}`;
            }
            return '+' + num;
        };

        // Susun baris leader
        const leaderLine = leader
            ? `Leader: ${leader}${leaderWa ? ` (${fmtWa(leaderWa.replace(/\D/g, '').replace(/^0/, '62'))})` : ''}${leaderTag ? ` ${leaderTag}` : ''}`
            : '';

        // Susun baris jadwal inkubasi dari list row
        let jadwalLines = '-';
        if (type === 'inkubasi') {
            const list = document.getElementById('wa-inkubasi-jadwal-list');
            if (list) {
                const rows = Array.from(list.querySelectorAll('.inkubasi-row'));
                const daysName = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
                const mosName = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
                const linesArr = [];

                rows.forEach(r => {
                    const dVal = r.querySelector('.inkubasi-date').value;
                    const shiftVal = r.querySelector('.inkubasi-shift').value;
                    if (dVal) {
                        const dt = new Date(dVal);
                        const dayOfWeek = dt.getDay();
                        let timeStr = "08:00-13:00";
                        if (shiftVal === 'closing') {
                            if (dayOfWeek >= 1 && dayOfWeek <= 3) timeStr = "17:00-22:00";
                            else timeStr = "18:00-23:00";
                        }
                        const dateStr = `${daysName[dayOfWeek]}, ${dt.getDate()} ${mosName[dt.getMonth()]} ${dt.getFullYear()}`;
                        linesArr.push(`${dateStr} (${timeStr})`);
                    }
                });
                if (linesArr.length > 0) jadwalLines = linesArr.join('\n');
            }
        } else {
            jadwalLines = hariTanggalStr !== '-' ? `${hariTanggalStr} (${pukulStr})` : '-';
        }

        let msg;
        if (type === 'interview') {
            msg = `Selamat ${sapaan} kak ${c.nama}, terimakasih atas pengajuan lamaran untuk posisi ${c.posisi}, perkenalkan saya Radip HR LOSCIKEN.\nKami mengundang kak ${c.panggilan || c.nama} untuk interview:\nHari/Tanggal: ${hariTanggalStr}\nPukul: ${pukulStr}\nTempat: ${branch}\nMaps: ${maps}\n\nMohon konfirmasi kehadiran dan membawa CV. Terima kasih!`;
        } else {
            // Format inkubasi baru
            const candidateWaLine = c.wa ? ` (+62 ${String(c.wa).replace(/^0/, '').replace(/(\d{3})(\d{4})(\d+)/, '$1-$2-$3')})` : '';
            const lines = [
                `Inkubasi ${c.posisi}:`,
                `Nama: ${c.nama}${candidateWaLine}`,
                cv !== '-' ? `CV : ${cv}` : null,
                `Jarak Rumah Ke Outlet : ${jarak}`,
                `Jadwal: ${jadwalLines}`,
                `Pakaian: ${outfit}`,
                `Cabang: ${branch}`,
                `Maps: ${maps}`,
                makan ? 'Dapat Jatah makan karyawan' : null,
                leaderLine || null,
            ].filter(l => l !== null);
            msg = lines.join('\n');
        }

        window.open(`https://wa.me/62${c.wa}?text=${encodeURIComponent(msg)}`, '_blank');
        closeWAModal();
    }

    function syncUniformModule() {
        showLoader(true, 'Sinkronisasi Data Seragam & Vendor...');

            doneCount++;
            if (doneCount >= 2) showLoader(false);
        };

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(data => {
                    uniformData = data;
                    localStorage.setItem('LOSHRIS_UNIFORM', JSON.stringify(uniformData));
                    renderUniform();
                    checkDone();
                })
                .withFailureHandler(err => { checkDone(); })
                .getUniformData();

            google.script.run
                .withSuccessHandler(data => {
                    vendorData = data;
                    localStorage.setItem('LOSHRIS_VENDORS', JSON.stringify(vendorData));
                    renderVendorList();
                    checkDone();

                .withFailureHandler(err => { checkDone(); })

            showLoader(false);
            renderUniform();
            renderVendorList();
        }

    function renderUniform() {
        const tbody = document.getElementById('uniform-table-body');
        if (!tbody) return;
        tbody.innerHTML = uniformData.length

    function openPaySlip() {
        const emp = currentDrawerIndex >= 0 ? globalEmployees[currentDrawerIndex] : null;
        if (!emp) return showToast('Buka profil karyawan terlebih dahulu.', 'warning');

        const nik = emp['NIK'];
        const state = payrollDataState[nik];
        const r = getRules(emp['Penempatan'] || 'Global');
        const fmt = n => new Intl.NumberFormat('id-ID').format(Math.round(n || 0));
        const d = (val, str) => (val > 0) ? str : '–';
        const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val ?? '–'; };

        // Period
        const bulan = document.getElementById('ps-bulan-sel')?.value ||
            new Date().toLocaleString('id-ID', { month: 'long' });
        const tahun = document.getElementById('ps-tahun-inp')?.value || new Date().getFullYear();
        set('ps-periode', bulan + ' ' + tahun);

        // Employee info
        set('ps-nama', emp['Nama Lengkap']);
        set('ps-penerima', emp['Nama Lengkap']);
        set('ps-nik', nik);
        set('ps-telp', emp['Telepon']);
        set('ps-email', emp['Email']);
        set('ps-alamat', emp['Domisili']);
        set('ps-darurat-nama', emp['Darurat Nama']);
        set('ps-darurat-hub', emp['Darurat Hubungan']);
        set('ps-darurat-telp', emp['Darurat Telp']);
        set('ps-jabatan', emp['Posisi']);
        set('ps-divisi', emp['Penempatan']);
        set('ps-status', emp['Status']);
        set('ps-bank', emp['Bank']);
        set('ps-rekening', emp['Rekening']);
        set('ps-nama-rek', emp['Atas Nama'] || emp['Nama Lengkap']);

        // Restore TTD
        const tO = localStorage.getItem('LOSHRIS_TTD_OWNER') || localStorage.getItem('LOSHRIS_TTD');
        const tH = localStorage.getItem('LOSHRIS_TTD_HR');
        const elO = document.getElementById('slip-ttd-container');
        const elH = document.getElementById('slip-ttd-hr');
        if (tO && elO) elO.innerHTML = `<img src="${tO}" style="height:52px;object-fit:contain">`;
        if (tH && elH) elH.innerHTML = `<img src="${tH}" style="height:52px;object-fit:contain">`;

        if (!state) {
            // Belum ada data payroll — tampilkan slip kosong
            ['ps-gp', 'ps-bu-earn', 'ps-ls-earn', 'ps-lembur-earn', 'ps-tj',
                'ps-bonus-bu', 'ps-bonus-ls', 'ps-bonus-hol', 'ps-omzet-kpi',
                'ps-total-earn', 'ps-pot-alpha', 'ps-pot-telat', 'ps-pot-sakit',
                'ps-pot-bpjs', 'ps-p1', 'ps-p2']
                .forEach(id => set(id, '–'));
            set('ps-total-deduct', 'Rp0');
            set('ps-thp', 'Rp – (hitung di Payroll Engine dulu)');
            set('ps-total-pay', 'Rp –');
            document.getElementById('payslip-modal').classList.remove('hidden');
            return;
        }

        // Hitung komponen
        const G = state.gp / (r.hari || 26);
        const upahBU = (state.bu || 0) * G;
        const upahLS = (state.ls || 0) * G;
        const upahLmbr = ((state.lembur || 0) / (r.jam || 8)) * G;
        const bonusBU = (state.bu || 0) * (r.shift || 50000);
        const bonusLS = (state.ls || 0) * (r.shift || 50000);
        const bonusHol = (state.hol || 0) * (r.holiday || 50000);
        const potAlpha = (state.th || 0) * G;
        const potTelat = (state.telat || 0) * (r.telat || 1000);
        const potSakit = (state.s || 0) * G * ((r.sakit || 30) / 100);
        const totalKPI = Object.values(state.kpiVals || {}).reduce((a, b) => a + b, 0);
        const omzetKPI = (state.omzet || 0) + totalKPI;

        // Kehadiran
        set('ps-att-hk', r.hari || 26);
        set('ps-att-hadir', state.h || 0);
        set('ps-att-th', state.th || 0);
        set('ps-att-s', state.s || 0);
        set('ps-att-bu', state.bu || 0);
        set('ps-att-ls', state.ls || 0);
        set('ps-att-lembur', state.lembur || 0);
        set('ps-att-telat', state.telat || 0);
        set('ps-att-cuti', 0);

        // Pendapatan
        set('ps-gp', fmt(state.gp));
        set('ps-bu-earn', d(upahBU, fmt(upahBU)));
        set('ps-ls-earn', d(upahLS, fmt(upahLS)));
        set('ps-lembur-earn', d(upahLmbr, fmt(upahLmbr)));
        set('ps-tj', d(state.tj || 0, fmt(state.tj)));
        set('ps-bonus-bu', d(bonusBU, fmt(bonusBU)));
        set('ps-bonus-ls', d(bonusLS, fmt(bonusLS)));
        set('ps-bonus-hol', d(bonusHol, fmt(bonusHol)));
        set('ps-omzet-kpi', d(omzetKPI, fmt(omzetKPI)));
        set('ps-total-earn', fmt(state.tgl1 + state.tgl2));
        const hn = document.getElementById('ps-hol-note');
        if (hn) hn.textContent = state.hol > 0 ? state.hol + ' hari libur nasional' : '';

        // Pengurangan
        set('ps-pot-alpha', d(potAlpha, fmt(potAlpha)));
        set('ps-pot-telat', d(potTelat, fmt(potTelat)));
        const tn = document.getElementById('ps-pot-telat-note');
        if (tn) tn.textContent = 'Terlambat ' + (state.telat || 0) + ' menit';
        set('ps-pot-sakit', d(potSakit, fmt(potSakit)));
        set('ps-pot-bpjs', d(state.bpjs || 0, fmt(state.bpjs)));
        const totalDeduct = potAlpha + potTelat + potSakit + (state.bpjs || 0);
        set('ps-total-deduct', 'Rp' + fmt(totalDeduct));

        // THP & Payment
        set('ps-thp', 'Rp' + fmt(state.thp));
        set('ps-p1', fmt(state.tgl1));
        set('ps-p2', fmt(state.tgl2));
        set('ps-total-pay', 'Rp' + fmt(state.tgl1 + state.tgl2));

        document.getElementById('payslip-modal').classList.remove('hidden');
    }

    function openEditAccountForm(username, nama, role, foto) {
        const modal = document.getElementById('edit-account-modal');
        if (!modal) return showToast('Modal edit tidak ditemukan.', 'warning');

        document.getElementById('edit-acc-username-display').innerText = '@' + username;
        document.getElementById('edit-acc-username-hidden').value = username;
        document.getElementById('edit-acc-nama').value = nama;
        document.getElementById('edit-acc-pass').value = '';

        // Reset password visibility
        const eye = document.getElementById('pass-eye-icon');
        if (eye) eye.innerText = 'visibility_off';
        const passEl = document.getElementById('edit-acc-pass');
        if (passEl) passEl.type = 'password';

        // Restore foto tersimpan ke preview
        const prev = document.getElementById('edit-acc-photo-preview');
        if (prev) {
            if (foto) {
                prev.innerHTML = '<img src="' + foto + '" class="w-full h-full object-cover">';
            } else {
                prev.innerHTML = '<span class="material-icons text-[28px]">person</span>';

        if (roleEl) roleEl.value = role;

        modal.classList.remove('hidden');

    function closeEditAccountModal() {
        document.getElementById('edit-account-modal')?.classList.add('hidden');

    function saveEditAccount() {
        const username = document.getElementById('edit-acc-username-hidden')?.value?.trim();
        const nama = document.getElementById('edit-acc-nama')?.value?.trim();
        const pass = document.getElementById('edit-acc-pass')?.value?.trim();
        const role = document.getElementById('edit-acc-role')?.value;

        // Ambil foto dari preview (img src)
        const previewImg = document.getElementById('edit-acc-photo-preview')?.querySelector('img');
        const foto = previewImg ? previewImg.src : '';

        if (!username) return showToast('Username tidak valid.', 'error');
        if (!nama) return showToast('Nama tidak boleh kosong.', 'warning');
        if (!pass) return showToast('Password wajib diisi ulang saat edit akun.', 'error');

        if (!confirm(`Simpan perubahan untuk akun @${username}?`)) return;

        showLoader(true);

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            // Hapus dulu → lalu tambah ulang dengan data terbaru
            google.script.run
                .withSuccessHandler(() => {
                    google.script.run
                        .withSuccessHandler(() => {
                            showLoader(false);
                            closeEditAccountModal();
                            refreshAccountList();
                            showToast('✅ Akun @' + username + ' berhasil diperbarui!', 'success');
                        })
                        .withFailureHandler(err => {
                            showLoader(false);
                            showToast('❌ Gagal menyimpan akun baru: ' + err, 'error');
                        })
                        .addUserAccess({ user: username, pass, nama, role, foto });
                })
                .withFailureHandler(err => {
                    showLoader(false);
                    showToast('❌ Gagal menghapus akun lama: ' + err, 'error');
                })
                .deleteUserAccess(username);
        } else {
            showLoader(false);
            showToast('Google Script tidak tersedia.', 'warning');
        }
    }

    function confirmDeleteAccount(username) {
        if (!confirm(`Hapus akun @${username}?\n\nAksi ini tidak bisa dibatalkan.`)) return;
        showLoader(true);
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(() => {
                    showLoader(false);
                    refreshAccountList();
                    showToast('✅ Akun @' + username + ' berhasil dihapus.', 'success');
                })
                .withFailureHandler(err => {
                    showLoader(false);
                    showToast('❌ Gagal hapus: ' + err, 'error');
                })
                .deleteUserAccess(username);
        } else {
            showLoader(false);
        }
    }

    function addUserAccount() {
        const user = document.getElementById('acc-user')?.value?.trim();
        const pass = document.getElementById('acc-pass')?.value?.trim();
        const nama = document.getElementById('acc-nama')?.value?.trim();
        const role = document.getElementById('acc-role')?.value;
        if (!user || !pass) return showToast('Username dan Password wajib!', 'error');
        showLoader(true);
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(() => {
                    showLoader(false);
                    // Reset form setelah berhasil
                    ['acc-user', 'acc-pass', 'acc-nama'].forEach(id => {
                        const el = document.getElementById(id);
                        if (el) el.value = '';

                    refreshAccountList();

                })
                .withFailureHandler(err => {
                    showLoader(false);
                    showToast('❌ Gagal: ' + err, 'error');
                })
                .addUserAccess({ user, pass, nama, role });
        }
    }

    function handleAvatarUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            localStorage.setItem('LOSHRIS_AVATAR', e.target.result);
            const m = document.getElementById('user-avatar-main');
            if (m) m.innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover rounded-xl">`;
            // Update juga preview di dalam modal akun
            const prev = document.getElementById('acc-photo-preview');
            if (prev) prev.innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover rounded-2xl">`;
        };
        reader.readAsDataURL(file);
    }
    function handleEditAvatarUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) return showToast('Hanya file gambar yang diizinkan.', 'warning');

        const reader = new FileReader();
        reader.onload = e => {
            const dataUrl = e.target.result;

            // Simpan ke localStorage
            localStorage.setItem('LOSHRIS_AVATAR', dataUrl);

            // Update preview di modal edit
            const prev = document.getElementById('edit-acc-photo-preview');
            if (prev) prev.innerHTML = `<img src="${dataUrl}" class="w-full h-full object-cover">`;

            // Update avatar header topbar langsung
            const main = document.getElementById('user-avatar-main');
            if (main) main.innerHTML = `<img src="${dataUrl}" class="w-full h-full object-cover rounded-xl">`;

            // Update preview di modal akun utama kalau terbuka
            const accPrev = document.getElementById('acc-photo-preview');
            if (accPrev) accPrev.innerHTML = `<img src="${dataUrl}" class="w-full h-full object-cover rounded-2xl">`;
        };
        reader.readAsDataURL(file);
    }

    function runPayrollAnalysis() {
        const loading = document.getElementById('analysis-loading');
        const result = document.getElementById('analysis-result');
        loading.classList.remove('hidden');
        result.classList.add('hidden');

        google.script.run
            .withSuccessHandler(res => {
                loading.classList.add('hidden');
                result.classList.remove('hidden');
                if (!res.success) {
                    document.getElementById('analysis-summary-data').innerHTML = '';
                    document.getElementById('analysis-text').innerHTML = `<span class="text-red-500">${res.error}</span>`;
                    return;
                }

                let summaryHtml = '';
                let tableHtml = '';
                const labels = [];
                const dataTotal = [];

                res.data.months.forEach((m, index) => {
                    labels.push(m.month);
                    dataTotal.push(m.total);

                    summaryHtml += `
                        <div class="flex-1 bg-white p-4 rounded-xl shadow-sm border border-gray-100 min-w-[150px] cursor-pointer hover:bg-blue-50 transition" onclick="openMonthDetailModal(${index})">
                            <p class="text-xs text-gray-500 font-bold mb-1">${m.month}</p>
                            <p class="text-lg font-black text-gray-800">Rp ${Number(m.total).toLocaleString('id-ID')}</p>
                        </div>
                    `;

                    window.payrollAnalysisData = res.data.months; // Store globally for modal access

                    tableHtml += `
                        <tr class="cursor-pointer hover:bg-blue-50 transition" onclick="openMonthDetailModal(${index})">
                            <td class="px-4 py-2 font-medium text-gray-800">${m.month}</td>
                            <td class="px-4 py-2 text-right">Rp ${Number(m.total).toLocaleString('id-ID')}</td>
                            <td class="px-4 py-2 text-center text-red-500 font-bold">${m.alpha || 0}</td>
                            <td class="px-4 py-2 text-center text-amber-500 font-bold">${m.telat || 0}</td>
                            <td class="px-4 py-2 text-right text-emerald-600 font-bold">Rp ${Number(m.bonus || 0).toLocaleString('id-ID')}</td>
                        </tr>
                    `;
                });

                summaryHtml += `
                    <div class="flex-1 bg-blue-50 p-4 rounded-xl shadow-sm border border-blue-100 min-w-[150px]">
                        <p class="text-xs text-blue-500 font-bold mb-1">Perubahan (Bulan Terakhir vs Pertama)</p>
                        <p class="text-lg font-black ${res.data.trend > 0 ? 'text-red-600' : 'text-emerald-600'}">
                            ${res.data.trend > 0 ? '+' : ''}${Number(res.data.trend).toLocaleString('id-ID')}
                        </p>
                    </div>
                `;

                document.getElementById('analysis-summary-data').innerHTML = summaryHtml;
                document.getElementById('analysis-table-body').innerHTML = tableHtml;
                document.getElementById('analysis-text').innerHTML = res.data.analysis;

                // Render Chart
                if (window.payrollAnalysisChartInstance) {
                    window.payrollAnalysisChartInstance.destroy();
                }
                const ctx = document.getElementById('payrollTrendChart');
                if (ctx) {
                    window.payrollAnalysisChartInstance = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Total Payroll',
                                data: dataTotal,
                                borderColor: '#3B82F6',
                                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                borderWidth: 3,
                                pointBackgroundColor: '#3B82F6',
                                pointBorderColor: '#ffffff',
                                pointBorderWidth: 2,
                                pointRadius: 5,
                                fill: true,
                                tension: 0.3
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false }
                            },
                            scales: {
                                y: {
                                    beginAtZero: false,
                                    grid: { borderDash: [4, 4], color: '#f3f4f6' },
                                    ticks: {
                                        callback: function (value) {
                                            return 'Rp ' + (value / 1000000) + ' Jt';
                                        },
                                        font: { size: 10 }
                                    }
                                },
                                x: {
                                    grid: { display: false },
                                    ticks: { font: { size: 10 } }
                                }
                            }
                        }
                    });
                }
            })
            .withFailureHandler(err => {
                loading.classList.add('hidden');
                result.classList.remove('hidden');
                document.getElementById('analysis-text').innerHTML = `<span class="text-red-500">Error: ${err.message || err}</span>`;
            })
            .analyzePayroll3Months();
    }

    function handleLunaSubmit(event) {
        event.preventDefault();
        const input = document.getElementById('luna-input');
        const btn = document.getElementById('luna-send-btn');
        if (!input) return;

        const text = input.value.trim();
        if (!text) return;

        input.value = '';
        input.disabled = true;
        if (btn) btn.disabled = true;

        const msgs = document.getElementById('luna-chat-area');
        const typing = document.getElementById('luna-typing');

        // Append User Message
        const userHtml = `
            <div class="flex gap-2 justify-end">
                <div class="bg-blue-600 text-white px-3 py-2.5 rounded-2xl rounded-tr-sm shadow-sm text-sm w-fit max-w-[85%] leading-relaxed">
                    ${text.replace(/</g, '&lt;').replace(/>/g, '&gt;')}
                </div>
            </div>
        `;
        const tempUser = document.createElement('div');
        tempUser.innerHTML = userHtml.trim();
        msgs.appendChild(tempUser.firstChild);

        // Show Typing indicator
        if (typing) {
            msgs.appendChild(typing); // Move to bottom
            typing.classList.remove('hidden');
        }
        msgs.scrollTop = msgs.scrollHeight;

        // Panggil fungsi server-side Groq AI
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(replyText => {
                    renderLunaResponse(replyText, msgs, typing, input, btn);
                })
                .withFailureHandler(err => {
                    renderLunaResponse("Maaf, koneksi ke server AI terputus. Silakan coba lagi.", msgs, typing, input, btn);
                })
                .callGroqAI(text);
        } else {
            // Fallback jika tidak jalan di lingkungan GAS
            setTimeout(() => {
                renderLunaResponse("Mode pengembangan lokal: AI tidak tersedia.", msgs, typing, input, btn);
            }, 1000);
        }
    }

    function renderLunaResponse(text, msgs, typing, input, btn) {
        if (typing) typing.classList.add('hidden');
        input.disabled = false;
        if (btn) btn.disabled = false;
        input.focus();

        const aiHtml = `
            <div class="flex gap-2">
                <img src="https://drive.google.com/thumbnail?id=1Bvb9_JLzzfEGZHciiGdQ8rhaRTWjdK6o&sz=w500" class="w-6 h-6 rounded-full object-cover shrink-0 mt-1 shadow-sm">

                </div>
            </div>
        `;
        const tempAi = document.createElement('div');
        tempAi.innerHTML = aiHtml.trim();
        msgs.appendChild(tempAi.firstChild);
        msgs.scrollTop = msgs.scrollHeight;
    }
