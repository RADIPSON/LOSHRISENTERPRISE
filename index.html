<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LOSHRIS Enterprise</title>

    <meta name="theme-color" content="#0b0b0c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="icon.png">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Mencegah scroll ganda */
            background-color: #0b0b0c;
            /* Samakan dengan tema gelap LOSHRIS */
        }

        iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            /* Dynamic viewport height untuk akurasi browser mobile */
            border: none;
            display: block;
            background-color: #0b0b0c;
            /* Perhitungkan safe-area (notch, home indicator di iOS/Android modern) */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <iframe
        src="https://script.google.com/macros/s/AKfycbwIPGptdKJlh1ZuD9mTztzK0pup7utTgOtKEqbaBgPulgx0KEFSV_ozPtsncK-T4Zqu/exec"
        title="LOSHRIS Enterprise App" allow="fullscreen; clipboard-read; clipboard-write" allowfullscreen>
    </iframe>

</body>

</html>
