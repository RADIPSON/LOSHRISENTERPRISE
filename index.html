    function archivePayrollToCloud(monthName) {
        showLoader(true, 'Menyimpan & mengarsipkan ke Cloud...');

        const data2D = [];
        let totalAll = 0;

        aktifList.forEach((emp, index) => {
            const nik = emp['NIK'];
            if (!payrollDataState[nik]) {
                initPayrollStateV4(emp);
                recalcRowV4(nik);
            }

            const state = payrollDataState[nik];

            const row = [
                index + 1,
                nik,
                emp['Nama Lengkap'] || '-',
                emp['Penempatan'] || '-',
                emp['Posisi'] || '-',
                state.gp || 0,
                state.hari || 0,
                state.hariNom || 0,
                state.telat || 0,
                state.telatNom || 0,
                state.lembur || 0,
                state.lemburNom || 0,
                state.tj || 0,
                state.bpjsKes || 0,
                state.bpjsKet || 0,
                state.kasbon || 0,
                state.potLain || 0,
                state.omzet || 0,
                (state.kpiKeb || 0) + (state.kpiKomp || 0) + (state.kpiHad || 0),
                state.holidayNom || 0,
                state.lainAdd || 0,
                state.totalGaji || 0
            ];

            totalAll += (state.totalGaji || 0);
            data2D.push(row);
        });

        // Add total row at the end
        const totalRow = new Array(22).fill('');
        totalRow[2] = 'TOTAL KESELURUHAN';
        totalRow[21] = totalAll;
        data2D.push(totalRow);

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler((res) => {
                    showLoader(false);
                    if (res && res.success) {
                        showConfirm('Arsip Berhasil', 'Data payroll (' + monthName + ') berhasil disimpan ke Google Sheets (Tab: ' + res.sheetName + ').\nApakah Anda ingin membuka laporannya sekarang?', () => {
                            window.open(res.url, '_blank');
                        });
                    } else {
                        showToast('Gagal mengarsipkan: ' + (res ? res.error : 'Unknown Error'), 'error');
                    }
                })
                .withFailureHandler((err) => {
                    showLoader(false);
                    showToast('Gagal memanggil fungsi server: ' + err, 'error');
                })
                .exportPayrollToSheet(monthName, data2D);
        } else {
            showLoader(false);
            showToast('Environment Google Apps Script tidak terdeteksi.', 'warning');
        }
    }

    function applyMassBonus() {
        const branch = document.getElementById('bonus-branch-sel')?.value || 'ALL';
        const omset = parseFloat(document.getElementById('bonus-omset-val')?.value) || 0;

        // Kumpulkan KPI yang dicentang
        const kpiChecks = document.querySelectorAll('.kpi-mass-check:checked');
        const checkedKpiIds = [...kpiChecks].map(el => el.dataset.id);

        let count = 0;
        aktifList.forEach(emp => {
            const empBranch = emp['Penempatan'] || 'Global';
            if (branch !== 'ALL' && empBranch !== branch) return;

            const nik = emp['NIK'];
            if (!payrollDataState[nik]) initPayrollStateV4(emp);
            const state = payrollDataState[nik];
            if (!state) return;

            // ── Update state ──────────────────────────────────────────
            state.omzet = omset;
            const empHolChecks = document.querySelectorAll(`.mass-holiday-check[data-nik="${nik}"]:checked`);
            state.holidayNom = empHolChecks.length * (getRules(empBranch).holiday || 50000);

            // Update KPI Kebersihan & Komplain dari rules jika dicentang
            const r = getRules(empBranch);
            if (r.kpis) {
                r.kpis.forEach(kpi => {
                    if (checkedKpiIds.includes(kpi.id)) {
                        if (kpi.name.toLowerCase().includes('keb')) {
                            state.kpiKeb = kpi.max || 0;
                        } else if (kpi.name.toLowerCase().includes('komp')) {
                            state.kpiKomp = kpi.max || 0;
                        }
                    }
                });
            }

            // ── Update DOM input fields ───────────────────────────────
            const setInp = (key, val) => {
                const el = document.getElementById(`inp_v4_${nik}_${key}`);
                if (el) el.value = val;
            };
            setInp('omzet', state.omzet);
            setInp('holidayNom', state.holidayNom);
            setInp('kpiKeb', state.kpiKeb);
            setInp('kpiKomp', state.kpiKomp);

            // ── Recalc baris ─────────────────────────────────────────
            recalcRowV4(nik);
            count++;
        });

        document.getElementById('mass-bonus-modal')?.classList.add('hidden');

        // Toast notifikasi
        showSyncBadge('Menerapkan ke ' + count + ' karyawan...');
        setTimeout(() => hideSyncBadge('✅ Bonus massal diterapkan ke ' + count + ' karyawan!'), 300);
    }

        if (avatar) { avatar.style.background = c; avatar.innerText = (emp['Nama Lengkap'] || '?').charAt(0); }

        document.getElementById('calc-selected-emp')?.classList.remove('hidden');

        // Ambil gaji dari payrollDataState atau rules
        const r = getRules(emp['Penempatan']);
        const status = (emp['Status'] || '').toLowerCase();
        let gp = 2000000;
        if (payrollDataState[nik]) {
            gp = payrollDataState[nik].gp || gp;
        } else if (r.salaries) {
            const stKey = status.includes('kontrak ii') || status.includes('kontrak 2') ? 'kontrak 2'
                : status.includes('kontrak i') || status.includes('kontrak 1') ? 'kontrak 1'
                    : 'probation';
            const match = r.salaries.find(s =>
                (s.posisi === 'Semua Posisi' || s.posisi.toLowerCase() === (emp['Posisi'] || '').toLowerCase()) &&
                s.status.toLowerCase() === stKey
            );
            if (match) gp = match.gp;
        }

        // Isi info display
        const fmt = n => 'Rp ' + new Intl.NumberFormat('id-ID').format(n);
        document.getElementById('calc-nama-display').innerText = emp['Nama Lengkap'];
        document.getElementById('calc-gp-display').innerText = fmt(gp);
        document.getElementById('calc-branch-display').innerText = emp['Penempatan'] || '-';
        document.getElementById('calc-status-display').innerText = emp['Status'] || '-';

        // Simpan gp ke hidden state untuk runCalc
        window._calcCurrentGP = gp;
        window._calcCurrentEmp = emp;

        // Reset hasil sebelumnya
        document.getElementById('calc-result')?.classList.add('hidden');
    }

    function runCalc() {
        const gp = window._calcCurrentGP || 2000000;
        const r = window._calcCurrentEmp
            ? getRules(window._calcCurrentEmp['Penempatan'])
            : PRules["Global"];

        const hari = parseFloat(document.getElementById('calc-hari')?.value) || 26;
        const telat = parseFloat(document.getElementById('calc-telat')?.value) || 0;
        const alpha = parseFloat(document.getElementById('calc-alpha')?.value) || 0;
        const lembur = parseFloat(document.getElementById('calc-lembur')?.value) || 0;
        const bu = parseFloat(document.getElementById('calc-bu')?.value) || 0;
        const ls = parseFloat(document.getElementById('calc-ls')?.value) || 0;

        const G = gp / (r.hari || 26);
        const potAlpha = alpha * G;
        const potTelat = telat * (r.telat || 1000);
        const upahBU = bu * G;
        const upahLS = ls * G;
        const upahLmbr = (lembur / (r.jam || 8)) * G;
        const bonusBU = bu * (r.shift || 50000);
        const bonusLS = ls * (r.shift || 50000);
        const totalPot = potAlpha + potTelat;
        const totalBonus = upahBU + upahLS + upahLmbr + bonusBU + bonusLS;
        const thp = gp + totalBonus - totalPot;

        const fmt = n => 'Rp ' + new Intl.NumberFormat('id-ID').format(Math.round(n));
        const row = (label, val, cls = 'text-gray-800') =>
            `<div class="flex justify-between py-1.5 border-b border-gray-100 last:border-0">
      <span class="text-gray-500 text-xs">${label}</span>
      <span class="font-bold text-xs ${cls}">${val}</span>
    </div>`;

        const res = document.getElementById('calc-result');
        if (res) {
            res.innerHTML = `
      <p class="text-[10px] font-black text-gray-400 uppercase tracking-wider mb-2">Rincian Hitung</p>
      ${row('Gaji Pokok', fmt(gp))}
      ${upahBU > 0 ? row('Upah BU (' + bu + 'x)', '+' + fmt(upahBU), 'text-emerald-600') : ''}
      ${upahLS > 0 ? row('Upah LS (' + ls + 'x)', '+' + fmt(upahLS), 'text-emerald-600') : ''}
      ${upahLmbr > 0 ? row('Upah Lembur (' + lembur + 'j)', '+' + fmt(upahLmbr), 'text-emerald-600') : ''}
      ${bonusBU > 0 ? row('Bonus BU', '+' + fmt(bonusBU), 'text-emerald-600') : ''}
      ${bonusLS > 0 ? row('Bonus LS', '+' + fmt(bonusLS), 'text-emerald-600') : ''}
      ${potAlpha > 0 ? row('Potongan Alpha (' + alpha + 'x)', '-' + fmt(potAlpha), 'text-red-500') : ''}
      ${potTelat > 0 ? row('Potongan Telat (' + telat + 'mnt)', '-' + fmt(potTelat), 'text-red-500') : ''}
      <div class="flex justify-between pt-2 mt-1">
        <span class="font-black text-sm text-gray-700">= Take Home Pay</span>
        <span class="font-black text-base text-indigo-600">${fmt(thp)}</span>
      </div>`;
            res.classList.remove('hidden');
        }
    }

    function handleUploadAbsen(event) {
        const file = event.target.files[0];
        if (!file) return;
        showLoader(true);
        const reader = new FileReader();
        reader.onload = function (e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                let importedRows = [];

                workbook.SheetNames.forEach(sheetName => {
                    const json = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
                    json.forEach(row => {
                        const rNik = (row['NIK'] || row['nik'] || '').toString().trim();
                        const rNama = (row['Nama'] || row['NAMA'] || row['Nama Lengkap'] || '').toString().trim();
                        const rPang = (row['Panggilan'] || row['Nama Panggilan'] || '').toString().trim();
                        if (!rNik && !rNama && !rPang) return;

                        const emp = aktifList.find(e =>
                            (rNik && (e['NIK'] || '').toLowerCase() === rNik.toLowerCase()) ||
                            (rNama && (e['Nama Lengkap'] || '').toLowerCase() === rNama.toLowerCase()) ||
                            (rPang && (e['Nama Panggilan'] || '').toLowerCase() === rPang.toLowerCase())
                        );

                        const ex = keys => { for (const k of keys) { if (row[k] !== undefined) return parseFloat(row[k]) || 0; } return null; };
                        importedRows.push({
                            nik: rNik,
                            nama: rNama || rPang,
                            emp: emp || null,
                            hk: ex(['Hari Kerja', 'Total Hari Kerja', 'HK']) ?? '',
                            h: ex(['Hadir', 'Total Kehadiran', 'H', 'HADIR']) ?? '',
                            th: ex(['Mangkir', 'Alpa', 'Alpha', 'TH', 'Total Ketidakhadiran', 'Tidak Absen']) ?? '',
                            cuti: ex(['Cuti', 'Total Cuti']) ?? '',
                            ckhs: ex(['Cuti Khusus', 'Total Cuti Khusus']) ?? '',
                            s: ex(['Sakit', 'Total Sakit', 'S']) ?? '',
                            ls: ex(['Long Shift', 'Total Long Shift', 'LS']) ?? '',
                            bu: ex(['Back Up', 'Total Back Up', 'BU']) ?? '',
                            telat: ex(['Telat', 'Terlambat', 'TELAT']) ?? '',
                            lembur: ex(['Lembur', 'Jam Lembur', 'Total Lembur']) ?? ''
                        });
                    });
                });

                showLoader(false);
                openAbsenReviewModal(importedRows);
            } catch (err) {
                showLoader(false);
                showToast('❌ Error parsing Excel: ' + err.message, 'error');
            }
        };
        reader.readAsArrayBuffer(file);
        event.target.value = '';
    }

    function importAbsenFromSheet() {
        showLoader(true);
        google.script.run
            .withSuccessHandler(res => {
                showLoader(false);
                if (!res.success) {
                    showToast('❌ Gagal import absen: ' + res.error, 'error');
                    return;
                }

                let importedRows = [];
                // Data dari GAS: res.data is an array of row objects
                res.data.forEach(row => {
                    const rNik = (row['NIK'] || row['nik'] || '').toString().trim();
                    const rNama = (row['Nama'] || row['NAMA'] || row['Nama Lengkap'] || '').toString().trim();
                    const rPang = (row['Panggilan'] || row['Nama Panggilan'] || '').toString().trim();
                    if (!rNik && !rNama && !rPang) return;

                    const emp = aktifList.find(e =>
                        (rNik && (e['NIK'] || '').toLowerCase() === rNik.toLowerCase()) ||
                        (rNama && (e['Nama Lengkap'] || '').toLowerCase() === rNama.toLowerCase()) ||
                        (rPang && (e['Nama Panggilan'] || '').toLowerCase() === rPang.toLowerCase())
                    );

                    const ex = keys => {
                        for (const k of keys) {
                            if (row[k] !== undefined && row[k] !== '') return parseFloat(row[k]) || 0;
                        }
                        return null;
                    };

                    importedRows.push({
                        nik: rNik,
                        nama: rNama || rPang,
                        emp: emp || null,
                        hk: ex(['Hari Kerja', 'Total Hari Kerja', 'HK', 'hk']) ?? '',
                        h: ex(['Hadir', 'Total Kehadiran', 'H', 'HADIR', 'hadir']) ?? '',
                        th: ex(['Mangkir', 'Alpa', 'Alpha', 'TH', 'Total Ketidakhadiran', 'Tidak Absen', 'th']) ?? '',
                        cuti: ex(['Cuti', 'Total Cuti', 'cuti']) ?? '',
                        ckhs: ex(['Cuti Khusus', 'Total Cuti Khusus', 'ckhs']) ?? '',
                        s: ex(['Sakit', 'Total Sakit', 'S', 'sakit']) ?? '',
                        ls: ex(['Long Shift', 'Total Long Shift', 'LS', 'ls']) ?? '',
                        bu: ex(['Back Up', 'Total Back Up', 'BU', 'bu']) ?? '',
                        telat: ex(['Telat', 'Terlambat', 'TELAT', 'telat']) ?? '',
                        lembur: ex(['Lembur', 'Jam Lembur', 'Total Lembur', 'lembur']) ?? ''
                    });

                if (importedRows.length === 0) {
                    showToast('⚠️ Tidak ada data absensi yang ditemukan di Sheet tersebut.', 'warning');
                    return;
                }

                openAbsenReviewModal(importedRows);
            })
            .withFailureHandler(err => {
                showLoader(false);
                showToast('❌ Error koneksi: ' + err.message, 'error');
            })
            .getAbsensiData();

    function applyAbsenReview() {
        const rows = window._absenReviewRows;
        let matchCount = 0;
        rows.forEach(r => {
            if (!r.emp) return;
            const nik = r.emp['NIK'];
            if (!payrollDataState[nik]) initPayrollStateV4(r.emp);
            const state = payrollDataState[nik];

            if (r.hk !== '') state.hk = parseFloat(r.hk) || 0;
            if (r.h !== '') state.hadir = parseFloat(r.h) || 0;
            if (r.th !== '') state.th = parseFloat(r.th) || 0;
            if (r.cuti !== '') state.cuti = parseFloat(r.cuti) || 0;
            if (r.ckhs !== '') state.cutiKhusus = parseFloat(r.ckhs) || 0;
            if (r.s !== '') state.sakit = parseFloat(r.s) || 0;
            if (r.ls !== '') state.ls = parseFloat(r.ls) || 0;
            if (r.bu !== '') state.bu = parseFloat(r.bu) || 0;
            if (r.telat !== '') state.telatMenit = parseFloat(r.telat) || 0;
            if (r.lembur !== '') state.lemburJam = parseFloat(r.lembur) || 0;

            const updateInp = (key, val) => {
                const el = document.getElementById(`inp_v4_${nik}_${key}`);
                if (el) el.value = val;
            };

            updateInp('hk', state.hk);
            updateInp('hadir', state.hadir);
            updateInp('th', state.th);
            updateInp('cuti', state.cuti);
            updateInp('cutiKhusus', state.cutiKhusus);
            updateInp('sakit', state.sakit);
            updateInp('ls', state.ls);
            updateInp('bu', state.bu);
            updateInp('telatMenit', state.telatMenit);
            updateInp('lemburJam', state.lemburJam);

            recalcRowV4(nik);

        const statusSel = document.getElementById('thr-filter-status');
        if (!tbody) return;

        // Populate branch dropdown once
        if (branchSel && branchSel.options.length <= 1) {
            const branches = [...new Set(globalEmployees.map(e => e['Penempatan'] || '').filter(Boolean))].sort();
            branches.forEach(b => {
                const opt = document.createElement('option');
                opt.value = b; opt.textContent = b;
                branchSel.appendChild(opt);
            });
        }

        const branchFilter = branchSel?.value || '';
        const statusFilter = statusSel?.value || '';
        const today = new Date();

        let source = globalEmployees.filter(e => {
            const st = String(e['Status'] || '').toLowerCase();
            // Hanya karyawan yang sedang bekerja (exclude resign)
            return st !== 'resign' && st !== 'tidak aktif';
        });

        if (branchFilter) source = source.filter(e => (e['Penempatan'] || '') === branchFilter);
        if (statusFilter) source = source.filter(e => String(e['Status'] || '').toLowerCase().includes(statusFilter.toLowerCase()));

        let totalTHR = 0;
        let rows = '';

        source.forEach((emp, i) => {
            const tglMasuk = parseIndoDate(String(emp['Tgl Masuk'] || '').trim());
            const gapok = parseFloat(String(emp['Gaji Pokok'] || '0').replace(/[^\d.]/g, '')) || 0;

            if (!tglMasuk || gapok === 0) {
                rows += `<tr class="hover:bg-gray-50 transition">
                    <td class="text-center text-xs text-gray-400">${i + 1}</td>
                    <td><p class="font-semibold text-gray-800">${emp['Nama Lengkap'] || '-'}</p><p class="text-[10px] text-gray-400">${emp['Posisi'] || ''}</p></td>
                    <td class="text-xs text-gray-600">${emp['Penempatan'] || '-'}</td>
                    <td><span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-gray-100 text-gray-500">${emp['Status'] || '-'}</span></td>
                    <td class="text-xs text-gray-500">${emp['Tgl Masuk'] || '-'}</td>
                    <td class="text-xs text-gray-400 italic">Data tidak lengkap</td>
                    <td class="text-xs text-gray-500">${gapok > 0 ? 'Rp' + gapok.toLocaleString('id-ID') : '-'}</td>
                    <td class="text-right text-xs text-red-400">—</td>
                    <td class="text-center"><span class="text-[10px] px-2 py-0.5 bg-red-50 text-red-600 rounded-full">Data Kurang</span></td>
                </tr>`;
                return;
            }

            // Hitung masa kerja dalam bulan
            const diffMs = today - tglMasuk;
            const totalMonths = Math.floor(diffMs / (1000 * 60 * 60 * 24 * 30.44));
            const years = Math.floor(totalMonths / 12);
            const months = totalMonths % 12;

            let thr = 0;
            let ket = '';

            if (totalMonths >= 12) {
                // ≥ 1 tahun → 1x Gapok
                thr = gapok;
                ket = `${years} Thn ${months} Bln → 1× Gapok`;
            } else if (totalMonths >= 1) {
                // < 1 tahun → (bulan/12) × Gapok, dibulatkan
                thr = Math.round((totalMonths / 12) * gapok);
                ket = `${totalMonths} Bln / 12 × Gapok`;
            } else {
                // Kurang dari 1 bulan → tidak berhak
                thr = 0;
                ket = 'Masa kerja < 1 bulan';
            }

            totalTHR += thr;

            const masaKerjaStr = totalMonths >= 12 ? `${years} Thn ${months} Bln` : `${totalMonths} Bln`;
            const thrColor = thr === gapok ? 'text-emerald-700 bg-emerald-50' :
                thr > 0 ? 'text-amber-700 bg-amber-50' : 'text-red-600 bg-red-50';

            const statusColor = (st => {
                const s = st.toLowerCase();
                if (s.includes('probation')) return 'bg-blue-100 text-blue-700';
                if (s.includes('kontrak')) return 'bg-purple-100 text-purple-700';
                return 'bg-emerald-100 text-emerald-700';
            })(emp['Status'] || '');

            rows += `<tr class="hover:bg-amber-50/30 transition border-b border-gray-50">
                <td class="text-center text-xs text-gray-400 font-bold">${i + 1}</td>
                <td><p class="font-semibold text-gray-800">${emp['Nama Lengkap'] || '-'}</p><p class="text-[10px] text-gray-400">${emp['Posisi'] || ''}</p></td>
                <td class="text-xs text-gray-600">${emp['Penempatan'] || '-'}</td>
                <td><span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${statusColor}">${emp['Status'] || '-'}</span></td>
                <td class="text-xs text-gray-600">${emp['Tgl Masuk'] || '-'}</td>
                <td class="text-xs font-semibold text-gray-700">${masaKerjaStr}</td>
                <td class="text-xs text-gray-700">Rp${gapok.toLocaleString('id-ID')}</td>
                <td class="text-right"><span class="text-sm font-black px-2 py-1 rounded-lg ${thrColor}">Rp${thr.toLocaleString('id-ID')}</span></td>
                <td class="text-center text-[10px] text-gray-500">${ket}</td>
            </tr>`;
        });

        tbody.innerHTML = rows || '<tr><td colspan="9" class="py-12 text-center text-gray-400">Tidak ada data.</td></tr>';

        // Update summary
        const countEl = document.getElementById('thr-summary-count');
        const totalEl = document.getElementById('thr-summary-total');
        const avgEl = document.getElementById('thr-summary-avg');
        if (countEl) countEl.innerText = source.length + ' Orang';
        if (totalEl) totalEl.innerText = 'Rp' + totalTHR.toLocaleString('id-ID');
        if (avgEl) avgEl.innerText = source.length > 0 ? 'Rp' + Math.round(totalTHR / source.length).toLocaleString('id-ID') : '—';
    };

    function submitSPAktif() {
        const empVal = document.getElementById('sp-karyawan').value;
        const tanggal = document.getElementById('sp-tanggal').value;
        const tingkat = document.getElementById('sp-tingkat').value;
        const detail = document.getElementById('sp-detail').value;
        const tindakan = document.getElementById('sp-tindakan').value;
        const berlaku = document.getElementById('sp-berlaku').value;
        const punish = document.getElementById('sp-punishment').value;

        if (!empVal || !tanggal || !detail) return showToast('Harap lengkapi Karyawan, Tanggal, dan Detail Pelanggaran!', 'warning');

        const parts = empVal.split('| NIK: ');
        const namaKaryawan = parts[0].trim();
        const nikKaryawan = parts.length > 1 ? parts[1].trim() : '';

        const emps = (typeof globalEmployees !== 'undefined') ? globalEmployees : [];
        const targetEmp = emps.find(e => e['NIK'] === nikKaryawan);

        const payload = {
            nama: namaKaryawan, nik: nikKaryawan, rowIdx: targetEmp ? targetEmp.rowIdx : '',
            tanggal: tanggal, tingkat: tingkat, detail: detail, tindakan: tindakan, berlaku: berlaku, punishment: punish
        };

        const btn = document.querySelector('#sp-aktif-modal button.bg-red-600');
        const oriText = btn ? btn.innerHTML : 'Simpan';
        if (btn) { btn.innerHTML = 'Menyimpan...'; btn.disabled = true; }

        google.script.run
            .withSuccessHandler(function (res) {
                if (btn) { btn.innerHTML = oriText; btn.disabled = false; }
                if (res && res.success) {
                    showToast('Sukses! Data SP berhasil masuk ke database.', 'success');
                    closeSPAktifModal();
                    if (typeof loadMasterData === 'function') loadMasterData(); // Auto refresh
                } else {
                    showToast('Gagal menyimpan: ' + (res ? res.error : 'Server tidak merespons'), 'error');
                }
            })
            .withFailureHandler(function (err) {
                if (btn) { btn.innerHTML = oriText; btn.disabled = false; }
                showToast('Terjadi kesalahan koneksi dengan server Google.', 'warning');
            })
            .saveSPAktif(payload);
    }

    // ============================================================
    // MODULE: CEK ABSEN OTOMATIS — HRIS Integration
    // ============================================================
    var absenRawRows = [];
    var absenProcessed = [];
    var absenSummary = [];
    var absenView = 'rekap';
    var absenDeptShifts = { _default: '08:00' };

    var ABSEN_TIERS = [
        { min: 0, max: 10, denda: 0, label: 'Toleransi' },
        { min: 11, max: 20, denda: 10000, label: '11–20 mnt' },
        { min: 21, max: 30, denda: 20000, label: '21–30 mnt' },
        { min: 31, max: 40, denda: 30000, label: '31–40 mnt' },
        { min: 41, max: 50, denda: 40000, label: '41–50 mnt' },
        { min: 51, max: 60, denda: 50000, label: '51–60 mnt' },
        { min: 61, max: 9999, denda: 60000, label: '>60 mnt / No Absen' }
    ];

    // ─── Core Logic ─────────────────────────────────────────────
    function absenToMins(s) {
        if (!s || !s.trim()) return null;
        var p = s.trim().split(':');
        if (p.length < 2) return null;
        var h = parseInt(p[0]), m = parseInt(p[1]);
        if (isNaN(h) || isNaN(m)) return null;
        var total = h * 60 + m;
        return total < 300 ? null : total; // abaikan jam < 05:00 (error finger)
    }

    function absenFmtDate(s) {
        if (!s) return '—'; s = s.trim();
        if (s.includes('/')) { var p = s.split('/'); return p.length === 3 ? p[1].padStart(2, '0') + '/' + p[0].padStart(2, '0') : s; }
        if (s.includes('-')) { var p = s.split('-'); return p.length >= 3 ? p[2].padStart(2, '0') + '/' + p[1].padStart(2, '0') : s; }
        return s;
    }

    function absenCalcRow(r) {
        var dk = (r.dept && absenDeptShifts[r.dept]) ? r.dept : '_default';
        var shiftMins = absenToMins(absenDeptShifts[dk] || '08:00') || 480;
        var masuk = absenToMins(r.mI) !== null ? absenToMins(r.mI) : (absenToMins(r.mII) !== null ? absenToMins(r.mII) : null);
        var keluar = absenToMins(r.kI) !== null ? absenToMins(r.kI) : (absenToMins(r.kII) !== null ? absenToMins(r.kII) : null);

        if (masuk === null && keluar === null)
            return { status: 'OFF', denda: 0, late: null, masukStr: '—', shift: absenDeptShifts[dk] || '08:00' };
        if (masuk === null)
            return { status: 'ALPHA', denda: 60000, late: null, masukStr: '-', shift: absenDeptShifts[dk] || '08:00' };

        var h = Math.floor(masuk / 60).toString().padStart(2, '0');
        var m = (masuk % 60).toString().padStart(2, '0');
        var masukStr = h + ':' + m;
        var late = Math.max(0, masuk - shiftMins);

        if (late === 0) return { status: 'HADIR', denda: 0, late: 0, masukStr: masukStr, shift: absenDeptShifts[dk] || '08:00' };

        for (var i = ABSEN_TIERS.length - 1; i >= 0; i--) {
            if (late >= ABSEN_TIERS[i].min) {
                var d = ABSEN_TIERS[i].denda;
                var st = d >= 60000 ? 'ALPHA' : (late <= 10 ? 'TOLERANSI' : 'TELAT');
                return { status: st, denda: d, late: late, masukStr: masukStr, shift: absenDeptShifts[dk] || '08:00' };
            }
        }
        return { status: 'HADIR', denda: 0, late: 0, masukStr: masukStr, shift: absenDeptShifts[dk] || '08:00' };
    }

    function absenBuildSummary(processed) {
        var map = {};
        processed.forEach(function (r) {
            if (!map[r.nama]) map[r.nama] = { nama: r.nama, dept: r.dept, hadir: 0, toleransi: 0, telat: 0, alpha: 0, off: 0, totalDenda: 0, bukti: [] };
            var s = map[r.nama];
            switch (r.status) {
                case 'HADIR': s.hadir++; break;
                case 'TOLERANSI': s.toleransi++; s.hadir++; break;
                case 'TELAT': s.telat++; s.totalDenda += r.denda; s.bukti.push(r.tglFmt + ' Denda ' + r.denda.toLocaleString('id-ID') + ' (Msk: ' + r.masukStr + ')'); break;
                case 'ALPHA': s.alpha++; s.totalDenda += r.denda; s.bukti.push(r.tglFmt + ' Alpha (Msk: ' + r.masukStr + ')'); break;
                case 'OFF': s.off++; break;
            }
        });
        return Object.values(map).sort(function (a, b) { return b.totalDenda - a.totalDenda; });
    }

    function absenRecalc() {
        if (!absenRawRows.length) return;
        absenProcessed = absenRawRows.map(function (r) { return Object.assign({}, r, absenCalcRow(r)); });
        absenSummary = absenBuildSummary(absenProcessed);
        absenUpdateStats();
        absenRenderDeptShiftInputs();
        if (absenView === 'rekap') renderAbsenRekap();
        else renderAbsenDetail();
    }

    function absenUpdateStats() {
        var tot = absenSummary.reduce(function (a, b) { return a + b.totalDenda; }, 0);
        var el = function (id) { return document.getElementById(id); };
        if (el('ab-stat-emp')) el('ab-stat-emp').textContent = absenSummary.length || '—';
        if (el('ab-stat-tot')) el('ab-stat-tot').textContent = tot > 0 ? 'Rp ' + tot.toLocaleString('id-ID') : '—';
        if (el('ab-stat-alpha')) el('ab-stat-alpha').textContent = absenProcessed.filter(function (r) { return r.status === 'ALPHA'; }).length || '—';
        if (el('ab-stat-rows')) el('ab-stat-rows').textContent = absenProcessed.length || '—';
    }

    // ─── Render Rekap Table ──────────────────────────────────────
    function renderAbsenRekap() {
        var tbody = document.getElementById('ab-rekap-body');
        if (!tbody) return;
        if (!absenSummary.length) {
            tbody.innerHTML = '<tr><td colspan="14" class="py-14 text-center text-gray-400"><span class="material-icons text-4xl text-gray-200 block mb-2">search_off</span>Tidak ada data.</td></tr>';
            return;
        }
        var maxD = Math.max.apply(null, absenSummary.map(function (s) { return s.totalDenda; }));
        tbody.innerHTML = absenSummary.map(function (s) {
            var sp = s.bukti.length > 2 ? s.bukti.slice(0, 2).join('; ') + '… (+' + (s.bukti.length - 2) + ')' : (s.bukti.join('; ') || '—');
            var full = s.bukti.join('; ') || '—';
            var barW = maxD > 0 ? Math.round((s.totalDenda / maxD) * 80) : 0;

            var disSakit = s.sakit !== undefined ? s.sakit : (s.off || '—');

    function handleAbsenExcelUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function (e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });

                let targetSheetName = workbook.SheetNames[0];
                let isRekapSheet = false;
                for (let sn of workbook.SheetNames) {
                    const sheetLower = sn.toLowerCase();
                    if (sheetLower.includes('rekap') || sheetLower.includes('import absen')) {
                        targetSheetName = sn;
                        isRekapSheet = true;
                        break;
                    }
                }

                const worksheet = workbook.Sheets[targetSheetName];
                const json = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });

                // === MODE REKAP OTOMATIS (Membaca Sheet Rekap) ===
                if (isRekapSheet) {
                    let headerRowIdx = -1;
                    let cols = { nama: -1, dept: -1, hadir: -1, cuti: -1, cutiKhusus: -1, sakit: -1, alpha: -1, lembur: -1, ls: -1, bu: -1, hk: -1 };

                    for (let i = 0; i < Math.min(json.length, 15); i++) {
                        const row = json[i];
                        for (let j = 0; j < row.length; j++) {
                            const val = String(row[j]).trim().toLowerCase();
                            if (val === 'nama' || val === 'name') cols.nama = j;
                            else if (val === 'divisi' || val === 'dept' || val === 'departemen') cols.dept = j;
                            else if (val === 'total kehadiran' || val === 'hadir') cols.hadir = j;
                            else if (val === 'cuti') cols.cuti = j;
                            else if (val === 'cuti khusus') cols.cutiKhusus = j;
                            else if (val === 'sakit') cols.sakit = j;
                            else if (val === 'tidak absen' || val === 'alpha' || val === 'alpa') cols.alpha = j;
                            else if (val === 'total lembur' || val === 'lembur') cols.lembur = j;
                            else if (val === 'total long shift' || val === 'long shift') cols.ls = j;
                            else if (val === 'total back up' || val === 'back up' || val === 'backup') cols.bu = j;
                            else if (val === 'total hari kerja' || val === 'hk' || val === 'hari kerja') cols.hk = j;
                        }
                        if (cols.nama !== -1) {
                            headerRowIdx = i;
                            break;
                        }
                    }

                    if (cols.nama === -1) throw new Error('Kolom Nama tidak ditemukan di sheet Rekap.');
                    if (cols.hadir === -1) {
                        for (let j = 0; j < json[headerRowIdx].length; j++) {
                            const val = String(json[headerRowIdx][j]).trim().toLowerCase();
                            if (val.includes('hadir') || val.includes('total')) {
                                cols.hadir = j; break;
                            }
                        }
                    }

                    absenSummary = [];
                    for (let i = headerRowIdx + 1; i < json.length; i++) {
                        const row = json[i];
                        const nama = String(row[cols.nama] || '').trim();
                        if (!nama || nama.toLowerCase() === 'nama' || nama.toLowerCase().includes('total')) continue;

                        const dept = cols.dept !== -1 ? String(row[cols.dept] || '').trim() : '-';
                        let hadir = cols.hadir !== -1 ? (parseInt(row[cols.hadir]) || 0) : 0;
                        let alpha = cols.alpha !== -1 ? (parseInt(row[cols.alpha]) || 0) : 0;
                        let cuti = cols.cuti !== -1 ? (parseInt(row[cols.cuti]) || 0) : 0;
                        let cutiKhusus = cols.cutiKhusus !== -1 ? (parseInt(row[cols.cutiKhusus]) || 0) : 0;
                        let sakit = cols.sakit !== -1 ? (parseInt(row[cols.sakit]) || 0) : 0;

                        let lembur = cols.lembur !== -1 ? (parseFloat(row[cols.lembur]) || 0) : 0;
                        let ls = cols.ls !== -1 ? (parseInt(row[cols.ls]) || 0) : 0;
                        let bu = cols.bu !== -1 ? (parseInt(row[cols.bu]) || 0) : 0;
                        let hk = cols.hk !== -1 ? (parseInt(row[cols.hk]) || 0) : 0;

                        let off = cuti + sakit;

                        if (cols.hadir === -1 || isNaN(hadir) || hadir === 0) {
                            let sumShift = 0;
                            for (let j = 0; j < row.length; j++) {
                                let h = String(json[headerRowIdx][j] || '').toLowerCase();
                                if (h === 'morning' || h === 'middle' || h === 'evening' || h === 'in charge' || h === 'long shift' || h === 'lembur' || h === 'back up' || h === 'total back up') {
                                    sumShift += (parseInt(row[j]) || 0);
                                }
                            }
                            if (sumShift > 0) hadir = sumShift;
                        }

                        if (hadir > 0 || off > 0 || alpha > 0 || lembur > 0 || ls > 0 || bu > 0 || cutiKhusus > 0) {
                            absenSummary.push({
                                nama: nama,
                                dept: dept,
                                hadir: hadir,
                                hk: hk,
                                toleransi: 0,
                                telat: 0,
                                alpha: alpha,
                                off: off,
                                cuti: cuti,
                                cutiKhusus: cutiKhusus,
                                sakit: sakit,
                                lembur: lembur,
                                ls: ls,
                                bu: bu,
                                totalDenda: 0,
                                bukti: ['Data Rekap dari Sheet: ' + targetSheetName]
                            });
                        }
                    }

                    if (absenSummary.length > 0) {
                        absenRawRows = [];
                        absenProcessed = [];
                        showToast(`Berhasil memuat Rekap untuk ${absenSummary.length} karyawan dari sheet "${targetSheetName}"!`, 'success');
                        if (typeof absenUpdateStats === 'function') absenUpdateStats();
                        if (typeof setAbsenView === 'function') setAbsenView('rekap');
                        if (typeof renderAbsenRekap === 'function') renderAbsenRekap();
                        return; // SELESAI
                    } else {
                        throw new Error('Tidak ada data kehadiran yang valid di sheet Rekap.');
                    }
                }
                // === SELESAI MODE REKAP ===

                let parsedRows = [];
                let datesRowIdx = -1;
                let namaColIdx = -1;
                let deptColIdx = -1;
                let dateCols = {};

                for (let i = 0; i < Math.min(json.length, 15); i++) {
                    const row = json[i];
                    let isHeader = false;
                    for (let j = 0; j < row.length; j++) {
                        const val = String(row[j]).trim().toLowerCase();
                        if (val === 'nama' || val === 'name') {
                            namaColIdx = j;
                            isHeader = true;
                        } else if (val.includes('dept') || val.includes('departemen')) {
                            deptColIdx = j;
                        }
                    }
                    if (isHeader) {
                        datesRowIdx = i;
                        for (let j = 0; j < row.length; j++) {
                            const val = String(row[j]).trim();
                            if (val && !isNaN(parseInt(val)) && parseInt(val) <= 31) {
                                dateCols[j] = parseInt(val);
                            }
                        }
                        break;
                    }
                }

                if (namaColIdx === -1) {
                    throw new Error('Kolom Nama/Name tidak ditemukan di baris header Excel.');
                }

                if (Object.keys(dateCols).length === 0) {
                    let startCol = Math.max(namaColIdx, deptColIdx) + 1;
                    if (datesRowIdx !== -1 && json[datesRowIdx]) {
                        for (let j = startCol; j < json[datesRowIdx].length; j++) {
                            let val = parseInt(json[datesRowIdx][j]);
                            if (!isNaN(val) && val >= 1 && val <= 31) dateCols[j] = val;
                        }
                    }
                }

                const now = new Date();
                let year = now.getFullYear();
                let month = now.getMonth();

                for (let i = datesRowIdx + 1; i < json.length; i++) {
                    const row = json[i];
                    const nama = String(row[namaColIdx] || '').trim();
                    const dept = deptColIdx !== -1 ? String(row[deptColIdx] || '').trim() : '-';

                    if (!nama || nama.toLowerCase() === 'nama') continue;

                    let hasAttendance = false;

                    for (const [colIdxStr, day] of Object.entries(dateCols)) {
                        const colIdx = parseInt(colIdxStr);
                        const cellVal = String(row[colIdx] || '').trim();

                        if (cellVal && cellVal !== '') {
                            const timeMatches = cellVal.match(/\b([0-1]?[0-9]|2[0-3]):([0-5][0-9])\b/g);
                            let m1 = '', k1 = '', m2 = '', k2 = '';

                            if (timeMatches && timeMatches.length > 0) {
                                timeMatches.sort();
                                m1 = timeMatches[0];
                                if (timeMatches.length > 1) {
                                    k1 = timeMatches[timeMatches.length - 1];
                                }
                                hasAttendance = true;
                            } else {
                                // Hybrid Parser: Terjemahkan teks jadwal (Schedule LOS CIKEN)
                                const valLower = cellVal.toLowerCase();
                                if (valLower.includes('pagi') || valLower === 'p' || valLower === 'm') {
                                    m1 = '08:00'; k1 = '16:00'; hasAttendance = true;
                                } else if (valLower.includes('mid')) {
                                    m1 = '11:00'; k1 = '19:00'; hasAttendance = true;
                                } else if (valLower.includes('sore') || valLower === 's') {
                                    m1 = '14:00'; k1 = '22:00'; hasAttendance = true;
                                } else if (valLower.includes('full') || valLower.includes('long')) {
                                    m1 = '08:00'; k1 = '22:00'; hasAttendance = true;
                                } else {
                                    continue;
                                }
                            }

                            const tgl = new Date(year, month, day);
                            parsedRows.push({
                                tgl: tgl,
                                tglFmt: absenFmtDate(tgl),
                                nama: nama,
                                dept: dept,
                                m1: m1,
                                k1: k1,
                                m2: m2,
                                k2: k2
                            });
                        }
                    }
                }

                if (parsedRows.length === 0) {
                    throw new Error('Tidak ada data waktu absensi (HH:MM) valid yang bisa dibaca.');
                }

                absenRawRows = parsedRows;
                absenDeptShifts._default = absenSettings.masuk || '08:00';

                showToast(`Berhasil memuat ${absenRawRows.length} record absensi dari Excel!`, 'success');
                absenRecalc();

            } catch (err) {
                showToast('Gagal membaca Excel: ' + err.message, 'error');
                console.error(err);
            }
        };
        reader.readAsArrayBuffer(file);
    }

    function applyAbsenToPayroll() {
        if (!absenSummary || !absenSummary.length) return showToast('Belum ada data absen yang dimuat.', 'warning');

        let count = 0;
        absenSummary.forEach(s => {
            const empNameLower = s.nama.toLowerCase();
            const emp = aktifList.find(e =>
                (e['Nama Lengkap'] || '').toLowerCase() === empNameLower ||
                (e['Nama Panggilan'] || '').toLowerCase() === empNameLower ||
                (e['NIK'] && String(e['NIK']).toLowerCase() === empNameLower)
            );

            if (emp) {
                const nik = emp['NIK'];
                if (!payrollDataState[nik]) initPayrollStateV4(emp);
                const state = payrollDataState[nik];

                state.hadir = s.hadir !== undefined ? s.hadir : 0;
                state.th = s.alpha || 0;
                state.telatMenit = s.telat || 0;
                state.sakit = s.sakit !== undefined ? s.sakit : (s.off || 0);
                state.cuti = s.cuti || 0;
                state.cutiKhusus = s.cutiKhusus || 0;
                state.ls = s.ls || 0;
                state.bu = s.bu || 0;
                state.lemburJam = s.lembur || 0;
                if (s.hk > 0) state.hk = s.hk;

                const setVal = (key, val) => { const el = document.getElementById(`inp_v4_${nik}_${key}`); if (el) el.value = val; };
                setVal('hadir', state.hadir);
                setVal('th', state.th);
                setVal('telatMenit', state.telatMenit);
                setVal('sakit', state.sakit);
                setVal('cuti', state.cuti);
                setVal('cutiKhusus', state.cutiKhusus);
                setVal('ls', state.ls);
                setVal('bu', state.bu);
                setVal('lemburJam', state.lemburJam);
                if (s.hk > 0) setVal('hk', state.hk);

                recalcRowV4(nik);
                count++;
            }
        });

        if (count > 0) {
            if (typeof updateBranchTotals === 'function') updateBranchTotals();
            showToast(`✅ Berhasil menerapkan data absen ke Payroll untuk ${count} karyawan!\n\n(Silakan buka menu Payroll Engine untuk melihat perubahannya, 'success')`);

            // Re-render payroll supaya nilai baru muncul di tabel
            if (typeof renderPayrollMass === 'function' && aktifList.length) {
                // Navigasi ke payroll tab
                if (typeof switchView === 'function') switchView('payroll');
                if (typeof switchPayrollTab === 'function') switchPayrollTab('mass');
                // Render ulang (initPayrollStateV4 tidak akan overwrite karena state sudah ada)
                renderPayrollMass();
            }
        } else {
            showToast('❌ Tidak ada nama karyawan di Rekap Absen yang cocok dengan data Master (Payroll aktif + tidak aktif).', 'warning');
        }
    }

    // ─── Export Excel ────────────────────────────────────────────
    window.exportMasterExcel = function () {
        if (!globalEmployees || globalEmployees.length === 0) return showToast("Data belum dimuat.", 'error');
        if (typeof XLSX === 'undefined') return showToast('Library XLSX belum termuat.', 'warning');

        let keys = Object.keys(globalEmployees[0]);
        let startName = keys.find(k => k.toLowerCase().includes('nama'));
        let endName = keys.find(k => k.toLowerCase() === 'atas nama');

        let startIdx = keys.indexOf(startName);
        let endIdx = keys.indexOf(endName);

        if (startIdx !== -1 && endIdx !== -1 && startIdx <= endIdx) {
            keys = keys.slice(startIdx, endIdx + 1);
        }

        let data = [];
        data.push(keys);
        globalEmployees.forEach(emp => {
            let row = [];
            keys.forEach(k => {
                row.push(emp[k] || '');
            });
            data.push(row);
        });

        let ws = XLSX.utils.aoa_to_sheet(data);
        let wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Master Data");
        XLSX.writeFile(wb, "Master_Karyawan_" + new Date().toISOString().slice(0, 10) + ".xlsx");
    }

    function exportAbsenXLSX() {
        if (!absenSummary.length) return showToast('Belum ada data untuk diekspor.', 'warning');
        if (typeof XLSX === 'undefined') return showToast('Library XLSX belum termuat.', 'warning');

        var s1 = [['Nama', 'Dept', 'Hadir', 'Toleransi', 'Telat', 'Alpha', 'OFF', 'Total Potongan (Rp)', 'Detail Bukti']];
        absenSummary.forEach(function (s) {
            s1.push([s.nama, s.dept, s.hadir, s.toleransi, s.telat, s.alpha, s.off, s.totalDenda, s.bukti.join('; ') || '-']);
        });

        var s2 = [['Nama', 'Dept', 'Tanggal', 'Masuk', 'Keluar', 'Terlambat (mnt)', 'Status', 'Potongan (Rp)', 'Jam Shift']];
        absenProcessed.forEach(function (r) {
            var kv = absenToMins(r.kI) !== null ? absenToMins(r.kI) : (absenToMins(r.kII) !== null ? absenToMins(r.kII) : null);
            var ks = kv !== null ? Math.floor(kv / 60).toString().padStart(2, '0') + ':' + (kv % 60).toString().padStart(2, '0') : '-';
            s2.push([r.nama, r.dept, r.tgl, r.masukStr, ks, (r.late !== null && r.late > 0 ? r.late : '-'), r.status, r.denda, r.shift]);
        });

        var wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s1), 'Rekap');
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s2), 'Detail');
        XLSX.writeFile(wb, 'Rekap_Absen_' + new Date().toISOString().slice(0, 10) + '.xlsx');
    }

    // ============================================================
    // TOOLS CEK KETERLAMBATAN — Native HRIS Engine
    // ============================================================
    var _ab = {
        rawRows: [], processed: [], summary: [],
        view: 'rekap', filterDept: 'ALL',
        deptShifts: { _default: '08:00' }
    };

    var AB_TIERS = [
        { min: 0, max: 10, denda: 0, label: 'Toleransi (0–10 mnt)' },
        { min: 11, max: 20, denda: 10000, label: 'Telat 11–20 mnt' },
        { min: 21, max: 30, denda: 20000, label: 'Telat 21–30 mnt' },
        { min: 31, max: 40, denda: 30000, label: 'Telat 31–40 mnt' },
        { min: 41, max: 50, denda: 40000, label: 'Telat 41–50 mnt' },
        { min: 51, max: 60, denda: 50000, label: 'Telat 51–60 mnt' },
        { min: 61, max: 9999, denda: 60000, label: '>60 mnt / No Absen = Alpha' }
    ];

    // ─── Core Helpers ────────────────────────────────────────────
    function _abToMins(s) {
        if (!s || !s.trim()) return null;
        var p = s.trim().split(':');
        if (p.length < 2) return null;
        var h = parseInt(p[0]), m = parseInt(p[1]);
        if (isNaN(h) || isNaN(m)) return null;
        var total = h * 60 + m;
        return total < 300 ? null : total; // Abaikan jam < 05:00 (error finger/midnight)
    }

    function _abFmtDate(s) {
        if (!s) return '—';
        s = s.trim();
        if (s.includes('/')) {
            var p = s.split('/');
            if (p.length === 3) return p[1].padStart(2, '0') + '/' + p[0].padStart(2, '0');
            return s;
        }
        if (s.includes('-')) {
            var p = s.split('-');
            return p.length >= 3 ? p[2].padStart(2, '0') + '/' + p[1].padStart(2, '0') : s;
        }
        return s;
    }

    // ─── Per-Row Calculation ─────────────────────────────────────
    function _abCalcRow(r) {
        var shiftRule = getAbsenShiftForRow(r);
        var shiftLabel = shiftRule.label + ' ' + shiftRule.masuk + '-' + shiftRule.keluar;

        var shiftMins = _abToMins(shiftRule.masuk) || 480;
        var keluarRule = _abToMins(shiftRule.keluar || '');

        var toleransi = parseInt(absenSettings.toleransi, 10) || 10;
        var dendaAlpha = parseInt(absenSettings.alpha, 10) || 60000;
        var dendaNoPulang = parseInt(absenSettings.noPulang, 10) || 0;

        var masuk = _abToMins(r.mI) !== null ? _abToMins(r.mI) :
            (_abToMins(r.mII) !== null ? _abToMins(r.mII) : null);

        var keluar = _abToMins(r.kI) !== null ? _abToMins(r.kI) :
            (_abToMins(r.kII) !== null ? _abToMins(r.kII) : null);

        if (masuk === null && keluar === null) {
            return {
                status: 'OFF',
                denda: 0,
                late: null,
                masukStr: '—',
                shift: shiftLabel
            };
        }

        if (masuk === null) {
            return {
                status: 'ALPHA',
                denda: dendaAlpha,
                late: null,
                masukStr: '-',
                shift: shiftLabel
            };
        }

        var h = Math.floor(masuk / 60).toString().padStart(2, '0');
        var m = (masuk % 60).toString().padStart(2, '0');
        var masukStr = h + ':' + m;

        var late = Math.max(0, masuk - shiftMins);
        var dendaTelat = 0;
        var status = 'HADIR';

        if (late > 0 && late <= toleransi) {
            status = 'TOLERANSI';
        } else if (late > toleransi) {
            for (var i = AB_TIERS.length - 1; i >= 0; i--) {
                if (late >= AB_TIERS[i].min) {
                    dendaTelat = AB_TIERS[i].denda;
                    status = dendaTelat >= 60000 ? 'ALPHA' : 'TELAT';
                    break;
                }
            }
        }

        if (keluarRule && keluar === null && dendaNoPulang > 0) {
            return {
                status: 'NO PULANG',
                denda: dendaTelat + dendaNoPulang,
                late: late,
                masukStr: masukStr,
                shift: shiftLabel
            };
        }

        if (keluarRule && keluar !== null && keluar < keluarRule) {
            return {
                status: 'PULANG CEPAT',
                denda: dendaTelat,
                late: late,
                masukStr: masukStr,
                shift: shiftLabel
            };
        }

        return {
            status: status,
            denda: dendaTelat,
            late: late,
            masukStr: masukStr,
            shift: shiftLabel
        };
    }
    // ─── Build Summary per Employee ───────────────────────────────
    function _abBuildSummary(processed) {
        var map = {};
        processed.forEach(function (r) {
            if (!map[r.nama]) map[r.nama] = {
                nama: r.nama, dept: r.dept,
                hadir: 0, toleransi: 0, telat: 0, alpha: 0, off: 0,
                totalDenda: 0, bukti: []
            };
            var s = map[r.nama];
            switch (r.status) {
                case 'HADIR': s.hadir++; break;
                case 'TOLERANSI': s.toleransi++; s.hadir++; break;
                case 'TELAT':
                    s.telat++; s.totalDenda += r.denda;
                    s.bukti.push(r.tglFmt + ' Denda ' + r.denda.toLocaleString('id-ID') + ' (Msk: ' + r.masukStr + ')');
                    break;
                case 'ALPHA':
                    s.alpha++; s.totalDenda += r.denda;
                    s.bukti.push(r.tglFmt + ' Alpha (Msk: ' + r.masukStr + ')');
                    break;
                case 'OFF': s.off++; break;
            }
        });
        return Object.values(map).sort(function (a, b) { return b.totalDenda - a.totalDenda; });
    }

    // ─── Full Recalculate ─────────────────────────────────────────
    function absenRecalc() {
        if (!_ab.rawRows.length) return;
        _ab.processed = _ab.rawRows.map(function (r) {
            return Object.assign({}, r, _abCalcRow(r));
        });
        _ab.summary = _abBuildSummary(_ab.processed);
        _abUpdateStats();
        _abBuildDeptFilterBtns();
        _abBuildDeptShiftInputs();
        absenRender();
    }

    function _abUpdateStats() {
        var tot = _ab.summary.reduce(function (a, b) { return a + b.totalDenda; }, 0);
        var lateCount = _ab.processed.filter(function (r) { return r.status === 'TELAT'; }).length;
        var alphaCount = _ab.processed.filter(function (r) { return r.status === 'ALPHA'; }).length;
        var worst = _ab.summary.length > 0 ? _ab.summary[0] : null;
        var set = function (id, v) { var el = document.getElementById(id); if (el) el.textContent = v; };
        set('ab-stat-late', lateCount || '—');
        set('ab-stat-alpha', alphaCount || '—');
        set('ab-stat-tot', tot > 0 ? 'Rp ' + tot.toLocaleString('id-ID') : '—');
        set('ab-stat-worst', worst && worst.totalDenda > 0
            ? worst.nama + '\nRp ' + worst.totalDenda.toLocaleString('id-ID') : '—');
    }

    // ─── Render (filter + display) ────────────────────────────────
    function absenRender() {
        if (!_ab.rawRows.length) return;
        var q = (document.getElementById('ab-search') ? document.getElementById('ab-search').value : '').toLowerCase();
        var fd = _ab.filterDept;
        var filtS = _ab.summary.filter(function (s) {
            return (fd === 'ALL' || s.dept === fd) && (!q || s.nama.toLowerCase().includes(q));
        });
        var filtD = _ab.processed.filter(function (r) {
            return (fd === 'ALL' || r.dept === fd) && (!q || r.nama.toLowerCase().includes(q));
        });
        if (_ab.view === 'rekap') _abRenderRekap(filtS);
        else _abRenderDetail(filtD);
    }

    function _abRenderRekap(summary) {
        var tbody = document.getElementById('ab-rekap-body');
        if (!tbody) return;
        if (!summary.length) {
            tbody.innerHTML = '<tr><td colspan="8" class="py-14 text-center"><div class="flex flex-col items-center gap-2 text-gray-400"><span class="material-icons text-5xl text-gray-200">search_off</span><p class="text-sm font-medium">Tidak ada hasil untuk filter ini.</p></div></td></tr>';
            return;
        }
        var maxD = Math.max.apply(null, summary.map(function (s) { return s.totalDenda; })) || 1;
        var colors = ['#3B82F6', '#8B5CF6', '#EC4899', '#F59E0B', '#10B981', '#EF4444'];
        var medals = ['🥇', '🥈', '🥉'];

        tbody.innerHTML = summary.map(function (s, i) {
            var color = colors[(s.nama.charCodeAt(0) || 0) % colors.length];
            var buktiShort = s.bukti.length > 2
                ? s.bukti.slice(0, 2).join('; ') + '… (+' + (s.bukti.length - 2) + ' lagi)'
                : (s.bukti.join('; ') || '—');
            var fullEnc = encodeURIComponent(s.bukti.join('; ') || '—');
            var shortEnc = encodeURIComponent(buktiShort);
            var barW = Math.round((s.totalDenda / maxD) * 80);

            return '<tr class="border-b border-gray-50 hover:bg-blue-50/30 transition-all cursor-default">' +
                '<td class="px-4 py-3"><div class="flex items-center gap-2.5">' +
                '<div class="w-8 h-8 rounded-xl flex items-center justify-center text-white text-xs font-black shrink-0" style="background:' + color + '">' + (s.nama.charAt(0) || '?') + '</div>' +
                '<div><p class="font-bold text-gray-800 text-sm leading-tight">' + s.nama + '</p>' +
                (i < 3 && s.totalDenda > 0 ? '<p class="text-[9px] text-gray-400">' + medals[i] + ' Terbanyak</p>' : '') +
                '</div></div></td>' +
                '<td class="px-4 py-3"><span class="px-2 py-0.5 bg-gray-100 rounded-lg text-[10px] font-bold text-gray-600">' + (s.dept || '—') + '</span></td>' +
                '<td class="px-4 py-3 text-center text-sm text-emerald-600 font-bold">' + (s.hadir || '—') + '</td>' +
                '<td class="px-4 py-3 text-center text-sm font-bold ' + (s.telat > 0 ? 'text-amber-600' : 'text-gray-300') + '">' + (s.telat || '—') + '</td>' +
                '<td class="px-4 py-3 text-center text-sm font-bold ' + (s.alpha > 0 ? 'text-red-600' : 'text-gray-300') + '">' + (s.alpha || '—') + '</td>' +
                '<td class="px-4 py-3 text-center text-sm text-gray-400">' + (s.off || '—') + '</td>' +
                '<td class="px-4 py-3 text-right">' +
                '<p class="font-black text-sm ' + (s.totalDenda > 0 ? 'text-red-600' : 'text-gray-300') + '">' +
                (s.totalDenda > 0 ? 'Rp ' + s.totalDenda.toLocaleString('id-ID') : '—') + '</p>' +
                (barW > 0 ? '<div style="height:3px;background:#fee2e2;border-radius:2px;margin-top:3px"><div style="height:100%;width:' + barW + '%;background:#ef4444;border-radius:2px"></div></div>' : '') +
                '</td>' +
                '<td class="px-4 py-3 max-w-xs text-[11px] text-gray-500 cursor-pointer select-none" ' +
                'onclick="_abToggleBukti(this)" ' +
                'data-full="' + fullEnc + '" data-short="' + shortEnc + '" data-exp="0">' +
                '<span>' + buktiShort + '</span>' +
                '</td>' +
                '</tr>';
        }).join('');
    }

    function _abToggleBukti(cell) {
        var exp = cell.dataset.exp === '1';
        cell.dataset.exp = exp ? '0' : '1';
        cell.querySelector('span').textContent = exp
            ? decodeURIComponent(cell.dataset.short)
            : decodeURIComponent(cell.dataset.full);
    }

    function _abRenderDetail(detail) {
        var tbody = document.getElementById('ab-detail-body');
        if (!tbody) return;
        if (!detail.length) {
            tbody.innerHTML = '<tr><td colspan="8" class="py-10 text-center text-gray-400">Tidak ada data.</td></tr>';
            return;
        }
        var chip = function (st) {
            var m = {
                HADIR: 'bg-emerald-100 text-emerald-700',
                TOLERANSI: 'bg-blue-100 text-blue-700',
                TELAT: 'bg-amber-100 text-amber-700',
                ALPHA: 'bg-red-100 text-red-700',
                OFF: 'bg-gray-100 text-gray-500'
            };
            return '<span class="px-2 py-0.5 rounded-lg text-[10px] font-black ' + (m[st] || m.OFF) + '">' + st + '</span>';
        };
        tbody.innerHTML = detail.map(function (r) {
            var kv = _abToMins(r.kI) !== null ? _abToMins(r.kI) : (_abToMins(r.kII) !== null ? _abToMins(r.kII) : null);
            var ks = kv !== null
                ? Math.floor(kv / 60).toString().padStart(2, '0') + ':' + (kv % 60).toString().padStart(2, '0')
                : '—';
            var isLate = r.late !== null && r.late > 0;
            var noMasuk = r.masukStr === '-';
            return '<tr class="border-b border-gray-50 hover:bg-gray-50/70 transition-all">' +
                '<td class="px-4 py-2.5 font-bold text-sm">' + r.nama + '</td>' +
                '<td class="px-4 py-2.5 text-xs text-gray-500">' + r.dept + '</td>' +
                '<td class="px-4 py-2.5 text-xs font-mono text-gray-500">' + r.tglFmt + '</td>' +
                '<td class="px-4 py-2.5 text-center text-xs font-mono font-bold ' + ((isLate || noMasuk) ? 'text-red-500' : 'text-gray-700') + '">' + r.masukStr + '</td>' +
                '<td class="px-4 py-2.5 text-center text-xs font-mono text-gray-400">' + ks + '</td>' +
                '<td class="px-4 py-2.5 text-center text-xs font-bold ' + (isLate ? 'text-amber-600' : 'text-gray-300') + '">' + (isLate ? r.late + ' mnt' : '—') + '</td>' +
                '<td class="px-4 py-2.5 text-center">' + chip(r.status) + '</td>' +
                '<td class="px-4 py-2.5 text-right text-xs font-black ' + (r.denda > 0 ? 'text-red-600' : 'text-gray-300') + '">' + (r.denda > 0 ? 'Rp ' + r.denda.toLocaleString('id-ID') : '—') + '</td>' +
                '</tr>';
        }).join('');
    }

    // ─── Dept Filter Pills ────────────────────────────────────────
    function _abBuildDeptFilterBtns() {
        var el = document.getElementById('ab-dept-filters');
        if (!el) return;
        var depts = ['ALL'].concat([...new Set(_ab.rawRows.map(function (r) { return r.dept; }).filter(Boolean))]);
        el.innerHTML = depts.map(function (d) {

                (a ? 'bg-gray-800 text-white border-transparent' : 'bg-white text-gray-500 border-gray-200 hover:border-blue-400 hover:text-blue-600') + '">' + d + '</button>';
        }).join('');
    }

    function _abSetDept(d) { _ab.filterDept = d; _abBuildDeptFilterBtns(); absenRender(); }

    // ─── Dept Shift Inputs ────────────────────────────────────────
    function _abBuildDeptShiftInputs() {
        var el = document.getElementById('ab-dept-shifts');
        if (!el) return;
        var depts = [...new Set(_ab.rawRows.map(function (r) { return r.dept; }).filter(Boolean))];
        el.innerHTML = depts.map(function (d) {
            var val = _ab.deptShifts[d] || _ab.deptShifts._default || '08:00';

                d + ' :' +
                '<input type="time" value="' + val + '" ' +
                'onchange="_ab.deptShifts[\'' + d.replace(/'/g, "\\'") + '\']=this.value; absenRecalc()" ' +
                'class="border-0 outline-none bg-transparent text-xs font-mono text-gray-700 w-20">' +
                '</label>';

    function absenUpdateDefaultShift() {
        var el = document.getElementById('ab-shift-default');
        if (!el) return;
        _ab.deptShifts._default = el.value;
        // Reset semua dept yang belum di-custom
        var depts = [...new Set(_ab.rawRows.map(function (r) { return r.dept; }).filter(Boolean))];
        depts.forEach(function (d) { _ab.deptShifts[d] = el.value; });
        absenRecalc();

    // ─── View Toggle ──────────────────────────────────────────────
    function setAbsenView(v) {
        _ab.view = v;
        var rv = document.getElementById('ab-rekap-view');
        var dv = document.getElementById('ab-detail-view');
        var tr = document.getElementById('ab-tab-rekap');
        var td = document.getElementById('ab-tab-detail');

        if (td) td.className = v === 'detail' ? on : off;

    // ─── Load from GAS (Google Sheets) ───────────────────────────
    function absenLoadSheets() {
        var sel = document.getElementById('ab-sheet-sel');
        if (!sel) return;
        sel.innerHTML = '<option value="">Menghubungkan...</option>';
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(function (res) {
                    if (res.success && res.sheets && res.sheets.length) {
                        sel.innerHTML = '<option value="">— Pilih periode —</option>' +
                            res.sheets.map(function (s) {
                                return '<option value="' + s.gid + '">' + s.name + '</option>';
                            }).join('');
                    } else {
                        sel.innerHTML = '<option value="">Tidak ada sheet ditemukan</option>';
                        showToast('Cek ABSEN_SPREADSHEET_ID di Code.gs.\nError: ' + (res.error || 'Tidak ada sheet.'), 'error');
                    }
                })
                .withFailureHandler(function (err) {
                    sel.innerHTML = '<option value="">Gagal konek</option>';
                    showToast('Koneksi GAS error: ' + err, 'error');
                })
                .getAbsenSheets();
        } else {
            sel.innerHTML = '<option value="">GAS tidak tersedia (preview only)</option>';
        }
    }

    function absenLoadData() {
        var sel = document.getElementById('ab-sheet-sel');
        if (!sel || !sel.value) return;
        showLoader(true, 'Memuat data absensi dari Google Sheets...');
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(function (res) {
                    showLoader(false);
                    if (res.success && res.data && res.data.length) {
                        _abLoadData(res.data.map(function (r) {
                            return Object.assign({}, r, { tglFmt: _abFmtDate(r.tgl) });
                        }));
                    } else if (res.success && res.totalRows === 0) {
                        showToast('Sheet kosong — tidak ada data absensi di sheet ini.', 'warning');
                    } else {
                        showToast('Gagal memuat data: ' + (res.error || 'Tidak ada data terbaca.'), 'error');
                    }
                })
                .withFailureHandler(function (err) {
                    showLoader(false);
                    showToast('Error GAS: ' + err, 'error');
                })
                .getAbsenRawData(sel.value);
        } else {
            showLoader(false);
        }
    }

    // ─── Upload File Lokal ────────────────────────────────────────
    function absenHandleFile(e) {
        var file = e.target.files[0];
        if (!file) return;
        showLoader(true, 'Membaca file absensi...');

        var done = function (text) {
            showLoader(false);
            var rows = _abParseText(text);
            if (rows.length) {
                _abLoadData(rows);
            } else {
                showToast('Format tidak dikenali.\nPastikan urutan kolom: ID | Nama | Dept | Tanggal | Masuk I | Keluar I | Masuk II | Keluar II', 'warning');
            }
        };

        if (file.name.match(/\.xlsx?$/i)) {
            if (typeof XLSX === 'undefined') {
                showLoader(false);
                showToast('Library XLSX belum termuat. Refresh halaman lalu coba lagi.', 'warning');
                return;
            }
            var reader = new FileReader();
            reader.onload = function (ev) {
                var data = new Uint8Array(ev.target.result);
                var wb;
                try {
                    wb = XLSX.read(data, { type: 'array' });
                } catch (err) {
                    showLoader(false);
                    showToast('Gagal membaca file: ' + err.message, 'error');
                    return;
                }

                // ── Deteksi sheet "Exception Stat." dari mesin finger ──
                var exSheet = wb.Sheets['Exception Stat.'] || wb.Sheets['Exception Stat'] || wb.Sheets['ExceptionStat'];
                if (exSheet) {
                    showLoader(false);
                    var rows = _abParseExceptionStat(exSheet);
                    if (rows.length) {
                        _abLoadData(rows);
                    } else {
                        showToast('Sheet "Exception Stat." ditemukan tapi tidak ada data yang terbaca.\nPastikan format file benar.', 'warning');
                    }
                    return;
                }

                // ── Fallback: coba parse sebagai CSV biasa ──
                var ws = wb.Sheets[wb.SheetNames[0]];
                done(XLSX.utils.sheet_to_csv(ws));
            };
            reader.readAsArrayBuffer(file);
        } else {
            // CSV / TSV
            var reader = new FileReader();
            reader.onload = function (ev) { done(ev.target.result); };
            reader.readAsText(file);
        }
    }

    // ─── Parser khusus "Exception Stat." dari mesin finger ───────
    // Struktur sheet:
    //   Row 0  : Judul "Exc. Lap. Statistik"
    //   Row 1  : Stat. Tgl (range tanggal)
    //   Row 2  : Header utama (ID, Nama, Departemen, Tgl, Timezone I, [blank], Timezone II, [blank], Terlambat(Min), ...)
    //   Row 3  : Sub-header (Masuk, Keluar, Masuk, Keluar, ...)
    //   Row 4+ : Data
    //
    // Kolom (0-based):
    //   0  = ID
    //   1  = Nama
    //   2  = Departemen
    //   3  = Tgl (format: "2026-03-01")
    //   4  = Timezone I Masuk   (e.g. "09:59" atau "")
    //   5  = Timezone I Keluar  (e.g. "18:01" atau "")
    //   6  = Timezone II Masuk  (jarang dipakai)
    //   7  = Timezone II Keluar (jarang dipakai)
    //   8  = Terlambat (Min)    ← sudah dihitung mesin
    //   9  = Pulang Awal (Min)
    //   10 = Absen (Min)        ← 420 = tidak absen sama sekali
    //   11 = Total (Min)
    //   12 = Catatan

    function _abParseExceptionStat(ws) {
        // Ubah sheet ke array-of-arrays
        var aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

        // Cari baris header (baris yang ada kata "ID" di kolom 0 atau "Nama" di kolom 1)
        var dataStart = 4; // default
        for (var i = 0; i < Math.min(10, aoa.length); i++) {
            var r = aoa[i];
            if (
                String(r[0] || '').trim().toUpperCase() === 'ID' &&
                String(r[1] || '').toLowerCase().includes('nama')
            ) {
                dataStart = i + 2; // lewati baris sub-header juga
                break;
            }
        }

        var rows = [];

        for (var i = dataStart; i < aoa.length; i++) {
            var r = aoa[i];

            // Skip baris kosong
            var nama = String(r[1] || '').trim();
            if (!nama) continue;

            // Skip baris judul / header terulang
            if (
                nama.toLowerCase() === 'nama' ||
                nama.toLowerCase().includes('exc.') ||
                nama.toLowerCase().includes('stat')
            ) continue;

            var id = String(r[0] || '').trim();
            var dept = String(r[2] || '').trim();
            var tgl = String(r[3] || '').trim();
            var mI = String(r[4] || '').trim();
            var kI = String(r[5] || '').trim();
            var mII = String(r[6] || '').trim();
            var kII = String(r[7] || '').trim();

            // Nilai yang sudah dihitung mesin (sebagai angka atau string)
            var terlambatMin = parseFloat(r[8]) || 0;
            var absenMin = parseFloat(r[10]) || 0;

            // Skip jika tidak ada tanggal valid
            if (!tgl || !tgl.match(/\d{4}-\d{2}-\d{2}/)) continue;

            // Normalisasi jam: "00:00" dari mesin = tidak valid (error punch)
            if (mI === '00:00') mI = '';
            if (mII === '00:00') mII = '';

            // Format tanggal ke DD/MM untuk tampilan
            var tglParts = tgl.split('-');
            var tglFmt = tglParts.length === 3
                ? tglParts[2].padStart(2, '0') + '/' + tglParts[1].padStart(2, '0')
                : tgl;

            rows.push({
                id: id,
                nama: nama,
                dept: dept,
                tgl: tgl,
                tglFmt: tglFmt,
                mI: mI,
                kI: kI,
                mII: mII,
                kII: kII,
                // Field tambahan dari mesin — dipakai _abCalcRowException
                _terlambatMin: terlambatMin,
                _absenMin: absenMin
            });
        }

        return rows;
    }

    // ─── Override _abCalcRow agar pakai data pra-hitung mesin ────
    // Simpan versi lama dulu supaya CSV biasa tetap jalan
    var _abCalcRowOriginal = _abCalcRow;

    function _abCalcRow(r) {
        // Kalau row dari Exception Stat., gunakan nilai pra-hitung mesin
        if (typeof r._terlambatMin !== 'undefined') {
            return _abCalcRowException(r);
        }
        // Fallback ke kalkulasi manual (untuk CSV biasa)
        return _abCalcRowOriginal(r);
    }

    function _abCalcRowException(r) {
        var dk = (r.dept && _ab.deptShifts[r.dept]) ? r.dept : '_default';
        var shift = _ab.deptShifts[dk] || '08:00';

        // Absen total (mesin catat 420 menit = tidak absen sama sekali)
        var absenMin = r._absenMin || 0;
        var terlambatMin = r._terlambatMin || 0;

        // Format jam masuk untuk tampilan
        var masukStr = r.mI || (r.mII || '—');
        if (!masukStr) masukStr = '—';

        // Tentukan keluar untuk display
        var keluarStr = r.kI || (r.kII || '—');

        // ── Klasifikasi status ──────────────────────────────────────
        // 1. Tidak ada data masuk sama sekali (absenMin tinggi, mI & mII kosong)
        var noMasuk = (!r.mI && !r.mII);
        var noKeluar = (!r.kI && !r.kII);

        if (noMasuk && noKeluar) {
            // Bisa OFF (hari libur/jadwal libur) atau ALPHA (seharusnya masuk)
            // Pakai absenMin: kalau 420 (7 jam) = mesin catat tidak absen
            if (absenMin >= 420) {
                return { status: 'ALPHA', denda: 60000, late: null, masukStr: '-', shift: shift };
            }
            return { status: 'OFF', denda: 0, late: null, masukStr: '—', shift: shift };
        }

        // 2. Ada keluar tapi tidak ada masuk = hanya keluar (mungkin lupa absen masuk)
        if (noMasuk && !noKeluar) {
            return { status: 'ALPHA', denda: 60000, late: null, masukStr: '-', shift: shift };
        }

        // 3. Ada masuk → pakai terlambatMin dari mesin
        var late = Math.round(terlambatMin);

        if (late === 0) {
            return { status: 'HADIR', denda: 0, late: 0, masukStr: masukStr, shift: shift };
        }

        // Cari tier denda
        var denda = 0;
        for (var i = AB_TIERS.length - 1; i >= 0; i--) {
            if (late >= AB_TIERS[i].min) {
                denda = AB_TIERS[i].denda;
                break;
            }
        }

        var status = denda >= 60000 ? 'ALPHA' : (late <= 10 ? 'TOLERANSI' : 'TELAT');
        return { status: status, denda: denda, late: late, masukStr: masukStr, shift: shift };
    }


    function _abParseText(text) {
        var lines = text.trim().split('\n').filter(function (l) { return l.trim(); });
        var rows = [];
        lines.forEach(function (line) {
            var sep = line.includes('\t') ? '\t' : ',';
            var c = line.split(sep).map(function (x) { return x.trim().replace(/^"|"$/g, ''); });
            if (c.length < 4) return;
            var nama = (c[1] || '').trim();
            if (!nama || nama.toLowerCase() === 'nama' || nama.toLowerCase() === 'name' || nama === 'B') return;
            var tgl = (c[3] || '').trim();
            if (!tgl || tgl.toLowerCase() === 'tanggal' || tgl.toLowerCase() === 'date') return;
            rows.push({
                id: c[0], nama: nama, dept: (c[2] || '').trim(),
                tgl: tgl, tglFmt: _abFmtDate(tgl),
                mI: (c[4] || '').trim(), kI: (c[5] || '').trim(),
                mII: (c[6] || '').trim(), kII: (c[7] || '').trim()
            });
        });
        return rows;
    }
