<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LOSHRIS Enterprise</title>

    <!-- PWA / Meta Tags -->
    <meta name="theme-color" content="#0b0b0c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="icon.png">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* dynamic viewport height, lebih akurat di browser mobile */
            overflow: hidden; /* Mencegah scroll ganda */
            background-color: #0b0b0c; /* samakan dgn tema gelap LOSHRIS, biar gak ada flash putih saat load */
        }
        iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            border: none;
            display: block;
            background-color: #0b0b0c;
            /* perhitungkan safe-area (notch, home indicator) */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <!-- Ganti URL di bawah ini dengan URL Deployment Google Apps Script Anda (yang berakhiran /exec) -->
    <iframe src="https://script.google.com/macros/s/AKfycbz8f6E2WkdFZMTLEGrPwbG86q5Doq1myEH7YbZtvlLZyG9JF1xvsh39iTcidgWOFclwVA/exec" allowfullscreen></iframe>

</body>
</html>
